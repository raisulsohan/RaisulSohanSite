  /* a demo shown live (Hormuz: WebGL + CSS 3D words + DOM tags) sits between the reel's picture canvas and its overlay canvas */

<script>
// Map animation showreel: 22 s at 120 BPM, so a beat is 0.5 s and a bar is 2 s. Every cut, word and hit sits on that grid.
// The pictures are the real demos, played through time-remaps; the reel adds the type, the transitions and its own score.
//   0 – 2   hook: MAPS · THAT · MOVE, each word a window onto a demo; the camera dives through the last word
//   2 – 19  montage: explainer → data → true crime → geopolitics → history, the shots get shorter toward the climax
//  19 – 22  the drop: a wall of all thirteen styles and the end title
// Layers in #stage: the picture canvas (every canvas demo, the hook, the end card) → a live demo layer (Hormuz, only in its
// shot: part of its picture is DOM) → the overlay canvas (stamps, pill, flashes, the dip) → the grain canvas.
(() => {
  const { clamp, lerp, prog, ease: E } = K;
  const BEAT = .5;

  // ── styles and groups
  const SEC = {
    EXPLAINER: { col: '#ffcc2e', ink: '#14120e' },
    DATA: { col: '#4fe3ff', ink: '#03131d' },
    'TRUE CRIME': { col: '#ff2d3d', ink: '#ffffff' },
    GEOPOLITICS: { col: '#ff7a1e', ink: '#1a0b02' },   // the missile flare of the Hormuz piece
    HISTORY: { col: '#8fb3ff', ink: '#06122a' },
  };
  const NAME = {
    '01': ['VOX EXPLAINER', 'EXPLAINER'], '02': ['GLOBE DIVE', 'EXPLAINER'], '03': ['NEON DATA ROUTES', 'DATA'], '04': ['3D DATA MAP', 'DATA'],
    '05': ['EVIDENCE BOARD', 'TRUE CRIME'], '06': ['SURVEILLANCE', 'TRUE CRIME'], '07': ['CASE DOSSIER', 'TRUE CRIME'], '08': ['SEARCH GRID', 'TRUE CRIME'],
    '09': ['VOX CITY REVEAL', 'EXPLAINER'], '10': ['NIGHT GOLD CITY', 'EXPLAINER'], '11': ['SHIFTING SHORES', 'EXPLAINER'], '12': ['WAR FRONT MAP', 'HISTORY'],
    '13': ['STRAIT OF HORMUZ', 'GEOPOLITICS'],
  };
  const COUNT = String(Object.keys(NAME).length);
  // demos shown live in their own DOM layer, and the file each cut uses (13v = the re-laid-out 4:5 file of the same piece)
  const LIVE = { '13': { h: '13', v: '13v' } };

  // ── cut list: reel seconds → demo seconds (linear between keys unless an ease is named; outside the keys it runs on at the edge speed)
  const SHOTS = [
    { id: '02', a: 2.0, b: 4.0, map: [[1.0, 1.7], [2.0, 3.3], [4.0, 6.35]] },                     // out of the dive through "MOVE", on the downbeat; its flash lands on 4.0
    { id: '01', a: 4.0, b: 6.0, map: [[4.0, 4.0], [6.0, 7.1]] },                                  // rivers draw, labels pop, the halftone starts
    { id: '09', a: 6.0, b: 7.0, map: [[6.0, 1.85], [7.0, 3.65]] },                                // Manhattan fills block by block
    { id: '10', a: 7.0, b: 8.0, map: [[7.0, 2.3], [8.0, 4.4]] },                                  // Dhaka switches on
    { id: '03', a: 8.0, b: 9.5, map: [[8.0, 2.3], [9.5, 5.55]] },                                 // routes fly in; the shock ring on 9.5
    { id: '04', a: 9.5, b: 11.0, map: [[9.5, 3.6], [10.0, 4.2], [11.0, 5.8, 'out']] },            // Bangladesh's tower slams up on 10.0
    { id: '07', a: 11.0, b: 12.0, map: [[11.0, 2.5], [12.0, 5.3]] },                              // the escape route, stop by stop
    { id: '06', a: 12.0, b: 13.0, map: [[12.0, 7.9], [12.5, 8.9], [13.0, 9.35, 'out']] },          // SIGNAL LOST on 12.5
    { id: '08', a: 13.0, b: 14.0, map: [[13.0, 6.9], [14.0, 8.5]] },                              // the find, outside the search zone
    { id: '05', a: 14.0, b: 15.0, map: [[14.0, 7.5], [14.5, 8.2], [15.0, 8.75, 'out']] },          // UNSOLVED on 14.5
    { id: '13', a: 15.0, b: 17.0, map: [[15.0, 13.55], [15.5, 13.95], [16.0, 14.55], [17.0, 16.4]] },  // three launches on 15.5 · 15.75 · 16.0, then out over the water
    { id: '12', a: 17.0, b: 19.0, map: [[17.0, 7.0], [18.5, 13.98, 'inOutSine'], [19.0, 14.5, 'out']] },   // a year of war in 1.5 s; China strikes on 18.5
  ];
  const HOOK = [
    { word: 'MAPS', id: '10', a: 0, b: .5, map: [[0, 3.2], [.5, 3.8]] },
    { word: 'THAT', id: '12', a: .5, b: 1.0, map: [[.5, 9.3], [1.0, 9.9]] },
    { word: 'MOVE', id: '13', a: 1.0, b: 2.0, map: [[1.0, 14.15], [1.25, 14.55], [2.0, 16.3]] },   // Hormuz live in the letters: the third missile off the rail on 1.25, then all three race out
  ];
  // transitions: d = [s before the cut, s after it]. Next to a live layer only flash and pullOut (made with CSS on the layer
  // plus the overlay canvas); glitch and RGB split need its pixels.
  const TRANS = [
    { at: 4.0, type: 'flash', d: [.12, .32] },
    { at: 6.0, type: 'push', d: [.12, .12] },
    { at: 7.0, type: 'slices', d: [.1, .26] },
    { at: 8.0, type: 'pullOut', d: [.1, .22] },
    { at: 9.5, type: 'iris', d: [0, .3] },
    { at: 11.0, type: 'glitch', d: [.1, .14] },
    { at: 12.0, type: 'push', d: [.1, .1], vertical: true },
    { at: 13.0, type: 'glitch', d: [.08, .14] },
    { at: 14.0, type: 'pushIn', d: [.12, .16] },
    { at: 15.0, type: 'flash', d: [.08, .3] },
    { at: 17.0, type: 'pullOut', d: [.1, .24] },
  ];
  const STAMPS = [[4.0, 'EXPLAINER'], [8.0, 'DATA'], [11.0, 'TRUE CRIME'], [15.0, 'GEOPOLITICS'], [17.0, 'HISTORY']];
  const IMPACTS = [[0, 5], [.5, 5], [1.0, 5], [2.0, 9], [4.0, 6], [10.0, 14], [12.5, 7], [14.5, 6], [15.5, 9], [15.75, 7], [16.0, 8], [18.5, 12], [19.0, 18]];   // [s, px of shake]
  const DROP = 19.0, BRK = 18.75;   // the end card lands on DROP; BRK → DROP is silent

  // ── the score, in code: F minor, 120 BPM (i – VI – III – VII), a break before the drop, Ab major at the end
  const SCORE = {
    master: .5, peak: .89, fadeIn: 0, seed: 2026, wet: .3, root: 56,
    compose({ ac, out, osc, nsrc, filt, env, hz, fx, master }) {
      const B = BEAT;   // BRK → DROP is silent: the drop lands out of nothing
      const m = SCORE.master; master.gain.setValueAtTime(m, BRK - .03); master.gain.linearRampToValueAtTime(m * .05, BRK + .05); master.gain.setValueAtTime(m * .05, DROP - .005); master.gain.linearRampToValueAtTime(m, DROP);
      const ok = t => t < BRK - .01 || t >= DROP;
      // i – VI – III – VII round and round (a bar each from 2 s); the half bar before the break is the dominant, C; the drop is i again
      const CHORD = t => t < 4 ? 'Fm' : t < 6 ? 'Db' : t < 8 ? 'Ab' : t < 10 ? 'Eb' : t < 12 ? 'Fm' : t < 14 ? 'Db' : t < 16 ? 'Ab' : t < 18 ? 'Eb' : t < DROP ? 'C' : t < 20 ? 'Fm' : t < 21 ? 'Db' : 'Ab';
      const BASS = { Fm: 41, Db: 37, Ab: 44, Eb: 39, C: 36 };
      const VOX = { Fm: [65, 68, 72, 77], Db: [65, 68, 73, 77], Ab: [63, 68, 72, 75], Eb: [63, 67, 70, 75], C: [64, 67, 72, 76] };

      // sidechain: pads and bass dip under every kick
      const pump = ac.createGain(); out(pump, .2);
      const KICKS = [0, .5, 1.0]; for (let t = 2; t < BRK; t += B) KICKS.push(t); KICKS.push(DROP, DROP + 1);
      for (const t of KICKS) { pump.gain.setValueAtTime(.3, t); pump.gain.setTargetAtTime(1, t + .02, .08); }

      const kick = (t, v = .85) => {
        const o = osc('sine', 160, t, .45), g = ac.createGain(); o.frequency.exponentialRampToValueAtTime(48, t + .1); o.frequency.exponentialRampToValueAtTime(38, t + .4);
        env(g, t, .002, v, .36); o.connect(g); out(g, 0);
        const n = nsrc(t, .02), f = filt('highpass', 2500), g2 = ac.createGain(); env(g2, t, .001, v * .22, .012); n.connect(f).connect(g2); out(g2, 0);
      };
      const clap = (t, v = .3) => {
        const n = nsrc(t, .3), f = filt('bandpass', 1500, .9), g = ac.createGain();
        for (const d of [0, .011, .023]) { g.gain.setValueAtTime(v, t + d); g.gain.exponentialRampToValueAtTime(v * .2, t + d + .01); }
        g.gain.setValueAtTime(v * .6, t + .034); g.gain.exponentialRampToValueAtTime(1e-4, t + .26);
        n.connect(f).connect(g); out(g, .4, .05);
      };
      const hat = (t, v = .05, open = false, pan = .2) => { const n = nsrc(t, open ? .25 : .06), f = filt('highpass', open ? 7000 : 8500), g = ac.createGain(); env(g, t, .001, v, open ? .2 : .035); n.connect(f).connect(g); out(g, .08, pan); };
      const bass = (t, n, d, v = .14) => {
        const o = osc('sawtooth', hz(n), t, d + .05), o2 = osc('sine', hz(n - 12), t, d + .05), f = filt('lowpass', 900, 1.4), g = ac.createGain();
        f.frequency.setValueAtTime(1400, t); f.frequency.exponentialRampToValueAtTime(260, t + d);
        env(g, t, .005, v, d); o.connect(f); o2.connect(f); f.connect(g); g.connect(pump);
      };
      const stab = (t, notes, v = .06, d = .35, cut = 2600) => {
        for (const n of notes) for (const det of [-9, 9]) {
          const o = osc('sawtooth', hz(n), t, d + .1), f = filt('lowpass', cut, .8), g = ac.createGain(); o.detune.value = det;
          f.frequency.setValueAtTime(cut, t); f.frequency.exponentialRampToValueAtTime(cut * .25, t + d);
          env(g, t, .004, v, d); o.connect(f).connect(g); out(g, .4, det > 0 ? .2 : -.2);
        }
      };
      const pad = (t0, t1, notes, v = .02, cut = 900, rel = .3) => notes.forEach(n => [-7, 7].forEach(det => {
        const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz(n - 12); o.detune.value = det;
        const f = filt('lowpass', cut, .5), g = ac.createGain();
        g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(v, t0 + .25); g.gain.setValueAtTime(v, t1 - .05); g.gain.linearRampToValueAtTime(0, t1 + rel);
        o.connect(f).connect(g); g.connect(pump); o.start(t0); o.stop(t1 + rel + .05);
      }));
      const pluck = (t, n, v = .045, type = 'triangle', cut = 3000, pan = 0) => { const o = osc(type, hz(n), t, .3), f = filt('lowpass', cut), g = ac.createGain(); env(g, t, .002, v, .22); o.connect(f).connect(g); out(g, .3, pan); };
      const tom = (t, n = 45, v = .35) => {
        const o = osc('sine', hz(n) * 1.8, t, .5), g = ac.createGain(); o.frequency.exponentialRampToValueAtTime(hz(n), t + .09); env(g, t, .002, v, .4); o.connect(g); out(g, .2);
        const s = nsrc(t, .08), f = filt('lowpass', 1200), g2 = ac.createGain(); env(g2, t, .001, v * .3, .06); s.connect(f).connect(g2); out(g2, .2);
      };
      const snare = (t, v = .2) => {
        const s = nsrc(t, .15), f = filt('bandpass', 1900, .7), g = ac.createGain(); env(g, t, .001, v, .11); s.connect(f).connect(g); out(g, .3);
        const o = osc('triangle', 200, t, .1), g2 = ac.createGain(); o.frequency.exponentialRampToValueAtTime(140, t + .08); env(g2, t, .001, v * .5, .07); o.connect(g2); out(g2, .1);
      };
      const crash = (t, v = .14, d = 1.6) => { const s = nsrc(t, d), f = filt('highpass', 5000), g = ac.createGain(); env(g, t, .002, v, d); s.connect(f).connect(g); out(g, .5); };
      const sonar = (t, ch, v = .05) => {   // a radar ping: a high sine on the chord's top note that bends down a little and rings out in the reverb
        const n = VOX[ch][3] + 12, o = osc('sine', hz(n), t, .9), g = ac.createGain(); o.frequency.exponentialRampToValueAtTime(hz(n) * .97, t + .6);
        env(g, t, .003, v, .7); o.connect(g); out(g, .9, .15);
      };
      const ignite = (t, v = .3, pan = 0) => {        // a missile off the rail: a hard noise burst that roars down
        const s = nsrc(t, .7), f = filt('lowpass', 6000, .7), g = ac.createGain(); f.frequency.setValueAtTime(6000, t); f.frequency.exponentialRampToValueAtTime(500, t + .6);
        env(g, t, .002, v, .6); s.connect(f).connect(g); out(g, .35, pan);
      };
      const sub = (t, n, d, v = .45) => { const o = osc('sine', hz(n), t, d), g = ac.createGain(); o.frequency.exponentialRampToValueAtTime(hz(n) * .5, t + d); env(g, t, .01, v, d); o.connect(g); out(g, 0); };

      // ── hook (0 – 2): three words, three hits; a riser and a whoosh carry the dive through "MOVE"
      for (const t of [0, .5, 1.0]) { kick(t, .9); sub(t, 29, .5, .32); stab(t, VOX.Fm.map(n => n - 12), .035, .3, 1400); fx.tick(t, .18); }
      pad(0, 2, VOX.Fm, .015, 600);
      fx.riser(1.0, 1.0, .2); fx.whoosh(1.5, .5, .36);
      ignite(1.25, .24, .25); fx.boom(1.25, .22); fx.whoosh(1.3, .45, .18);   // "MOVE": the third missile off the rail, then the race out

      // ── groove (2 – 18.75)
      crash(2, .13, 1.6);
      for (let t = 2; t < BRK - 1e-6; t += B) {
        const ch = CHORD(t), beat = Math.round(t / B) % 4, bn = BASS[ch];
        kick(t, .8);
        if (t >= 4 && t < 17 && beat % 2) clap(t, .28);
        if (t < 8 || t >= 17) { if (ok(t + B / 2)) hat(t + B / 2, .055, t >= 17); }
        else for (let k = 0; k < 4; k++) hat(t + k * B / 4, k === 2 ? .06 : .032, false, k % 2 ? .25 : -.15);
        if (t < 8) { if (ok(t + B / 2)) bass(t + B / 2, bn, .2, .14); }
        else for (let k = 1; k < 4; k++) if (ok(t + k * B / 4)) bass(t + k * B / 4, bn + (k === 3 ? 12 : 0), .1, .1);
        if (t >= 4 && t < 11) {   // arp in 16ths through the chord: soft triangle for the explainers, a brighter square for the data maps
          const v = VOX[ch];
          for (let k = 0; k < 4; k++) { const s = Math.round(t / B) * 4 + k, n = v[[0, 1, 2, 3, 2, 1, 3, 2][s % 8]] + (s % 16 >= 8 ? 12 : 0); pluck(t + k * B / 4, n, t < 8 ? .045 : .036, t < 8 ? 'triangle' : 'square', t < 8 ? 3200 : 1800, k % 2 ? .3 : -.3); }
        }
        if (t >= 11 && t < 15) for (let k = 0; k < 4; k++) fx.tick(t + k * B / 4, k ? .045 : .08);   // true crime: a clock in 16ths
        if (t >= 15 && t < 17) { sonar(t, ch); }                                                    // geopolitics: a radar ping on every beat
        if (t >= 17) { tom(t, 45, .28); if (ok(t + B / 2)) tom(t + B / 2, 41, .2); }               // history: war drums
      }
      for (let t = 2; t < BRK; t += 2) { const t1 = Math.min(t + 2, BRK); pad(t, t1, VOX[CHORD(t)], .02, t >= 11 && t < 15 ? 650 : 950, t1 === BRK ? .04 : .3); }
      for (let t = 18, k = 0; t < BRK - .01; k++) { snare(t, .08 + .18 * (t - 18) / .75); t += k < 4 ? B / 4 : B / 8; }   // roll into the break
      fx.riser(17.0, 1.75, .26);

      // ── transitions
      fx.hit(4, .45); crash(4, .1, 1.2); fx.shimmer(4.02, .06);
      fx.whoosh(5.86, .3, .3);
      fx.whoosh(6.88, .34, .24); for (let k = 0; k < 7; k++) fx.tick(6.9 + k * .022, .1);
      fx.whoosh(7.88, .36, .3);
      fx.hit(9.5, .4); fx.shimmer(9.52, .06);
      fx.boom(10, .5);
      fx.glitch(10.92, .22, .26); stab(11, [65, 66, 72], .045, .45, 1600);
      fx.whoosh(11.89, .24, .24);
      fx.glitch(12.47, .45, .3); fx.hit(12.5, .35);
      fx.glitch(12.93, .2, .22);
      for (const t of [13.12, 13.22, 13.32]) fx.blip(t, 1.3, .06);
      fx.whoosh(13.87, .3, .28);
      fx.boom(14.5, .55);
      fx.hit(15, .42); crash(15, .1, 1.2); fx.blip(15.02, .75, .05);   // geopolitics: the flash in, a lock-on blip
      // Hormuz: three launches on 15.5 · 15.75 · 16.0 (8ths), then the missiles streak out over the water until the cut
      [[15.5, .4, .34], [15.75, .26, .28], [16.0, .34, .3]].forEach(([t, b, ig], i) => { fx.boom(t, b); ignite(t, ig, (i - 1) * .3); });
      fx.whoosh(16.02, .9, .3); fx.whoosh(16.3, .7, .2);
      fx.whoosh(16.86, .3, .26);                                       // the pull-out to the war map
      fx.hit(17, .4); crash(17, .09, 1.2);
      fx.boom(18.5, .45);

      // ── the drop (19) and the end title
      const D = DROP;
      kick(D, 1); sub(D, 29, 1.8, .5); crash(D, .2, 2.4); fx.boom(D, .6); fx.shimmer(D + .02, .09);
      stab(D, VOX.Fm, .075, .7, 3400); stab(D, VOX.Fm.map(n => n - 12), .045, .7, 2000);
      pad(D, D + 1, VOX.Fm, .026, 1500); pad(D + 1, D + 2, VOX.Db, .026, 1500); pad(D + 2, D + 3.4, VOX.Ab, .028, 1600);
      fx.hit(D + .4, .22); fx.whoosh(D + .66, .34, .2);
      kick(D + 1, .65); stab(D + 1, VOX.Db, .042, .5, 2600); crash(D + 1, .07, 1.4);
      fx.type(D + 1.0, 14, .4, .1); fx.type(D + 1.1, 12, .3, .08);   // the genre line and the contact heading type themselves
      fx.pop(D + 1.2, 1.2, .12); fx.pop(D + 1.32, 1.5, .12);         // the contact chips land
      stab(D + 2, VOX.Ab, .038, 1.2, 2200); fx.shimmer(D + 2, .07); fx.note(D + 2, 44, .12, 1.6);
    },
  };

  MapPlayer({
    title: 'Map Animation Showreel',
    DUR: 22,
    score: SCORE,
    async setup(stage, { W, H, FPS, VERT }) {
      const U = Math.min(W, H) / 1080, inExpo = u => u <= 0 ? 0 : Math.pow(2, 10 * u - 10);
      const box = document.createElement('div'); box.id = 'reelLoad';
      box.innerHTML = '<b>MAPS THAT MOVE</b><span>LOADING THE MAPS</span><i><span></span></i>';
      stage.appendChild(box);
      const say = (s, f) => { box.children[1].textContent = s; if (f != null) box.querySelector('i span').style.width = (f * 100).toFixed(1) + '%'; };

      // fonts for every demo (merged by the build), then the reel's own
      if (REEL.fonts) await new Promise(res => { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = REEL.fonts; l.onload = l.onerror = res; document.head.appendChild(l); });

      stage.appendChild(clipSvg); const clipText = clipSvg.querySelector('text'), clipDisc = clipSvg.querySelector('circle');
      // the dive: a disc grows out of the dive point inside the stroke, so the picture fills the whole frame before the cut on 2.0

      function liveWord(h, t, base, tf, dy, zu) {
        const c = C[h.id], st = c.live.style, m = new DOMMatrix().translate(0, -dy).multiply(tf);   // in the layer's own box (the layer is moved by dy)
        clipDisc.setAttribute('cx', (ZP[0] + SH.x).toFixed(1)); clipDisc.setAttribute('cy', (ZP[1] + SH.y - dy).toFixed(1));
        clipDisc.setAttribute('r', (Math.hypot(W, H) * E.inOut(prog(zu, .5, .95))).toFixed(1));
        clipText.textContent = h.word; clipText.setAttribute('x', W / 2); clipText.setAttribute('y', base);
        clipText.setAttribute('transform', `matrix(${[m.a, m.b, m.c, m.d, m.e, m.f].map(v => +v.toFixed(5)).join(' ')})`);
        shown.add(c); st.display = ''; st.transform = `translate(0px, ${dy.toFixed(2)}px)`; st.opacity = ''; st.filter = ''; st.clipPath = 'url(#hookClip)';
        c.draw(clamp(remap(h.map, t), 0, c.dur - 1 / FPS), frameNo);
      }

      function furniture(t, a) {   // viewfinder corners and labels around the hook
        const m = 44 * U, l = 40 * U, F = mono(500, 20), col = 'rgba(232,236,243,.82)';
        g.save(); g.globalAlpha = a; g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 2 * U;
        for (const [x, y, sx, sy] of [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]]) { g.beginPath(); g.moveTo(x, y + sy * l); g.lineTo(x, y); g.lineTo(x + sx * l, y); g.stroke(); }
        const tl = 'MAP ANIMATION', tr = 'SHOWREEL 2026', bl = `${COUNT} STYLES  ·  ${Object.keys(SEC).length} GENRES`, f = Math.floor(t * FPS + 1e-6);
        const tc = `00:00:${String(Math.floor(f / FPS)).padStart(2, '0')}:${String(f % FPS).padStart(2, '0')}`;
        K.text(g, scramble(tl, t, .05, .45), m + 18 * U, m + 34 * U, { font: F, color: col, spacing: 3 });
        textAt(scramble(tr, t, .1, .5), tr, W - m - 18 * U, m + 34 * U, { font: F, color: col, spacing: 3, align: 'right' });
        K.text(g, scramble(bl, t, .2, .6), m + 18 * U, H - m - 18 * U, { font: F, color: col, spacing: 3 });
        K.text(g, tc, W - m - 18 * U, H - m - 18 * U, { font: F, color: '#ffcc2e', spacing: 3, align: 'right' });
        g.restore();
      }
      function hook(t) {
        g.fillStyle = '#05070b'; g.fillRect(0, 0, W, H);
        const zu = prog(t, 1.5, 2.0), furn = 1 - E.out(prog(t, 1.5, 1.75));
        if (furn > 0) {   // a faint grid behind the words
          const st = 64 * U; g.save(); g.globalAlpha = furn; g.strokeStyle = 'rgba(255,255,255,.045)'; g.lineWidth = 1; g.beginPath();
          for (let x = (W / 2) % st; x < W; x += st) { g.moveTo(x, 0); g.lineTo(x, H); }

          // the word's transform: the dive, then its own landing scale about its centre

          mg.setTransform(1, 0, 0, 1, 0, 0); mg.clearRect(0, 0, W, H); mg.setTransform(tf);
          mg.font = `400 ${FS}px Anton`; mg.textAlign = 'center'; mg.fillStyle = '#fff'; mg.fillText(h.word, W / 2, base);
          // 4:5: the map is moved so its middle sits behind the word's row (and slides back to full frame during the dive)
          const dy = STACK ? (wy - H / 2) * (i === HOOK.length - 1 ? 1 - E.inOut(zu) : 1) : 0;
          const inLayer = live && isLive(h);   // a live demo: its own layer, so the flash and the outline go on the overlay canvas above it
          if (inLayer) { liveWord(h, t, base, tf, dy, i === HOOK.length - 1 ? zu : 0); g = gO; }
          else {
            lg.globalCompositeOperation = 'copy'; lg.drawImage(live ? pic(h.id, remap(h.map, t)) : held(i), 0, dy);
            lg.globalCompositeOperation = 'destination-in'; lg.drawImage(mask, 0, 0); lg.globalCompositeOperation = 'source-over';
            g.save(); g.globalAlpha = live ? 1 : .5 * furn; g.drawImage(lay, 0, 0); g.restore();
          }
          const fl = 1 - prog(t, h.a, h.a + .13); if (fl > 0) { g.save(); g.globalAlpha = fl * .95; g.drawImage(mask, 0, 0); g.restore(); }   // each word lands white, then opens onto its map
          if (furn > 0) {   // a thin outline keeps the word readable where its map is dark
            g.save(); g.setTransform(tf); g.font = `400 ${FS}px Anton`; g.textAlign = 'center'; g.strokeStyle = `rgba(255,255,255,${((live ? .4 : .3) * furn).toFixed(3)})`;
            g.lineWidth = 2 * U / (zs * es); g.strokeText(h.word, W / 2, base); g.restore();
          }

        }
        if (furn > 0) { g = gO; furniture(t, furn); g = g0; }   // over the words (and over a live word's layer)
      }
      // a word that is no longer the newest keeps its map's last frame (made once, so scrubbing stays exact)
      const helds = {};
      function held(i) {
        if (!helds[i]) { const h = HOOK[i]; helds[i] = K.canvas(W, H); helds[i].getContext('2d').drawImage(pic(h.id, remap(h.map, h.b - 1 / FPS)), 0, 0); }
        return helds[i];
      }

      // ── montage
      function montage(t) {
        const x = TRANS.find(x => t >= x.at - x.d[0] && t < x.at + x.d[1]);
        if (x) {
          const a = shotAt(x.at - 1e-4), b = shotAt(x.at);
          if (isLive(a) || isLive(b)) TRL[x.type](t, x, a, b); else TR[x.type](t, x, () => shotPic(a, t), () => shotPic(b, t));
        } else { const s = shotAt(t); if (isLive(s)) { blank(); liveAt(s, t); } else put(shotPic(s, t)); }
      }
      function dip(t) { const dk = E.in(prog(t, DROP - .2, DROP)); if (dk > 0) { g.fillStyle = `rgba(0,0,0,${(dk * .85).toFixed(3)})`; g.fillRect(0, 0, W, H); } }   // dip before the drop
      // a group title on a colour bar that wipes in and out (0.85 s)
      function stamps(t) {
        STAMPS.forEach(([t0, word], i) => {
          const u = t - t0; if (u < 0 || u > .85) return;
          const S = SEC[word], fs = Math.round(Math.min(H * .17, W * .14)), F = `400 ${fs}px Anton`;
          g.font = F; g.letterSpacing = `${2 * U}px`; const tw = g.measureText(word).width; g.letterSpacing = '0px';
          const pad = fs * .22, bw = tw + pad * 2, bh = fs * 1.1, x0 = Math.round(W * .065), yc = H * .5;
          const L = x0 + bw * inExpo(prog(u, .6, .82)), R = x0 + bw * E.outExpo(prog(u, 0, .2)); if (R <= L) return;
          g.save(); g.shadowColor = 'rgba(0,0,0,.4)'; g.shadowBlur = 34 * U; g.shadowOffsetY = 12 * U; g.fillStyle = S.col; g.fillRect(L, yc - bh / 2, R - L, bh); g.restore();
          g.save(); g.beginPath(); g.rect(L, yc - bh / 2, R - L, bh); g.clip();
          K.text(g, word, x0 + pad - (1 - E.outExpo(prog(u, .04, .32))) * fs * .5 + u * 26 * U, yc + fs * .37, { font: F, color: S.ink, spacing: 2 * U });
          g.restore();
          const ta = E.out(prog(u, .08, .2)) * (1 - prog(u, .55, .7));
          K.text(g, `0${i + 1} / 0${STAMPS.length}`, x0, yc - bh / 2 - 18 * U, { font: mono(700, 20), color: '#fff', spacing: 4, alpha: ta, shadow: ['rgba(0,0,0,.6)', 8] });
        });
      }
      // the style's name in a pill at the bottom; it re-types itself on every cut
      const pillW = id => { const [nm, sec] = NAME[id]; g.font = mono(700, 17); g.letterSpacing = '3px'; const a = g.measureText(sec).width; g.font = mono(500, 20); g.letterSpacing = '2px'; const b = g.measureText(`${id} / ${COUNT}   ${nm}`).width; g.letterSpacing = '0px'; return [a, b]; };
      function pill(t) {
        const a = E.out(prog(t, 2.05, 2.35)) * (1 - prog(t, DROP - .4, DROP - .15)); if (a <= 0) return;
        const i = SHOTS.indexOf(shotAt(t)), s = SHOTS[i], [nm, sec] = NAME[s.id], since = t - Math.max(s.a, 2.0);
        const ph = 46 * U, pad = 22 * U, dot = 10 * U, gap = 16 * U, wOf = id => { const [p, q] = pillW(id); return pad * 2 + dot + gap + p + gap * 1.6 + q; };
        const w = i > 0 && since < .3 ? lerp(wOf(SHOTS[i - 1].id), wOf(s.id), E.outExpo(since / .3)) : wOf(s.id), [ws] = pillW(s.id);
        const x = W / 2 - w / 2, y = H - 66 * U - ph / 2, col = SEC[sec].col;
        g.save(); g.globalAlpha = a; g.translate(0, (1 - a) * 20 * U);
        g.fillStyle = 'rgba(6,8,12,.74)'; g.beginPath(); g.roundRect(x, y, w, ph, ph / 2); g.fill(); g.strokeStyle = 'rgba(255,255,255,.14)'; g.lineWidth = 1.5 * U; g.stroke(); g.clip();
        g.fillStyle = col; g.beginPath(); g.arc(x + pad + dot / 2, y + ph / 2, dot / 2, 0, 7); g.fill();
        K.text(g, sec, x + pad + dot + gap, y + ph / 2 + 6 * U, { font: mono(700, 17), color: col, spacing: 3 });
        K.text(g, scramble(`${s.id} / ${COUNT}   ${nm}`, since, 0, .3), x + pad + dot + gap + ws + gap * 1.6, y + ph / 2 + 7 * U, { font: mono(500, 20), color: '#f0f3f8', spacing: 2 });
        g.restore();
      }

      // ── the end: a wall of all thirteen styles, then the title.
      // 13 fills no full grid, so the rows are bricks (long and short rows, offset by half a tile): 4 · 5 · 4 in 16:9,
      // 3 · 2 · 3 · 2 · 3 in 4:5, every style once, Hormuz in the middle. Around them, rings of repeats (dimmed) so the
      // tilted wall runs off every edge.
      const WALL = VERT ? [['02', '12', '01'], ['03', '10'], ['07', '13', '04'], ['05', '08'], ['06', '09', '11']]
        : [['07', '02', '12', '01'], ['03', '10', '13', '04', '05'], ['08', '06', '09', '11']];
      const tw = (VERT ? .4 : .22) * W, th = tw * 9 / 16, wgap = 22 * U, ALL = WALL.flat();
      const TILES = (() => {
        const R = WALL.length, MX = Math.max(...WALL.map(r => r.length)), other = n => n === MX ? MX - 1 : MX, out = [];
        for (let r = -2; r <= R + 1; r++) {
          const edge = r < 0 ? 0 : r >= R ? R - 1 : r, n = r === edge || Math.abs(r - edge) % 2 === 0 ? WALL[edge].length : other(WALL[edge].length);
          for (let c = -2; c < n + 2; c++) {
            const inner = r === edge && c >= 0 && c < n, id = inner ? WALL[r][c] : ALL[Math.floor(K.hash((r + 5) * 17 + c + 7) * ALL.length)];
            const x = (c - (n - 1) / 2) * (tw + wgap), y = (r - (R - 1) / 2) * (th + wgap);
            out.push({ id, x, y, inner, d: Math.hypot(x / tw, y / th) });
          }
        }
        [...out].sort((a, b) => a.d - b.d).forEach((o, k) => { o.t0 = k * (o.inner ? .028 : .013); });
        return out;
      })();
      function endCard(t) {
        const u = t - DROP;
        g.fillStyle = '#05070b'; g.fillRect(0, 0, W, H);
        const ws = lerp(1.22, 1, E.outExpo(prog(u, 0, .7))) * (1 + .012 * u), dim = E.inOut(prog(u, .3, .9));
        g.save(); g.translate(W / 2 + SH.x, H / 2 + SH.y); g.rotate(-.075); g.transform(1, 0, -.16, 1, 0, 0); g.scale(ws, ws); g.translate(-u * 26 * U, -u * 8 * U);
        for (const o of TILES) {
          const k = prog(u, o.t0, o.t0 + .4); if (k <= 0) continue;
          const sc = lerp(1.3, 1, E.outExpo(k)), [nm, sec] = NAME[o.id], im = thumbs[o.id];
          g.save(); g.translate(o.x, o.y); g.scale(sc, sc); g.globalAlpha = clamp(k * 5) * (o.inner ? 1 : .45);
          if (im) g.drawImage(im, -tw / 2, -th / 2, tw, th); else { g.fillStyle = '#1a1f29'; g.fillRect(-tw / 2, -th / 2, tw, th); }
          const fl = 1 - prog(u, o.t0, o.t0 + .22); if (fl > 0) { g.fillStyle = `rgba(255,255,255,${(fl * .85).toFixed(3)})`; g.fillRect(-tw / 2, -th / 2, tw, th); }
          g.fillStyle = 'rgba(5,7,11,.74)'; g.fillRect(-tw / 2, th / 2 - 34 * U, tw, 34 * U); g.fillStyle = SEC[sec].col; g.fillRect(-tw / 2, th / 2 - 34 * U, 5 * U, 34 * U);
          K.text(g, `${o.id}  ${nm}`, -tw / 2 + 16 * U, th / 2 - 11 * U, { font: mono(700, 15), color: 'rgba(240,243,248,.92)', spacing: 2, alpha: 1 - .85 * dim });   // names fade as the title comes in
          g.strokeStyle = 'rgba(255,255,255,.22)'; g.lineWidth = 2 * U / ws; g.strokeRect(-tw / 2, -th / 2, tw, th);
          g.restore();
        }
        g.restore();
        if (dim > 0) { const gr = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.hypot(W, H) * .55); gr.addColorStop(0, `rgba(4,6,10,${(.86 * dim).toFixed(3)})`); gr.addColorStop(1, `rgba(4,6,10,${(.5 * dim).toFixed(3)})`); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
        title(u);
        const fl = Math.pow(1 - prog(u, 0, .3), 2); if (fl > 0) { g.fillStyle = `rgba(255,252,244,${(fl * .9).toFixed(3)})`; g.fillRect(0, 0, W, H); }   // the drop
      }
      // the call to action under the title: two contact chips (side by side in 16:9, stacked in 4:5)
      const CTA = 'WANT TO WORK TOGETHER?', CONTACT = [['EMAIL', 'lettertosohan@gmail.com', '#ffcc2e'], ['WHATSAPP', '+880 1775 860544', '#25d366']];
      const chipFonts = [mono(700, 15), mono(700, 26)], chipH = 60 * U, chipGap = 16 * U;
      function chipW([cap, val]) { g.font = chipFonts[0]; g.letterSpacing = '3px'; const a = g.measureText(cap).width; g.font = chipFonts[1]; g.letterSpacing = '1px'; const b = g.measureText(val).width; g.letterSpacing = '0px'; return 24 * U + 10 * U + 14 * U + a + 18 * U + b + 26 * U; }
      function chip([cap, val, col], x, y, k) {
        const w = chipW([cap, val]), a = clamp(k * 1.6);
        g.save(); g.globalAlpha = a; g.translate(0, (1 - k) * 26 * U);
        g.fillStyle = 'rgba(8,10,14,.84)'; g.beginPath(); g.roundRect(x, y, w, chipH, chipH / 2); g.fill(); g.strokeStyle = 'rgba(255,255,255,.2)'; g.lineWidth = 1.5 * U; g.stroke();
        g.fillStyle = col; g.beginPath(); g.arc(x + 24 * U + 5 * U, y + chipH / 2, 5 * U, 0, 7); g.fill();
        let cx = x + 24 * U + 10 * U + 14 * U;
        K.text(g, cap, cx, y + chipH / 2 + 5 * U, { font: chipFonts[0], color: col, spacing: 3 });
        g.font = chipFonts[0]; g.letterSpacing = '3px'; cx += g.measureText(cap).width + 18 * U; g.letterSpacing = '0px';
        K.text(g, val, cx, y + chipH / 2 + 9 * U, { font: chipFonts[1], color: '#f4f6fa', spacing: 1 });
        g.restore();
      }
      // the genre line under the title, in reel order; smaller type when it would not fit the frame (five genres in 4:5)
      const GENRES = Object.keys(SEC).join('  ·  '), GENRE_F = (() => {
        g.font = mono(500, 24); g.letterSpacing = '4px'; const w = g.measureText(GENRES).width; g.letterSpacing = '0px';
        return mono(500, 24 * Math.min(1, .82 * W / w));
      })();
      function title(u) {
        const fs = Math.round(Math.min(H * .165, W * .12)), F = `400 ${fs}px Anton`, sp = 2 * U;
        // measured cap height, so the marker has the same margin above and below the words
        g.font = F; g.letterSpacing = sp + 'px'; const cap = g.measureText('ON THE MAP.').actualBoundingBoxAscent;
        const pad = fs * .14, gap = fs * .24, subH = fs * .44;      // marker margin; room under line 1 (its comma hangs below the baseline)
        const stack = VERT, ctaH = 76 * U + 28 * U + (stack ? chipH * 2 + chipGap : chipH);
        const y1 = (H - (cap * 2 + gap + pad * 2 + subH + ctaH)) / 2 + cap, y2 = y1 + gap + pad + cap, top = y2 - cap - pad, bot = y2 + pad;   // the whole block sits centred
        // line 1: the letters rise out of a mask
        const L1 = 'YOUR STORY,'; g.font = F; g.letterSpacing = sp + 'px'; let x = W / 2 - g.measureText(L1).width / 2;
        g.save(); g.beginPath(); g.rect(0, y1 - cap - fs * .1, W, cap + fs * .1 + gap * .9); g.clip(); g.textAlign = 'left'; g.fillStyle = '#fff';
        for (let i = 0; i < L1.length; i++) { const k = E.outExpo(prog(u, .4 + i * .025, .85 + i * .025)); g.fillText(L1[i], x, y1 + (1 - k) * (cap + gap)); x += g.measureText(L1[i]).width; }
        g.restore();
        // line 2: a yellow marker swipe, then the words (the Vox callback)
        const L2 = 'ON THE MAP.', w2 = g.measureText(L2).width, x2 = W / 2 - w2 / 2, sw = E.inOut(prog(u, .7, .98)), e = 24 * U, tilt = fs * .025;
        if (sw > 0) { g.fillStyle = '#ffcc2e'; g.beginPath(); g.moveTo(x2 - e, top); g.lineTo(x2 - e + (w2 + e * 2) * sw, top - tilt); g.lineTo(x2 - e * .8 + (w2 + e * 1.8) * sw, bot - tilt); g.lineTo(x2 - e * 1.2, bot); g.fill(); }
        const rv = E.out(prog(u, .8, 1.15));
        if (rv > 0) { g.save(); g.beginPath(); g.rect(x2 - e, top - tilt, (w2 + e * 2) * rv, bot - top + tilt); g.clip(); g.textAlign = 'left'; g.fillStyle = '#14120e'; g.fillText(L2, x2, y2); g.restore(); }
        g.letterSpacing = '0px';
        textAt(scramble(GENRES, u, 1.0, 1.4), GENRES, W / 2, bot + subH, { font: GENRE_F, color: 'rgba(232,236,243,.86)', align: 'center', spacing: 4, alpha: E.out(prog(u, 1.0, 1.2)) });
        // contact: a heading, then the chips rise in one after the other
        const ly = bot + subH + 76 * U, cy = ly + 28 * U;
        textAt(scramble(CTA, u, 1.1, 1.4), CTA, W / 2, ly, { font: mono(700, 22), color: '#ffcc2e', align: 'center', spacing: 5, alpha: E.out(prog(u, 1.1, 1.3)) });
        const ws = CONTACT.map(chipW), row = ws[0] + ws[1] + 20 * U;
        CONTACT.forEach((c, i) => {
          const k = E.outExpo(prog(u, 1.2 + i * .12, 1.55 + i * .12)); if (k <= 0) return;
          if (stack) chip(c, W / 2 - ws[i] / 2, cy + i * (chipH + chipGap), k);
          else chip(c, W / 2 - row / 2 + (i ? ws[0] + 20 * U : 0), cy, k);
        });
      }

      const frameAt = (t, frame) => {
        frameNo = frame; cache.clear(); SH = shake(t); shown.clear();
        for (const x of [g0, gO]) { x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over'; x.letterSpacing = '0px'; }
        gO.clearRect(0, 0, W, H); g = g0;
        if (t < 2) hook(t);
        else if (t < DROP) { montage(t); g = gO; dip(t); stamps(t); pill(t); g = g0; }
        else endCard(t);
        for (const c of Object.values(C)) if (c.live && !shown.has(c)) c.live.style.display = 'none';
        K.drawGrain(gG, grain, W, H, frame, 1, 'source-over');   // the canvas itself blends as overlay at 4.5 % (CSS)
      };
      // warm-up under the loading screen: each transition and the live shot once, with a paint after each, so the first
      // play has no first-use stalls (a demo's first draw at a new time, the live layer's first paint, its first CSS blur)
      stage.appendChild(box); say('READY IN A MOMENT', 1);
      const warm = new Set([1.0, 1.13, 1.25, 1.5, 1.75, 1.9, 1.98, 2.0, ...SHOTS.map(s => (s.a + s.b) / 2), DROP, DROP + .5]);
      for (const x of TRANS) for (const t of [x.at - x.d[0], x.at - .04, x.at, x.at + .04, x.at + x.d[1] * .5, x.at + x.d[1]]) warm.add(t);
      // (a hidden tab or a paused embed gets no animation frames: the time limit keeps the load from waiting for ever)
      const painted = () => new Promise(r => { requestAnimationFrame(() => requestAnimationFrame(r)); setTimeout(r, 80); });
      for (const t of [...warm].sort((a, b) => a - b)) { frameAt(t, Math.round(t * FPS)); await painted(); }
      box.remove();
      return frameAt;
    },
  });
})();
</script>
</body>
