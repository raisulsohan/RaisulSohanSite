<script type="module">
// 09 · Recreation of a Vox-style Manhattan map reveal: paper, a street wipe, typed title, Manhattan filling block by block.
// Map data © OpenStreetMap contributors, tiles by OpenFreeMap (OpenMapTiles schema), loaded at run time.
import { VectorTile } from 'https://cdn.jsdelivr.net/npm/@mapbox/vector-tile@2.0.3/+esm';
import Pbf from 'https://cdn.jsdelivr.net/npm/pbf@4.0.1/+esm';

// ── cue sheet (demo seconds; reference time = demo + 1.0)
const CUE = {
  wipe: [0.0, 0.6],                                   // streets wipe in, top → bottom
  man: { t0: .33, dt: .115, txt: 'Manhattan,' },      // one letter per step
  ny: { t0: 1.55, dt: .16, txt: 'New York' },
  // block fill front: [world y, time] measured from the reference (fast at the top, slower toward the tip)
  front: [[-420, 1.69], [-33, 1.96], [226, 2.22], [416, 2.47], [594, 2.72], [813, 2.98], [1000, 3.22]], jitter: .07,
  parks: [3.0, 3.25], medium: [3.2, 3.7],
};
const arrive = y => { const F = CUE.front; if (y <= F[0][0]) return F[0][1]; for (let i = 1; i < F.length; i++) if (y <= F[i][0]) return F[i - 1][1] + (y - F[i - 1][0]) / (F[i][0] - F[i - 1][0]) * (F[i][1] - F[i - 1][1]); return F[F.length - 1][1]; };
const typeTimes = c => [...c.txt].map((ch, i) => [c.t0 + i * c.dt, ch]).filter(([, ch]) => ch !== ' ').map(([t]) => t);

// ── map calibration: world px = the reference frame at demo 8.0 s (ref 9.0 s)
const CAL = { lon0: -73.9730, lat0: 40.7644, ax: 807, ay: 271, pxkm: 95 };    // Central Park SE corner → (813, 271)
const S = CAL.pxkm * 6371 * Math.cos(CAL.lat0 * Math.PI / 180);
const L0 = CAL.lon0 * Math.PI / 180, M0 = Math.log(Math.tan(Math.PI / 4 + CAL.lat0 * Math.PI / 360));
const toWorld = (lon, lat) => [S * (lon * Math.PI / 180 - L0) + CAL.ax, S * (M0 - Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360))) + CAL.ay];
const fromWorld = (x, y) => [((x - CAL.ax) / S + L0) * 180 / Math.PI, (2 * Math.atan(Math.exp(M0 - (y - CAL.ay) / S)) - Math.PI / 2) * 180 / Math.PI];

// ── camera: ease-out push toward a fixed point (fitted to the reference: +31 % over the shot)
const ZC = [1020, 720], zs = T => 1 + .459 * (1 - Math.exp(-T / 3)), camK = T => zs(T) / zs(8);

MapPlayer({
  title: '09 · Manhattan (reference recreation)',
  DUR: 9,
  vo: ['audio/09-vo.mp3'],
  // with a voice: a gentle even stretch (the voice already fits the reveal)
  voWarp: [],
  score: {
    master: 2.0, bpm: 96, root: 57, seed: 91, chords: [[0, 4, 7, 11], [-3, 0, 4, 7], [-7, -3, 0, 4], [-5, -1, 2, 7]],
    pad: .024, padCut: 1200, pluck: .04, pluckFrom: 1.9, bass: .06, bassFrom: 1.9,
    cues: [[0, 'whoosh', .8, .22], ...typeTimes(CUE.man).map(t => [t, 'type', 1, .04, .13]), ...typeTimes(CUE.ny).map(t => [t, 'type', 1, .05, .15]),
      [1.8, 'riser', 1.3, .12], ...Array.from({ length: 24 }, (_, i) => [1.98 + i * .06, 'tick', .05]), [3.1, 'shimmer', .1], [3.12, 'pop', 1.4, .14]]
  },
  async setup(stage, { W, H, VERT }) {
    await K.fonts(['700 60px "Playfair Display"']);
    const { ease: E, prog, lerp, clamp } = K;
    const cv = K.canvas(W, H); stage.appendChild(cv); const g = cv.getContext('2d');
    const loader = document.getElementById('loader');
    const say = s => { if (loader) loader.textContent = s; };

    // view: screen = VS · world + VO before the push. 4:5 slides the frame onto the island and its title and sees further north
    const VS = VERT ? .94 : 1, VO = VERT ? [-339, 351] : [0, 0], ZCs = [ZC[0] * VS + VO[0], ZC[1] * VS + VO[1]];
    if (VERT) CUE.front.unshift([-900, 1.45]);               // the extra northern blocks fill just before the measured front
    const cam = T => { const k = camK(T); return [k * VS, k * VO[0] + ZCs[0] * (1 - k), k * VO[1] + ZCs[1] * (1 - k)]; };   // [scale, tx, ty]
    // world extent needed for the widest frame (demo 0 s) plus margin
    const [s0, ax0, ay0] = cam(0), WX0 = Math.floor(-ax0 / s0) - 40, WY0 = Math.floor(-ay0 / s0) - 40;
    const WX1 = Math.ceil((W - ax0) / s0) + 40, WY1 = Math.ceil((H - ay0) / s0) + 40;
    const R = 1.4;                                                 // map raster px per world px

    // ── fetch OpenMapTiles vector tiles (z13)
    say('Loading OpenStreetMap tiles…');
    const tj = await (await fetch('https://tiles.openfreemap.org/planet')).json();
    const Z = 13, N = 2 ** Z, tileX = lon => Math.floor((lon + 180) / 360 * N), tileY = lat => Math.floor((1 - Math.asinh(Math.tan(lat * Math.PI / 180)) / Math.PI) / 2 * N);
    const [lonA, latA] = fromWorld(WX0, WY0), [lonB, latB] = fromWorld(WX1, WY1);
    const jobs = [];
    for (let x = tileX(lonA); x <= tileX(lonB); x++) for (let y = tileY(latA); y <= tileY(latB); y++) jobs.push({ x, y });
    let done = 0;
    const tiles = await Promise.all(jobs.map(async j => {
      try { const r = await fetch(tj.tiles[0].replace('{z}', Z).replace('{x}', j.x).replace('{y}', j.y)); const buf = await r.arrayBuffer(); say(`Loading OpenStreetMap tiles… ${++done}/${jobs.length}`); return { ...j, vt: new VectorTile(new Pbf(buf)) }; }
      catch { return null; }
    }));
    say('Building the map…');

    // tile point → world px (both are Web Mercator, so this is linear)
    const TW = (j, ext) => p => { const X = (j.x + p.x / ext) / N, Y = (j.y + p.y / ext) / N; return [S * (2 * Math.PI * X - Math.PI - L0) + CAL.ax, S * (M0 - Math.PI + 2 * Math.PI * Y) + CAL.ay]; };
    function each(layer, fn) {
      for (const t of tiles) { if (!t || !t.vt.layers[layer]) continue; const L = t.vt.layers[layer]; for (let i = 0; i < L.length; i++) { const f = L.feature(i); fn(f, f.loadGeometry(), TW(t, f.extent)); } }
    }
    // path builder into a context with a world → raster transform
    const pathInto = (ctx, rings, tw, ox, oy, sc, close) => { for (const ring of rings) { ring.forEach((p, i) => { const [x, y] = tw(p); i ? ctx.lineTo((x - ox) * sc, (y - oy) * sc) : ctx.moveTo((x - ox) * sc, (y - oy) * sc); }); if (close) ctx.closePath(); } };

    // ── static map layer: lighter water, airport, streets (wiped in as one layer)
    const mapC = K.canvas(Math.ceil((WX1 - WX0) * R), Math.ceil((WY1 - WY0) * R)), m = mapC.getContext('2d');
    const waterC = K.canvas(mapC.width, mapC.height), wc = waterC.getContext('2d');
    wc.fillStyle = '#fff'; wc.beginPath(); each('water', (f, rings, tw) => { if (f.type === 3) pathInto(wc, rings, tw, WX0, WY0, R, true); }); wc.fill();
    m.save(); m.filter = 'blur(10px)'; m.globalAlpha = .2; m.drawImage(waterC, 0, 0); m.restore();
    m.save(); m.globalAlpha = .04; m.drawImage(waterC, 0, 0); m.restore();
    m.fillStyle = 'rgba(140,168,168,.4)'; m.beginPath();
    each('aeroway', (f, rings, tw) => { if (f.type === 3 && f.properties.class === 'aerodrome') pathInto(m, rings, tw, WX0, WY0, R, true); });
    m.save(); m.filter = 'blur(4px)'; m.fill(); m.restore();
    const ROAD = { motorway: [4.8, 1], trunk: [4.4, 1], primary: [2.2, 0], secondary: [1.8, 0], tertiary: [1.3, 0], minor: [.75, 0], service: [.5, 0], path: [.45, 0], track: [.45, 0], rail: [.9, 0], transit: [.8, 0] };
    const roadsC = K.canvas(mapC.width, mapC.height), rc = roadsC.getContext('2d');
    rc.lineCap = rc.lineJoin = 'round';
    for (const pass of [1, 0]) {          // wide highways first (lighter), then the fine network on top
      const byW = new Map();
      each('transportation', (f, rings, tw) => {
        const c = f.properties.class, st = ROAD[c]; if (!st || f.type !== 2 || st[1] !== pass || f.properties.brunnel === 'tunnel') return;
        if (!byW.has(st[0])) byW.set(st[0], new Path2D());
        pathInto(byW.get(st[0]), rings, tw, WX0, WY0, R, false);
      });
      for (const [w, p] of byW) { rc.strokeStyle = pass ? '#b0c6c3' : '#88a5a3'; rc.lineWidth = w * R; rc.stroke(p); }
    }
    m.save(); m.globalAlpha = .62; m.drawImage(roadsC, 0, 0); m.restore();

    // ── Manhattan blocks: land = not water, flood fill from seeds, carve streets, label connected blocks
    const RI = 1.5, IX0 = 360, IY0 = WY0, IX1 = 1320, IY1 = 1010, IW = Math.ceil((IX1 - IX0) * RI), IH = Math.ceil((IY1 - IY0) * RI);
    const lm = K.canvas(IW, IH), lc = lm.getContext('2d');
    lc.fillStyle = '#fff'; lc.fillRect(0, 0, IW, IH);
    lc.fillStyle = '#000'; lc.beginPath(); each('water', (f, rings, tw) => { if (f.type === 3) pathInto(lc, rings, tw, IX0, IY0, RI, true); }); lc.fill();
    lc.fillStyle = '#fff'; lc.beginPath(); each('transportation', (f, rings, tw) => { if (f.type === 3 && f.properties.class === 'pier') pathInto(lc, rings, tw, IX0, IY0, RI, true); }); lc.fill();
    const land = lc.getImageData(0, 0, IW, IH).data;
    const isl = new Uint8Array(IW * IH);
    const flood = (wx, wy) => {
      const sx = Math.round((wx - IX0) * RI), sy = Math.round((wy - IY0) * RI); if (sx < 0 || sy < 0 || sx >= IW || sy >= IH) return;
      const st = [sy * IW + sx];
      while (st.length) { const i = st.pop(); if (isl[i] || land[i * 4] < 128) continue; isl[i] = 1; const x = i % IW; if (x > 0) st.push(i - 1); if (x < IW - 1) st.push(i + 1); if (i >= IW) st.push(i - IW); if (i < IW * (IH - 1)) st.push(i + IW); }
    };
    for (const [lo, la] of [[-73.985, 40.758], [-74.006, 40.712], [-73.9505, 40.7625], [-73.924, 40.792], [-73.919, 40.7975]]) flood(...toWorld(lo, la));
    // street cuts
    const cut = K.canvas(IW, IH), cc = cut.getContext('2d'); cc.lineCap = cc.lineJoin = 'round'; cc.strokeStyle = '#fff';
    const CUTW = { motorway: 2.4, trunk: 2.4, primary: 2.0, secondary: 1.9, tertiary: 1.5, minor: 1.2 };
    each('transportation', (f, rings, tw) => { const w = CUTW[f.properties.class]; if (!w || f.type !== 2 || f.properties.brunnel === 'tunnel') return; cc.lineWidth = w * RI; cc.beginPath(); pathInto(cc, rings, tw, IX0, IY0, RI, false); cc.stroke(); });
    const cutD = cc.getImageData(0, 0, IW, IH).data;
    // park mask
    const pk = K.canvas(IW, IH), pc = pk.getContext('2d'); pc.fillStyle = '#fff'; pc.beginPath();
    each('park', (f, rings, tw) => { if (f.type === 3) pathInto(pc, rings, tw, IX0, IY0, RI, true); });
    each('landcover', (f, rings, tw) => { if (f.type === 3 && ['park', 'garden', 'recreation_ground', 'village_green', 'golf_course', 'wood'].includes(f.properties.subclass || f.properties.class)) pathInto(pc, rings, tw, IX0, IY0, RI, true); });
    each('landuse', (f, rings, tw) => { if (f.type === 3 && ['stadium', 'cemetery'].includes(f.properties.class)) pathInto(pc, rings, tw, IX0, IY0, RI, true); });
    pc.fill();
    const parkD = pc.getImageData(0, 0, IW, IH).data;

    const lnC = K.canvas(IW, IH), lnc = lnC.getContext('2d'); lnc.lineCap = lnc.lineJoin = 'round'; lnc.strokeStyle = '#fff';
    const LNW = { motorway: 2.2, trunk: 2.2, primary: 1.7, secondary: 1.6, tertiary: 1.3, minor: 1.0, service: .6, path: .55, track: .55 };
    each('transportation', (f, rings, tw) => { const w = LNW[f.properties.class]; if (!w || f.type !== 2 || f.properties.brunnel === 'tunnel') return; lnc.lineWidth = w * RI; lnc.beginPath(); pathInto(lnc, rings, tw, IX0, IY0, RI, false); lnc.stroke(); });
    const lnD = lnc.getImageData(0, 0, IW, IH).data;
    const lab = new Int32Array(IW * IH).fill(-1), blocks = [];
    for (let s = 0; s < IW * IH; s++) {
      if (lab[s] !== -1 || !isl[s] || cutD[s * 4] > 100) continue;
      const id = blocks.length, st = [s]; let n = 0, sy = 0, park = 0; lab[s] = id;
      while (st.length) {
        const i = st.pop(); n++; sy += Math.floor(i / IW); if (parkD[i * 4] > 128) park++;
        const x = i % IW;
        for (const j of [x > 0 ? i - 1 : -1, x < IW - 1 ? i + 1 : -1, i - IW, i + IW]) if (j >= 0 && j < IW * IH && lab[j] === -1 && isl[j] && cutD[j * 4] <= 100) { lab[j] = id; st.push(j); }
      }
      blocks.push({ n, cy: sy / n / RI + IY0, park: park / n });
    }
    // per-block look and timing
    const Rr = K.rng(2024), hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    const DARK = ['#10705a', '#127256', '#0f6d55', '#13755b', '#0e6a52'].map(hex), MED = ['#1f8f6e', '#27a079'].map(hex), MINT = ['#15c78c', '#24cf93', '#33d69a'].map(hex), FLASH = hex('#2a9474');
    for (const b of blocks) {
      b.t = arrive(b.cy) + Rr() * CUE.jitter + (Rr() < .04 ? .2 + Rr() * .3 : 0);
      if (b.park > .6) { b.kind = 'park'; b.t = lerp(...CUE.parks, clamp((b.cy + 300) / 1300)) + Rr() * .12; b.col = MINT[Math.floor(Rr() * 3)]; }
      else if (Rr() < .12 && b.n > 40) { b.kind = 'med'; b.col = DARK[Math.floor(Rr() * 5)]; b.col2 = MED[Math.floor(Rr() * 2)]; b.t2 = lerp(...CUE.medium, Rr()); }
      else { b.kind = 'dark'; b.col = DARK[Math.floor(Rr() * 5)]; }
      if (b.n < 8) b.col = DARK[1];
    }
    const islC = K.canvas(IW, IH), ic = islC.getContext('2d'), img = ic.createImageData(IW, IH), px = img.data;
    const idx = [], gap = [], gapT = []; for (let i = 0; i < lab.length; i++) { if (lab[i] >= 0) idx.push(i); else if (isl[i]) { gap.push(i); gapT.push(arrive(Math.floor(i / IW) / RI + IY0) + .1); } }
    const IDX = Int32Array.from(idx), GAP = Int32Array.from(gap), GAPT = Float32Array.from(gapT), GAPC = DARK[1], LINE = hex('#a8ddc9');
    const LA_I = Float32Array.from(idx, i => lnD[i * 4 + 3] / 255 * .72), LA_G = Float32Array.from(gap, i => lnD[i * 4 + 3] / 255 * .72);
    let lastKey = null;
    function paintIsland(T) {
      const key = T < 1.4 ? 'empty' : T > 4.3 ? 'full' : T.toFixed(3); if (key === lastKey) return; lastKey = key;
      // per-block colour for this time, then splat to pixels
      const cols = new Uint8ClampedArray(blocks.length * 4);
      blocks.forEach((b, k) => {
        const u = (T - b.t) / .05; if (u <= 0) return;
        const f = clamp((T - b.t) / .16); let c = b.col;
        if (b.kind === 'med' && T > b.t2) c = b.col.map((v, q) => lerp(v, b.col2[q], clamp((T - b.t2) / .25)));
        cols[k * 4] = lerp(FLASH[0], c[0], f); cols[k * 4 + 1] = lerp(FLASH[1], c[1], f); cols[k * 4 + 2] = lerp(FLASH[2], c[2], f); cols[k * 4 + 3] = 255 * clamp(u);
      });
      for (let q = 0; q < IDX.length; q++) { const i = IDX[q], k = lab[i] * 4, o = i * 4, l = LA_I[q]; px[o] = cols[k] + (LINE[0] - cols[k]) * l; px[o + 1] = cols[k + 1] + (LINE[1] - cols[k + 1]) * l; px[o + 2] = cols[k + 2] + (LINE[2] - cols[k + 2]) * l; px[o + 3] = cols[k + 3]; }
      for (let q = 0; q < GAP.length; q++) { const o = GAP[q] * 4, l = LA_G[q]; px[o] = GAPC[0] + (LINE[0] - GAPC[0]) * l; px[o + 1] = GAPC[1] + (LINE[1] - GAPC[1]) * l; px[o + 2] = GAPC[2] + (LINE[2] - GAPC[2]) * l; px[o + 3] = 255 * clamp((T - GAPT[q]) / .05); }
      ic.putImageData(img, 0, 0);
    }

    // ── text (world units), sized to the reference's measured widths
    g.font = '700 100px "Playfair Display"'; if ('letterSpacing' in g) g.letterSpacing = '0px';
    const fsMan = 100 * 211 / g.measureText('Manhattan,').width, fsNY = 100 * 320 / g.measureText('New York').width;

    // ── paper texture (static, multiplied over everything): mottled blue-grey, darker toward the corners
    const tex = K.canvas(W, H); {
      const tg = tex.getContext('2d'), Rp = K.rng(77);
      tg.fillStyle = '#fff'; tg.fillRect(0, 0, W, H);
      // grunge: many soft blobs, denser and darker toward the edges and corners
      for (let i = 0; i < 2600; i++) {
        let x = Rp() * W, y = Rp() * H;
        const ex = (x - W / 2) / (W / 2), ey = (y - H * .46) / (H * .54), e = Math.min(1, ex * ex * .7 + ey * ey * 1.2);
        if (Rp() > .1 + .9 * Math.pow(e, 2.2)) continue;
        const r = 8 + Math.pow(Rp(), 2.5) * 140, a = (.018 + Rp() * .045) * (.3 + e);

      // overall corner darkening

      tg.fillStyle = vg; tg.fillRect(0, 0, W, H);
      tg.globalCompositeOperation = 'overlay'; tg.globalAlpha = .85; tg.drawImage(K.paper(W, H, 63, 1.6), 0, 0); tg.globalCompositeOperation = 'source-over'; tg.globalAlpha = 1;
      const grain = K.grainTile(41, 256, 46);
      tg.globalCompositeOperation = 'overlay'; tg.globalAlpha = .75; for (let y = 0; y < H; y += 256) for (let x = 0; x < W; x += 256) tg.drawImage(grain, x, y);
      tg.globalCompositeOperation = 'source-over'; tg.globalAlpha = 1;
      for (let i = 0; i < 320; i++) { tg.fillStyle = `rgba(70,95,100,${.06 + Rp() * .14})`; tg.fillRect(Rp() * W, Rp() * H, 1 + Rp() * 1.8, 1 + Rp() * 1.8); }
      // faint old-map grid
      tg.strokeStyle = 'rgba(110,138,146,.07)'; tg.lineWidth = 1.2;
      for (let x = 70; x < W; x += 168 + Rp() * 14) { tg.beginPath(); tg.moveTo(x, 0); tg.lineTo(x + (Rp() - .5) * 6, H); tg.stroke(); }
      for (let y = 40; y < H; y += 168 + Rp() * 14) { tg.beginPath(); tg.moveTo(0, y); tg.lineTo(W, y + (Rp() - .5) * 6); tg.stroke(); }
      // edge grit: fine dark specks and short scratches, denser toward the corners
      for (let i = 0; i < 9000; i++) {
        const x = Rp() * W, y = Rp() * H, ex = (x - W / 2) / (W / 2), ey = (y - H / 2) / (H / 2), e = Math.min(1, ex * ex * .7 + ey * ey);
        if (Rp() > e * e) continue;
        tg.fillStyle = `rgba(60,85,92,${.05 + Rp() * .16})`; tg.fillRect(x, y, .8 + Rp() * 1.4, .8 + Rp() * 1.4);
      }
      tg.lineCap = 'round';
      for (let i = 0; i < 260; i++) { const x = Rp() * W, y = Rp() * H, a = Rp() * 6.3, l = 4 + Rp() * 18; tg.strokeStyle = `rgba(70,95,100,${.05 + Rp() * .1})`; tg.lineWidth = .6 + Rp() * .8; tg.beginPath(); tg.moveTo(x, y); tg.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); tg.stroke(); }
    }
    // light flecks laid over everything (they also show on the green and the title, like the reference scan)
    const fleck = K.canvas(W, H); { const fg = fleck.getContext('2d'), Rf = K.rng(19); for (let i = 0; i < 2400; i++) { fg.fillStyle = `rgba(255,255,255,${.08 + Rf() * .3})`; const r = .5 + Rf() * 1.3; fg.beginPath(); fg.arc(Rf() * W, Rf() * H, r, 0, 7); fg.fill(); } }
    // soft wipe field for the streets: y + low-frequency wobble
    const WW = 192, WH = 108, wipeV = new Float32Array(WW * WH), wipeC = K.canvas(WW, WH), wpc = wipeC.getContext('2d'), wipeImg = wpc.createImageData(WW, WH);
    { const Rw = K.rng(5), lat = Array.from({ length: 32 * 32 }, () => Rw()), vn = (x, y) => { const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy, s = u => u * u * (3 - 2 * u), a = (i, j) => lat[(j & 31) * 32 + (i & 31)]; return lerp(lerp(a(ix, iy), a(ix + 1, iy), s(fx)), lerp(a(ix, iy + 1), a(ix + 1, iy + 1), s(fx)), s(fy)); };
      for (let y = 0; y < WH; y++) for (let x = 0; x < WW; x++) wipeV[y * WW + x] = y / WH + .22 * (vn(x / 14, y / 14) - .5) + .1 * (vn(x / 5 + 9, y / 5) - .5); }
    const layerC = K.canvas(W, H), lyc = layerC.getContext('2d');

    let tip = null; for (let i = isl.length - 1; i >= 0; i--) if (isl[i]) { tip = [+(i % IW / RI + IX0).toFixed(1), +(Math.floor(i / IW) / RI + IY0).toFixed(1)]; break; }
    window.__cal = { tip, blocks: blocks.length, tiles: jobs.length, fsMan, fsNY };
    say('');

    return (T) => {
      const [k, tx, ty] = cam(T);
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.fillStyle = '#dde7e9'; g.fillRect(0, 0, W, H);

      // streets + water + airport, wiped in
      const wp = E.inOutSine(prog(T, ...CUE.wipe));
      if (wp > 0) {
        const target = wp < 1 ? lyc : g;
        if (wp < 1) { lyc.setTransform(1, 0, 0, 1, 0, 0); lyc.clearRect(0, 0, W, H); }
        target.setTransform(k / R, 0, 0, k / R, tx + WX0 * k, ty + WY0 * k);
        target.drawImage(mapC, 0, 0);
        if (wp < 1) {
          const p = lerp(-.2, 1.35, wp), d = wipeImg.data;
          for (let i = 0; i < WW * WH; i++) d[i * 4 + 3] = 255 * clamp((p - wipeV[i]) / .34);
          wpc.putImageData(wipeImg, 0, 0);
          lyc.setTransform(1, 0, 0, 1, 0, 0); lyc.globalCompositeOperation = 'destination-in'; lyc.imageSmoothingQuality = 'high'; lyc.drawImage(wipeC, 0, 0, W, H); lyc.globalCompositeOperation = 'source-over';
          g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(layerC, 0, 0);
        }
      }

      // Manhattan
      paintIsland(T);
      if (T >= 1.4) { g.setTransform(k / RI, 0, 0, k / RI, tx + IX0 * k, ty + IY0 * k); g.imageSmoothingQuality = 'high'; g.drawImage(islC, 0, 0); }

      // typed title (world units, so it rides the camera push)
      g.setTransform(k, 0, 0, k, tx, ty);
      const shown = c => c.txt.slice(0, [...c.txt].filter((_, i) => T >= c.t0 + i * c.dt).length);
      K.text(g, shown(CUE.man), 1096, 533, { font: `700 ${fsMan.toFixed(2)}px "Playfair Display"`, color: '#167655' });
      K.text(g, shown(CUE.ny), 1097, 611, { font: `700 ${fsNY.toFixed(2)}px "Playfair Display"`, color: '#167655' });

      // paper on top of everything (static in frame, like the reference)
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.globalCompositeOperation = 'multiply'; g.drawImage(tex, 0, 0); g.globalCompositeOperation = 'source-over';
      g.drawImage(fleck, 0, 0);
    };
  }
});
