<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Globe Dive Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Special+Elite&family=Permanent+Marker&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="lib/kit.js?v=415f4781"></script>
<script src="audio/vo-env.js?v=d3018d45"></script>
<script src="lib/player.js?v=0d740b1f"></script>
</head>
<body>
<script>
// 02 · Documentary globe dive: orbit HUD → dive from space → the globe turns into a paper map → red marker + typewriter note.
MapPlayer({
  title: '02 · Globe dive',
  vo: ['audio/02-vo.mp3'],
  // with a voice: 'Zoom in' starts the dive; 'Bangladesh' lights it; 'there it is' turns the globe to paper; 'Dhaka' types on the note; 'twenty-three million' on the population line
  voWarp: [[2.94, 2.6], [5.07, 4.0], [6.21, 6.0], [7.53, 7.8], [10.0, 9.4]],
  score: {
    bpm: 84, root: 50, seed: 23, chords: [[0, 7, 12, 15], [-4, 3, 8, 15], [-2, 5, 10, 14], [0, 7, 12, 14]],
    drone: .05, pad: .03, padCut: 700, pluck: .045, pluckFrom: 6.6, wet: .5,
    cues: [[.2, 'shimmer', .1], [1.0, 'blip', 1, .12], [1.45, 'blip', 1.25, .12], [1.9, 'blip', 1.5, .12],
      [2.8, 'riser', 3.5, .3], [4.6, 'whoosh', 1.8, .4], [6.35, 'boom', .9],
      [7.0, 'scribble', .75, .22], [7.45, 'tick', .25], [7.75, 'scribble', .45, .2],
      [7.8, 'type', 5, .45], [8.25, 'type', 22, .7], [8.95, 'type', 20, .4], [9.0, 'scribble', .35, .15], [9.35, 'type', 22, .45]]
  },
  async setup(stage, { W, H, VERT }) {
    await K.fonts(['400 22px "JetBrains Mono"', '600 22px "JetBrains Mono"', '400 30px "Special Elite"', '400 40px "Permanent Marker"']);
    const [full, lo] = await Promise.all([K.loadWorld('50m'), K.loadWorld('110m')]);
    const hi = K.region(full, [60, 5, 120, 40]);
    const BD = K.byId(hi.countries, '050'), BDlo = K.byId(lo.countries, '050');
    const cv = K.canvas(W, H); stage.appendChild(cv); const g = cv.getContext('2d');
    const proj = d3.geoOrthographic().clipAngle(90).clipExtent([[-20, -20], [W + 20, H + 20]]).precision(.4);
    const path = d3.geoPath(proj, g), svg = d3.geoPath(proj), grat = d3.geoGraticule10();
    const paper = K.paper(W, H, 31, 1.3), grain = K.grainTile(9, 256, 80);
    const { ease: E, prog, lerp, lerpLog, clamp } = K, mix = (a, b, u) => d3.interpolateRgb(a, b)(u);
    const R = K.rng(4), stars = Array.from({ length: 700 }, () => [R() * W, R() * H, R() * 1.6 + .3, R() * 6.3, R()]);
    const DHAKA = [90.4125, 23.8103];
    // satellite-ish earth tones per country: deserts tan, ice white, the rest green by latitude
    const DRY = new Set(['682', '818', '434', '012', '466', '562', '148', '729', '478', '364', '368', '004', '586', '512', '887', '784', '400', '760', '036', '496', '732', '398', '795', '860', '414', '634', '048', '706', '232', '516', '072']);
    const tone = f => {
      const [, la] = d3.geoCentroid(f), a = Math.abs(la), j = K.hash(+f.id || 1) * .12 - .06;
      if (f.id === '304' || f.id === '010') return '#c9d3d6';
      if (DRY.has(f.id)) return d3.interpolateRgb('#8c7a4e', '#a28c5a')(K.hash(+f.id + 3));
      return d3.interpolateRgb('#3a6a35', '#5d6b45')(K.clamp(a / 60 + j));
    };
    for (const f of [...lo.countries, ...hi.countries]) f.c = tone(f);

    // hand-drawn circle (relative to the target), a little more than one turn
    const circ = []; { const r = K.rng(77); for (let i = 0; i <= 140; i++) { const a = -2.3 + i / 140 * Math.PI * 2.18, rr = 104 * (1 + .05 * Math.sin(3 * a + 1) + .025 * Math.sin(7 * a + 2)) + (r() - .5) * 2 + i * .05; circ.push([Math.cos(a) * rr * 1.2, Math.sin(a) * rr]); } }

    const cam = t => {
      const r = E.inOutSine(prog(t, 0, 4.8));
      let s = lerpLog(400, 470, E.inOutSine(prog(t, 0, 2.8)));
      s = lerpLog(s, 11000, E.inOut(prog(t, 2.6, 6.4)));
      s = lerpLog(s, 13000, E.outSine(prog(t, 6.4, 10)));
      const o = E.inOut(prog(t, 5.6, 7.4));
      return { lon: lerp(-25, DHAKA[0], r), lat: lerp(5, DHAKA[1], r), s, tx: W / 2 + (VERT ? 0 : 200) * o, ty: H / 2 + (VERT ? 250 : 10) * o };
    };
    const typed = (str, t, a, b) => str.slice(0, Math.floor(str.length * prog(t, a, b) + 1e-6));

    return (t, frame) => {
      const C = cam(t), s = C.s;
      proj.rotate([-C.lon, -C.lat]).scale(s).translate([C.tx, C.ty]);
      const m = E.inOut(prog(t, 5.9, 7.0));          // 0 = satellite globe, 1 = paper map
      const L = s < 1800 ? lo : hi, bd = s < 1800 ? BDlo : BD;

      // space
      const sg = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * .7); sg.addColorStop(0, '#0c1830'); sg.addColorStop(1, '#010309');
      g.fillStyle = sg; g.fillRect(0, 0, W, H);
      const sa = 1 - clamp((s - 500) / 1500);
      if (sa > 0) { g.fillStyle = '#fff'; for (const [x, y, r, ph, b] of stars) { g.globalAlpha = sa * (.35 + .65 * b) * (.65 + .35 * Math.sin(t * 2.5 + ph)); g.fillRect(x, y, r, r); } g.globalAlpha = 1; }

      // atmosphere
      if (s < 5000) {
        const ag = g.createRadialGradient(C.tx, C.ty, s * .96, C.tx, C.ty, s * 1.22);
        ag.addColorStop(0, `rgba(110,185,255,${.55 * (1 - m)})`); ag.addColorStop(.35, `rgba(60,130,255,${.18 * (1 - m)})`); ag.addColorStop(1, 'rgba(40,90,255,0)');
        g.fillStyle = ag; g.beginPath(); g.arc(C.tx, C.ty, s * 1.22, 0, 7); g.fill();
      }
      // ocean
      const hx = C.tx - s * .35, hy = C.ty - s * .35, og = g.createRadialGradient(hx, hy, 0, C.tx, C.ty, s * 1.15);
      og.addColorStop(0, mix('#2f74a6', '#b3cbc7', m)); og.addColorStop(1, mix('#041a31', '#9fb9b5', m));
      g.beginPath(); path({ type: 'Sphere' }); g.fillStyle = og; g.fill();
      if (m < 1) { g.beginPath(); path(grat); g.strokeStyle = `rgba(150,200,255,${.09 * (1 - m)})`; g.lineWidth = 1; g.stroke(); }

      // land + borders
      const landP = new Path2D(svg(L.land) || '');
      g.fillStyle = mix('#3e5a3a', '#ede1c5', m); g.fill(landP);
      for (const f of L.countries) { g.beginPath(); path(f); g.fillStyle = mix(f.c, '#ede1c5', m); g.fill(); }
      if (m < 1) { g.save(); g.clip(landP); g.globalCompositeOperation = 'overlay'; g.globalAlpha = .7 * (1 - m); g.drawImage(paper, 0, 0); g.restore(); }
      g.strokeStyle = `rgba(80,110,90,${.6 - .3 * m})`; g.lineWidth = 1; g.stroke(landP);
      g.beginPath(); path(L.borders); g.strokeStyle = mix('rgba(255,255,255,0.22)', 'rgba(140,118,86,0.85)', m); g.lineWidth = 1 + .8 * m; g.stroke();

      // target country glows on the globe, then gets a red outline on paper
      const ha = E.out(prog(t, 3.6, 4.6));
      if (ha > 0) {
        const bp = new Path2D(svg(bd) || '');
        g.save(); g.shadowColor = `rgba(255,170,50,${.9 * (1 - m)})`; g.shadowBlur = 24; g.fillStyle = `rgba(255,190,70,${.5 * ha * (1 - m)})`; g.fill(bp); g.restore();
        if (m > 0) { g.fillStyle = `rgba(214,60,40,${.1 * m})`; g.fill(bp); g.strokeStyle = `rgba(200,45,35,${.85 * m})`; g.lineWidth = 3.5; g.setLineDash([12, 8]); g.stroke(bp); g.setLineDash([]); }
      }
      // sunlight on the sphere
      if (m < 1 && s < 6000) {
        const lg = g.createRadialGradient(hx, hy, 0, C.tx, C.ty, s * 1.05);
        lg.addColorStop(0, `rgba(255,255,255,${.12 * (1 - m)})`); lg.addColorStop(.55, 'rgba(0,0,0,0)'); lg.addColorStop(1, `rgba(0,0,12,${.6 * (1 - m)})`);
        g.beginPath(); path({ type: 'Sphere' }); g.fillStyle = lg; g.fill();
      }

      // orbit HUD
      const hud = 1 - prog(t, 5.8, 6.4);
      if (hud > 0) {
        const c = `rgba(130,225,255,${.9 * hud})`, mono = '400 22px "JetBrains Mono"', ft = E.out(prog(t, .3, .9)) * hud;
        const alt = 35786 * Math.pow(400 / s, 1.25);
        g.save(); g.globalAlpha = ft;
        K.text(g, typed('TARGET ▸ DHAKA, BANGLADESH', t, .9, 2.1), 80, 92, { font: '600 22px "JetBrains Mono"', color: c, spacing: 2 });
        K.text(g, `LAT  ${C.lat.toFixed(2).padStart(6)}° N`, 80, 132, { font: mono, color: 'rgba(255,255,255,.85)' });
        K.text(g, `LON  ${C.lon.toFixed(2).padStart(6)}° ${C.lon < 0 ? 'W' : 'E'}`, 80, 162, { font: mono, color: 'rgba(255,255,255,.85)' });
        K.text(g, `ALT  ${K.fmt(alt).padStart(6)} KM`, 80, 192, { font: mono, color: 'rgba(255,255,255,.85)' });
        // descent bar
        const dp = prog(t, 2.6, 6.2);
        K.text(g, 'DESCENT', 80, H - 92, { font: mono, color: c, spacing: 3 });
        g.fillStyle = 'rgba(130,225,255,.2)'; g.fillRect(80, H - 76, 300, 4); g.fillStyle = c; g.fillRect(80, H - 76, 300 * dp, 4);
        K.text(g, `${Math.round(dp * 100)}%`, 396, H - 70, { font: mono, color: c });
        // reticle tightens on the target
        const tp = proj(DHAKA), q = 40 + 150 * (1 - E.inOut(prog(t, 2.4, 6.0))), l = 26;
        if (tp && ha > 0) {
          g.strokeStyle = c; g.lineWidth = 2; g.globalAlpha = ft * ha;
          for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) { g.beginPath(); g.moveTo(tp[0] + sx * q, tp[1] + sy * (q - l)); g.lineTo(tp[0] + sx * q, tp[1] + sy * q); g.lineTo(tp[0] + sx * (q - l), tp[1] + sy * q); g.stroke(); }
          g.beginPath(); g.arc(tp[0], tp[1], 4, 0, 7); g.fillStyle = c; g.fill();
        }
        g.restore();
      }

      // light leak + flash on the change of look
      const lk = Math.sin(Math.PI * prog(t, 5.9, 7.1));
      if (lk > 0) {
        g.save(); g.globalCompositeOperation = 'screen';
        const lg = g.createRadialGradient(W * .78, H * .15, 0, W * .78, H * .15, W * .8);
        lg.addColorStop(0, `rgba(255,170,80,${.75 * lk})`); lg.addColorStop(.5, `rgba(255,90,40,${.25 * lk})`); lg.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = lg; g.fillRect(0, 0, W, H);
        g.fillStyle = `rgba(255,240,220,${.35 * Math.max(0, 1 - Math.abs(t - 6.35) / .25)})`; g.fillRect(0, 0, W, H);
        g.restore();
      }

      // paper-phase annotations
      const D = proj(DHAKA);
      if (m > .5 && D) {
        const dp = E.outBack(prog(t, 6.85, 7.15));
        if (dp > 0) { g.beginPath(); g.arc(D[0], D[1], 11 * dp, 0, 7); g.fillStyle = '#fff'; g.fill(); g.beginPath(); g.arc(D[0], D[1], 7 * dp, 0, 7); g.fillStyle = '#c8241b'; g.fill(); }
        const cp = E.inOutSine(prog(t, 7.0, 7.75));
        if (cp > 0) {
          const n = Math.max(2, Math.floor(circ.length * cp)), pts = circ.slice(0, n).map(([x, y]) => [D[0] + x, D[1] + y]);
          g.lineCap = g.lineJoin = 'round';
          K.polyline(g, pts); g.strokeStyle = 'rgba(214,36,26,.92)'; g.lineWidth = 8; g.stroke();
          g.save(); g.translate(1.5, -1.2); K.polyline(g, pts); g.strokeStyle = 'rgba(150,15,10,.45)'; g.lineWidth = 3; g.stroke(); g.restore();
        }
        // note card (taped)
        const nu = E.out(prog(t, 7.3, 7.75));
        if (nu > 0) {
          const w = 520, h = 310, x = VERT ? (W - w) / 2 : 120, y = VERT ? 150 : 330;
          g.save(); g.globalAlpha = nu; g.translate(x + w / 2, y + h / 2 - (1 - nu) * 40); g.rotate(-.045 + (1 - nu) * -.06); g.translate(-w / 2, -h / 2);
          g.shadowColor = 'rgba(40,25,5,.4)'; g.shadowBlur = 22; g.shadowOffsetY = 10;
          g.beginPath(); g.moveTo(0, 6); for (let i = 0; i <= 26; i++) g.lineTo(i * w / 26, (i % 2) * 5); g.lineTo(w, h); g.lineTo(0, h); g.closePath();
          g.fillStyle = '#f7f1e0'; g.fill(); g.shadowColor = 'transparent';
          g.strokeStyle = 'rgba(70,110,170,.18)'; g.lineWidth = 1.5; for (let ly = 120; ly < h; ly += 46) { g.beginPath(); g.moveTo(24, ly); g.lineTo(w - 24, ly); g.stroke(); }
          g.save(); g.translate(w / 2, -4); g.rotate(.06); g.fillStyle = 'rgba(232,222,180,.75)'; g.fillRect(-80, -18, 160, 40); g.restore();
          const ty = 'Special Elite', ink = '#1f1b16';
          K.text(g, typed('DHAKA', t, 7.8, 8.25), 34, 100, { font: `400 74px "${ty}"`, color: ink, spacing: 4 });
          K.text(g, typed('23.8103° N, 90.4125° E', t, 8.25, 8.95), 36, 160, { font: `400 29px "${ty}"`, color: '#8a1d16' });
          K.text(g, typed('Capital of Bangladesh', t, 8.95, 9.35), 36, 208, { font: `400 28px "${ty}"`, color: ink });
          K.text(g, typed('Metro pop. 23 million+', t, 9.35, 9.8), 36, 254, { font: `400 28px "${ty}"`, color: ink });
          g.restore();
        }
        // arrow from the card to the circle
        const ap = E.inOutSine(prog(t, 7.75, 8.15));
        if (ap > 0) {
          const a = VERT ? [W / 2 + 150, 490] : [650, 430], b = VERT ? [D[0] + 40, D[1] - 122] : [D[0] - 140, D[1] - 6], c = VERT ? [(a[0] + b[0]) / 2 + 150, (a[1] + b[1]) / 2] : [(a[0] + b[0]) / 2, Math.min(a[1], b[1]) - 120];
          const N = 40, pts = []; for (let i = 0; i <= N * ap; i++) { const u = i / N; pts.push([(1 - u) ** 2 * a[0] + 2 * u * (1 - u) * c[0] + u * u * b[0], (1 - u) ** 2 * a[1] + 2 * u * (1 - u) * c[1] + u * u * b[1]]); }
          g.lineCap = 'round'; K.polyline(g, pts); g.strokeStyle = 'rgba(214,36,26,.92)'; g.lineWidth = 6; g.stroke();
          const hp = E.out(prog(t, 8.12, 8.3));
          if (hp > 0) {
            const ang = Math.atan2(b[1] - c[1], b[0] - c[0]), hl = 30 * hp;
            for (const s2 of [-1, 1]) { g.beginPath(); g.moveTo(b[0], b[1]); g.lineTo(b[0] - Math.cos(ang + s2 * .5) * hl, b[1] - Math.sin(ang + s2 * .5) * hl); g.stroke(); }
          }
        }
        // marker + typed map labels
        const mk = prog(t, 9.0, 9.3);
        if (mk > 0) {
          const p = proj([91.7, 25.2]);
          g.save(); g.translate(p[0], p[1]); g.rotate(-.07); g.scale(E.outBack(mk), E.outBack(mk));
          K.text(g, 'BANGLADESH', 0, 0, { font: '400 46px "Permanent Marker"', color: '#c8241b', align: 'center', alpha: mk });
          g.restore();
        }
        const ia = E.out(prog(t, 7.6, 8.2)); if (ia > 0) { const p = proj(VERT ? [88.5, 22.5] : [87.6, 22.9]); K.text(g, 'I N D I A', p[0], p[1], { font: '400 30px "Special Elite"', color: '#6b5b45', align: 'center', alpha: ia }); }
      }

      // paper texture grows in, film grain always
      if (m > 0) { g.save(); g.globalCompositeOperation = 'overlay'; g.globalAlpha = .6 * m; g.drawImage(paper, 0, 0); g.restore(); }
      K.drawGrain(g, grain, W, H, frame, .07 + .03 * m);
      K.vignette(g, W, H, .55, m > 0 ? `rgba(${Math.round(lerp(0, 60, m))},${Math.round(lerp(0, 35, m))},10,${.5 - .15 * m})` : 'rgba(0,0,0,.5)');
    };
  }
});
</script>
</body>
</html>
