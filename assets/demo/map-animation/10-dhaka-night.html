  t1: { t0: .45, dt: .06, txt: 'Dhaka,' }, t2: { t0: 1.2, dt: .055, txt: 'Bangladesh' },

MapPlayer({

  vo: ['audio/10-vo.mp3'],

      const vg = a.createRadialGradient(W * .45, H * .5, H * .25, W * .5, H * .5, W * .7); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,3,10,.75)');
      a.fillStyle = vg; a.fillRect(0, 0, W, H);
      const grain = K.grainTile(55, 256, 40); a.globalCompositeOperation = 'overlay'; a.globalAlpha = .35; for (let y = 0; y < H; y += 256) for (let x = 0; x < W; x += 256) a.drawImage(grain, x, y);
    }

    // ── title: letters rise and fade in; gold gradient on the city name
    const letters = (c, font) => { g.font = font; if ('letterSpacing' in g) g.letterSpacing = '0px'; let x = 0; return [...c.txt].map((ch, i) => { const w = g.measureText(ch).width; const o = { ch, x, t: c.t0 + i * c.dt }; x += w; return o; }); };
    const F1 = '400 46px Outfit', F2 = '700 96px Outfit', L1 = letters(CUE.t1, F1), L2 = letters(CUE.t2, F2);
    const [TX, TY1, TY2] = VERT ? [156, 1196, 1292] : [1180, 452, 548];
    window.__cal = { blocks: blocks.length, tiles: jobs.length, cityPx: IDX.length + GAP.length };
    say('');

    return T => {
      const k = camK(T), a = camA(T);
      const setCam = (ctx, sc, offX, offY) => { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.translate(ZCs[0], ZCs[1]); ctx.rotate(a); ctx.scale(k, k); ctx.translate(-ZCs[0] + VO[0], -ZCs[1] + VO[1]); ctx.scale(VS, VS); ctx.translate(offX, offY); ctx.scale(sc, sc); };
      g.setTransform(1, 0, 0, 1, 0, 0);
      const bg = g.createRadialGradient(W * .42, H * .5, 0, W * .5, H * .5, W * .75); bg.addColorStop(0, '#0b1a2e'); bg.addColorStop(1, '#040a14');
      g.fillStyle = bg; g.fillRect(0, 0, W, H);

      // streets light up outward from the centre
      const rp = E.inOutSine(prog(T, ...CUE.reveal));
      if (rp > 0) {
        const partial = rp < 1, ctx = partial ? lyc : g;
        if (partial) { lyc.setTransform(1, 0, 0, 1, 0, 0); lyc.clearRect(0, 0, W, H); }
        setCam(ctx, 1 / R, WX0, WY0); ctx.drawImage(mapC, 0, 0);
        if (partial) {
          const p = lerp(-.15, 1.35, rp), d = revImg.data;
          for (let i = 0; i < VW * VH; i++) d[i * 4 + 3] = 255 * clamp((p - revV[i]) / .12);
          rvc.putImageData(revImg, 0, 0);
          lyc.setTransform(1, 0, 0, 1, 0, 0); lyc.globalCompositeOperation = 'destination-in'; lyc.imageSmoothingQuality = 'high'; lyc.drawImage(revC, 0, 0, W, H); lyc.globalCompositeOperation = 'source-over';
          g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(layerC, 0, 0);
          // glowing front
          const r = p * 1150; if (r > 10) { g.save(); g.globalCompositeOperation = 'lighter';
          const fg = g.createRadialGradient(ZCs[0], ZCs[1], Math.max(0, r - 90), ZCs[0], ZCs[1], r + 30); fg.addColorStop(0, 'rgba(60,140,255,0)'); fg.addColorStop(.75, 'rgba(90,170,255,.16)'); fg.addColorStop(1, 'rgba(60,140,255,0)');
          g.fillStyle = fg; g.fillRect(0, 0, W, H); g.restore(); }
        }
      }

      // Dhaka switches on
      paintCity(T);
      if (T >= 1.85) {
        setCam(g, 1 / RI, IX0, IY0); g.imageSmoothingQuality = 'high'; g.drawImage(islC, 0, 0);
        setCam(g, 4 / RI, IX0, IY0); g.globalCompositeOperation = 'lighter'; g.globalAlpha = .3; g.drawImage(glowC, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
      }
      // origin pulse at Sadarghat
      const op = prog(T, CUE.origin, CUE.origin + .9);
      if (op > 0 && op < 1) {
        setCam(g, 1, 0, 0); const [x, y] = toWorld(...OLD_DHAKA);
        g.beginPath(); g.arc(x, y, 6 + 75 * E.out(op), 0, 7); g.strokeStyle = `rgba(255,220,150,${.85 * (1 - op)})`; g.lineWidth = 2.5 / k; g.stroke();
        g.beginPath(); g.arc(x, y, 5, 0, 7); g.fillStyle = `rgba(255,240,200,${1 - op})`; g.fill();
      }

      // title (world units: it rides the push and the settle)
      setCam(g, 1, 0, 0);
      const drawLetters = (Ls, font, x0, y0, fill, glow) => {
        g.font = font; if ('letterSpacing' in g) g.letterSpacing = '0px'; g.textBaseline = 'alphabetic';
        for (const L of Ls) { const u = clamp((T - L.t) / .38); if (u <= 0) continue; const e = E.out(u);
          g.save(); g.globalAlpha = e; g.shadowColor = glow; g.shadowBlur = 22; g.fillStyle = fill; g.fillText(L.ch, x0 + L.x, y0 + (1 - e) * 22); g.restore(); }
      };
      const gold = g.createLinearGradient(0, TY2 - 80, 0, TY2 + 10); gold.addColorStop(0, '#ffe7ad'); gold.addColorStop(1, '#f0a43a');
      drawLetters(L1, F1, TX + 3, TY1, '#ffd994', 'rgba(255,190,90,.35)');
      drawLetters(L2, F2, TX, TY2, gold, 'rgba(255,170,60,.45)');
      const rl = E.inOut(prog(T, ...CUE.rule));
      if (rl > 0) { g.fillStyle = 'rgba(255,214,140,.7)'; g.fillRect(TX + 3, TY2 + 30, 480 * rl, 2); }
      const ca = E.out(prog(T, CUE.coords, CUE.coords + .6));
      if (ca > 0) K.text(g, '23.81° N   ·   90.41° E', TX + 4, TY2 + 72, { font: '300 24px Outfit', color: '#a9bfdc', alpha: ca, spacing: 6 });

      g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(atmo, 0, 0);
    };
  }
});
</script>
