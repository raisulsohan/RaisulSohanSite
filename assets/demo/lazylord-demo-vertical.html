const E = {
  linear: (u) => u,
  out: (u) => 1 - Math.pow(1 - u, 3),
  in: (u) => u * u * u,
  inOut: (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2),
  back: (u) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); },
};

}

function icon(type, x, y, c) {

const $ = (id) => document.getElementById(id);
const set = (el, attr, value) => { const v = String(value); if (el.getAttribute(attr) !== v) el.setAttribute(attr, v); };

/* ------------------------------------------------------------------ the timeline */
const FLY_START = 5.0, FLY_GAP = 0.55, FLY_TARGET_GAP = 0.12, FLY_DUR = 0.9;
const flyStart = (i, j) => FLY_START + i * FLY_GAP + j * FLY_TARGET_GAP;
const landed = (i, j) => flyStart(i, j) + FLY_DUR;

function figmaPose(t) {
  const u = P(t, 3.2, 4.2);
  const intro = P(t, 0, 0.8, E.out), s0 = lerp(0.965, 1, intro);
  const [ax, ay, as] = LAY.figA, [bx, by, bs] = LAY.figB;
  const s = lerp(as, bs, u), x = lerp(ax, bx, u), y = lerp(ay, by, u);
  return { x: x + (1 - s0) * FIG_W / 2 * s, y: y + (1 - s0) * FIG_H / 2 * s, s: s * s0, opacity: intro };
}
function adobePose(t, j) {
  const u = P(t, 4.0 + j * 0.15, 4.7 + j * 0.15, E.out);
  return { x: lerp(LAY.win.x + LAY.win.from, LAY.win.x, u), y: LAY.win.y[j], s: LAY.win.s, opacity: u };
}

/* The cursor, in the Figma window's own units: it only moves while Figma is still at its first pose. */
const CURSOR = [[0.9, 1160, 810], [1.1, 1160, 810], [1.55, 310, 260], [2.1, 885, 655], [2.25, 885, 655], [2.8, 1100, 442], [3.6, 1100, 442]];
const MARQUEE_FROM = [310, 260];
const onFigma = ([x, y]) => [LAY.figA[0] + LAY.figA[2] * x, LAY.figA[1] + LAY.figA[2] * y];
function cursorAt(t) {
  if (t <= CURSOR[0][0]) return onFigma(CURSOR[0].slice(1));
  for (let k = 0; k < CURSOR.length - 1; k++) {
    const [ta, xa, ya] = CURSOR[k], [tb, xb, yb] = CURSOR[k + 1];
    if (t <= tb) { const u = P(t, ta, tb); return onFigma([lerp(xa, xb, u), lerp(ya, yb, u)]); }
  }
  return onFigma(CURSOR[CURSOR.length - 1].slice(1));
}

/**
 * Move a flying copy from src to dst ({x, y, s} in stage space) over [t0, t0 + dur]. "up" arcs
 * over the top; "side" bows out to the left, for sends between windows stacked on top of each
 * other; "right" bows out to the right, for the tall layout's sends down the stack.
 */
function flight(id, src, dst, [t0, dur], t, arc) {
  const el = $(id);
  if (t < t0 || t >= t0 + dur) { set(el, "opacity", 0); return; }
  const u = clamp((t - t0) / dur, 0, 1), e = E.inOut(u);
  const cx = arc === "side" ? Math.min(src.x, dst.x) - LAY.sideBow : arc === "right" ? (src.x + dst.x) / 2 + 260 : (src.x + dst.x) / 2;
  const cy = arc === "up" ? Math.min(src.y, dst.y) - 150 : (src.y + dst.y) / 2;
  const x = (1 - e) * (1 - e) * src.x + 2 * (1 - e) * e * cx + e * e * dst.x;
  const y = (1 - e) * (1 - e) * src.y + 2 * (1 - e) * e * cy + e * e * dst.y;
  set(el, "transform", `translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${lerp(src.s, dst.s, e).toFixed(5)})`);
  set(el, "opacity", 1);
  const glow = Math.sin(Math.PI * u);
  el.style.filter = `drop-shadow(0 0 ${(14 * glow).toFixed(1)}px rgba(0,194,255,${(0.75 * glow).toFixed(3)}))`;
}

function render(t) {
  /* Figma */
  const f = figmaPose(t);
  set($("figma"), "transform", `translate(${f.x.toFixed(2)} ${f.y.toFixed(2)}) scale(${f.s.toFixed(5)})`);
  op("figma", f.opacity);

  const selected = P(t, 2.1, 2.22);
  op("fgsel", selected);
  for (let k = 0; k < 6; k++) op(`fgrow${k}`, selected);

  const pressed = t >= 2.86 && t < 3.02 ? 0.18 : 0;
  op("sendpress", pressed);
  set($("sendbtn"), "transform", pressed ? `translate(${16 + 154} ${268 + 22}) scale(.98) translate(${-(16 + 154)} ${-(268 + 22)})` : "");
  if (t < 2.95) { text("sendlabel", "Send to all apps"); text("plugstatus", "3 Adobe apps connected", "#9a9aa6"); }
  else if (t < 8.4) { text("sendlabel", "Sending…"); text("plugstatus", "Sending 5 layers to 3 apps…", "#6c63ff"); }
  else if (t < landedAt(PHOTO_FLY)) { text("sendlabel", "Send to all apps"); text("plugstatus", "Sent 5 layers to 3 apps", "#14ae5c"); }
  else { text("sendlabel", "Send to all apps"); text("plugstatus", "Placed 1 layer from Photoshop", "#14ae5c"); }

  /* a photo arrives from Photoshop: it goes on top of Figma's layer list */
  const photoIn = P(t, landedAt(PHOTO_FLY), landedAt(PHOTO_FLY) + 0.3);
  for (let k = 0; k < 6; k++) set($(`fgrowg${k}`), "transform", `translate(0 ${(32 * photoIn).toFixed(2)})`);
  op("fgphotorow", P(t, landedAt(PHOTO_FLY), landedAt(PHOTO_FLY) + 0.25));
  op("fg-photo", t >= landedAt(PHOTO_FLY) ? 1 : 0);

  /* cursor and marquee (in stage space; Figma is still while they are on screen) */
  const [cx, cy] = cursorAt(t);
  const click = t >= 2.86 && t < 3.02 ? 0.9 : 1;
  set($("cursor"), "transform", `translate(${cx.toFixed(2)} ${cy.toFixed(2)}) scale(${1.15 * click})`);
  op("cursor", P(t, 0.9, 1.1) * (1 - P(t, 3.3, 3.6)));
  const marquee = t >= 1.55 && t < 2.18 ? 1 - P(t, 2.1, 2.18) : 0;
  const m = $("marquee"), [mx, my] = onFigma(MARQUEE_FROM);
  set(m, "x", mx.toFixed(2)); set(m, "y", my.toFixed(2));
  set(m, "width", Math.max(0, cx - mx).toFixed(2)); set(m, "height", Math.max(0, cy - my).toFixed(2));
  op("marquee", marquee);

  /* big type for anyone watching muted (tall layout only) */
  if (LAY.captions) {
    op("capA", P(t, 0.4, 0.8) * (1 - P(t, 3.0, 3.3)));
    op("capB", P(t, 3.5, 3.9) * (1 - P(t, 10.55, 10.85)));
  }

  /* Adobe windows */
  const poses = ADOBE.map((_, j) => adobePose(t, j));
  ADOBE.forEach((a, j) => {
    set($(`win-${a.id}`), "transform", `translate(${poses[j].x.toFixed(2)} ${poses[j].y}) scale(${poses[j].s})`);
    op(`win-${a.id}`, poses[j].opacity);
  });
  /** A point in window j's own units, in stage space. */
  const inWin = (j, x, y) => ({ x: poses[j].x + poses[j].s * x, y: poses[j].y + poses[j].s * y });

  /* routes, from the design in Figma to the design in each app */
  const src = { x: f.x + f.s * FIG_DESIGN[0], y: f.y + f.s * FIG_DESIGN[1], s: f.s };
  const dst = ADOBE.map((a, j) => ({ ...inWin(j, a.design[0], a.design[1]), s: a.design[2] * poses[j].s }));
  ADOBE.forEach((a, j) => {
    const sx = src.x + 260 * src.s, sy = src.y + 170 * src.s, dx = dst[j].x + 260 * dst[j].s, dy = dst[j].y + 170 * dst[j].s;
    const c = V ? `${sx.toFixed(1)} ${(sy + 160).toFixed(1)} ${dx.toFixed(1)} ${(dy - 160).toFixed(1)}`
      : `${(sx + 260).toFixed(1)} ${sy.toFixed(1)} ${(dx - 320).toFixed(1)} ${dy.toFixed(1)}`;
    set($(`route${j}`), "d", `M${sx.toFixed(1)} ${sy.toFixed(1)} C${c} ${dx.toFixed(1)} ${dy.toFixed(1)}`);
  });
  op("routes", 0.55 * P(t, 4.6, 5.0) * (1 - P(t, 8.6, 9.2)));

  /* layers flying */
  ADOBE.forEach((a, j) => {
    LAYERS.forEach((_, i) => {
      const t0 = flyStart(i, j);
      set($(`${a.id}-L${i}`), "opacity", t >= t0 + FLY_DUR ? 1 : 0);
      flight(`fly${j}${i}`, src, dst[j], [t0, FLY_DUR], t, LAY.flyArc);
    });

    /* panels fill in as layers land: each new layer arrives on top and pushes the others down */
    const slotH = { ai: 26, ps: 30, ae: 36 }[a.id];
    if (a.id !== "ae") op(`${a.id}-row0`, P(t, landed(0, j), landed(0, j) + 0.25));
    /* later arrivals from the other apps also land on top */
    const extra = a.id === "ae" ? P(t, landedAt(SPARK_FLY), landedAt(SPARK_FLY) + 0.3)
      : a.id === "ai" ? P(t, landedAt(WAVE_FLY), landedAt(WAVE_FLY) + 0.3) : 0;
    LAYERS.forEach((_, i) => {
      let slot = extra;
      for (let m = i + 1; m < LAYERS.length; m++) slot += P(t, landed(m, j), landed(m, j) + 0.3);
      const appear = P(t, landed(i, j), landed(i, j) + 0.25);
      const row = `${a.id}-lay${i}`;
      if (a.id === "ae") {
        set($(row), "transform", `translate(0 ${(slot * slotH).toFixed(2)})`);
        op(`ae-label${i}`, appear);
        set($(`ae-label${i}`), "transform", `translate(${lerp(-8, 0, appear).toFixed(2)} 0)`);
        set($(`ae-bar${i}`), "width", (340 * P(t, landed(i, j), landed(i, j) + 0.45, E.out)).toFixed(2));
        text(`ae-num${i}`, String(Math.round(slot) + 1));
      } else {
        set($(row), "transform", `translate(${lerp(-8, 0, appear).toFixed(2)} ${(slot * slotH).toFixed(2)})`);
        op(row, appear);
      }
    });
    op(`toast-${a.id}`, P(t, 8.4 + j * 0.1, 8.7 + j * 0.1) * (1 - P(t, 10.7, 11.0)));
  });

  /* each app shows what it can do with real layers */
  op("ai-anchors", P(t, 8.8, 9.1));
  op("ps-select", P(t, 9.0, 9.25));
  op("ps-bbox", P(t, 9.0, 9.25));
  op("ae-keys", P(t, 8.9, 9.1));
  op("ae-play", P(t, 8.85, 9.0));
  const play = P(t, 9.0, 10.8, E.linear);
  set($("ae-playline"), "transform", `translate(${(340 * play).toFixed(2)} 0)`);
  set($("ae-playhead"), "transform", `translate(${(340 * play).toFixed(2)} 0)`);
  set($("ae-L1"), "transform", `translate(0 ${(-40 * Math.sin(Math.PI * play)).toFixed(2)})`);

  /* ---- any app to any app: three quick sends between the other apps ---- */
  op("anycap", P(t, 10.9, 11.2) * (1 - P(t, 15.55, 15.75)));
  set($("anycap"), "transform", `translate(0 ${lerp(10, 0, P(t, 10.9, 11.3, E.out)).toFixed(2)})`);
  op("anychip0", P(t, 10.95, 11.15) * (1 - P(t, 12.3, 12.45)));
  op("anychip1", P(t, 12.45, 12.6) * (1 - P(t, 13.75, 13.9)));
  op("anychip2", P(t, 13.9, 14.05) * (1 - P(t, 15.55, 15.75)));

  // Illustrator → After Effects: a sparkle drawn in Illustrator
  const sparkPop = P(t, 11.0, 11.35, E.back);
  op("ai-spark", P(t, 11.0, 11.1));
  set($("ai-spark"), "transform", `translate(${SPARK_IN_AI[0]} ${SPARK_IN_AI[1]}) scale(${Math.max(0, sparkPop).toFixed(4)})`);
  flight("fly-spark",
    { ...inWin(0, SPARK_IN_AI[0], SPARK_IN_AI[1]), s: poses[0].s },
    { ...inWin(2, ADOBE[2].design[0] + ADOBE[2].design[2] * SPARK_IN_AE[0], ADOBE[2].design[1] + ADOBE[2].design[2] * SPARK_IN_AE[1]), s: ADOBE[2].design[2] * SPARK_IN_AE[2] * poses[2].s },
    SPARK_FLY, t, "side");
  op("ae-spark", t >= landedAt(SPARK_FLY) ? 1 : 0);
  const sparkRow = P(t, landedAt(SPARK_FLY), landedAt(SPARK_FLY) + 0.25);
  op("ae-sparkrow", sparkRow);
  set($("ae-sparkrow"), "transform", `translate(${lerp(-8, 0, sparkRow).toFixed(2)} 0)`);
  set($("ae-sparkbar"), "width", (340 * P(t, landedAt(SPARK_FLY), landedAt(SPARK_FLY) + 0.45, E.out)).toFixed(2));
  set($("ae-keys"), "transform", `translate(0 ${(36 * P(t, landedAt(SPARK_FLY), landedAt(SPARK_FLY) + 0.3)).toFixed(2)})`);

  // Photoshop → Figma: a photo
  op("ps-photo", P(t, 12.55, 12.7));
  set($("ps-photo"), "transform", `translate(${PHOTO_IN_PS[0]} ${PHOTO_IN_PS[1]}) scale(${Math.max(0, P(t, 12.55, 12.9, E.back)).toFixed(4)})`);
  flight("fly-photo",
    { ...inWin(1, PHOTO_IN_PS[0], PHOTO_IN_PS[1]), s: poses[1].s },
    { x: f.x + f.s * (FIG_DESIGN[0] + PHOTO_IN_FIGMA[0]), y: f.y + f.s * (FIG_DESIGN[1] + PHOTO_IN_FIGMA[1]), s: f.s * PHOTO_IN_FIGMA[2] },
    PHOTO_FLY, t, "up");

  // After Effects → Illustrator: a wave animated in After Effects
  const wavePath = $("ae-wave");
  op("ae-wave", t >= 13.95 ? 1 : 0);
  set(wavePath, "stroke-dashoffset", (1 - P(t, 13.95, 14.45)).toFixed(4));
  flight("fly-wave",
    { ...inWin(2, ADOBE[2].design[0], ADOBE[2].design[1]), s: ADOBE[2].design[2] * poses[2].s },
    { ...inWin(0, ADOBE[0].design[0], ADOBE[0].design[1]), s: ADOBE[0].design[2] * poses[0].s },
    WAVE_FLY, t, "side");
  op("ai-wave", t >= landedAt(WAVE_FLY) ? 1 : 0);
  const waveRow = P(t, landedAt(WAVE_FLY), landedAt(WAVE_FLY) + 0.25);
  op("ai-waverow", waveRow);
  set($("ai-waverow"), "transform", `translate(${lerp(-8, 0, waveRow).toFixed(2)} 0)`);

  /* ---- all twelve routes at once ---- */
  op("anyall", P(t, 15.7, 16.1) * (1 - P(t, 18.1, 18.6)));
  op("anyall-title", P(t, 15.9, 16.3));
  set($("anyall-title"), "transform", `translate(0 ${lerp(14, 0, P(t, 15.9, 16.4, E.out)).toFixed(2)})`);
  ANY_POS.forEach(([cx, cy], k) => {
    const pop = P(t, 16.0 + k * 0.08, 16.35 + k * 0.08, E.back);
    op(`anyb${k}`, P(t, 16.0 + k * 0.08, 16.1 + k * 0.08));
    set($(`anyb${k}`), "transform", `translate(${cx} ${cy}) scale(${Math.max(0, pop).toFixed(4)}) translate(${-cx} ${-cy})`);
  });
  op("anyhub", P(t, 16.2, 16.5));
  op("anypackets", P(t, 16.6, 16.9));
  ANY_PAIRS.forEach(([p, q], k) => {
    op(`anyline${k}`, P(t, 16.3 + k * 0.07, 16.6 + k * 0.07));
    const [px, py] = ANY_POS[p], [qx, qy] = ANY_POS[q];
    const len = Math.hypot(qx - px, qy - py), ux = (qx - px) / len, uy = (qy - py) / len, pad = LAY.any.badge * 0.62;
    const along = (u) => [px + ux * (pad + (len - 2 * pad) * u), py + uy * (pad + (len - 2 * pad) * u)];
    const phase = (((t - 16.6) * 0.7 + k * 0.23) % 1 + 1) % 1;
    const [ax, ay] = along(phase), [bx, by] = along(1 - ((phase + 0.5) % 1));
    const pa = $(`anypk${k}a`), pb = $(`anypk${k}b`);
    set(pa, "cx", ax.toFixed(1)); set(pa, "cy", ay.toFixed(1)); set(pa, "opacity", Math.sin(Math.PI * phase).toFixed(3));
    const phaseB = (phase + 0.5) % 1;
    set(pb, "cx", bx.toFixed(1)); set(pb, "cy", by.toFixed(1)); set(pb, "opacity", Math.sin(Math.PI * phaseB).toFixed(3));
  });

  /* the end: the logo builds, then the line */
  op("end", P(t, 18.0, 18.5));
  const stem = P(t, 18.35, 18.65, E.out);
  op("end-stem", stem); set($("end-stem"), "transform", `translate(0 ${lerp(1.5, 0, stem).toFixed(3)})`);
  op("end-foot", P(t, 18.45, 18.7)); set($("end-foot"), "transform", `translate(${lerp(2.5, 0, P(t, 18.65, 19.15, E.out)).toFixed(3)} 0)`);
  const bridge = P(t, 19.05, 19.35, E.back);
  op("end-bridge", P(t, 19.05, 19.15));
  set($("end-bridge"), "transform", `translate(7.2 19.5) scale(${Math.max(0, bridge).toFixed(4)} 1) translate(-7.2 -19.5)`);
  const wipe = P(t, 19.35, 19.95, E.linear);
  set($("endwipe-rect"), "width", (95.2 * wipe).toFixed(3));
  set($("end-word"), "transform", `translate(${lerp(-1.5, 0, wipe).toFixed(3)} 0)`);
  const shine = P(t, 20.0, 20.6, E.linear);
  set($("end-shine"), "transform", `translate(${lerp(-2, 108.7, shine).toFixed(3)} 0)`);
  op("end-shine", t > 20.0 && t < 20.6 ? 0.9 * Math.min(1, shine * 8, (1 - shine) * 8) : 0);
  const lines = P(t, 19.9, 20.4, E.out);
  op("end-lines", lines); set($("end-lines"), "transform", `translate(0 ${lerp(14, 0, lines).toFixed(2)})`);
}

/* ------------------------------------------------------------------ playback */
const stage = $("stage"), scrub = $("scrub"), playBtn = $("play"), timeLabel = $("time");
const query = new URLSearchParams(location.search);
if (query.has("export")) document.body.classList.add("export");
function fit() {
  const bar = document.body.classList.contains("export") ? 0 : 52;
  const s = Math.min(innerWidth / SW, (innerHeight - bar) / SH);
  stage.style.transform = `translate(${(innerWidth - SW * s) / 2}px, ${(innerHeight - bar - SH * s) / 2}px) scale(${s})`;
}
addEventListener("resize", fit);
fit();

let playing = !query.has("t"), tNow = query.has("t") ? +query.get("t") : 0, origin = performance.now() - tNow * 1000;
function show(t) {
  tNow = t;
  render(t);
  scrub.value = t;
  timeLabel.textContent = `${t.toFixed(2)} / ${DUR.toFixed(2)} s`;
}
function setPlaying(on) {
  playing = on;
  playBtn.textContent = on ? "Pause" : "Play";
  if (on) origin = performance.now() - tNow * 1000;
}
playBtn.onclick = () => setPlaying(!playing);
scrub.oninput = () => { setPlaying(false); show(+scrub.value); };
addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); setPlaying(!playing); }
  if (e.code === "ArrowRight" || e.code === "ArrowLeft") { setPlaying(false); show(clamp(tNow + (e.code === "ArrowRight" ? 1 : -1) / 30, 0, DUR)); }
});
function tick(now) {
  if (playing) show(((now - origin) / 1000) % DUR);
  requestAnimationFrame(tick);
}
show(tNow);
setPlaying(playing);
requestAnimationFrame(tick);
window.renderAt = (t) => { setPlaying(false); show(t); };
</script>
</body>
</html>
