<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LazyTyper Demo</title>
<!--
  The README demo of LazyTyper, drawn in code on a canvas: no screen recording, no images.
  Built by tools/demo/build.mjs from tools/demo/page.template.html: the typing engine
  (client/engine.js), the rig definitions and presets (client/rig.js) and the panel colours
  (client/style.css) are copied in, so every keystroke here comes from lazyTyperRun.
-->
<style>
  :root {
    --page: #0c0b12;
    --bar: #15131f;
    --bar-2: #2a2640;
    --line: #312c48;
    --text: #f1effa;
    --muted: #8d87a8;
    --accent: #a78bfa;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }

  .player { width: min(1280px, 100%); background: #15131f; border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .player:fullscreen { width: 100vw; height: 100vh; border-radius: 0; border: 0;
    display: flex; flex-direction: column; }
  .stage { position: relative; aspect-ratio: 16 / 9; background: #141414; }
  .player:fullscreen .stage { flex: 1; aspect-ratio: auto; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }

  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    cursor: pointer; background: rgba(12, 11, 18, .25); }
  .overlay.hidden { display: none; }
  .bigplay { width: 84px; height: 84px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #7c3aed, #db2777); box-shadow: 0 10px 40px rgba(124, 58, 237, .45);
    transition: transform .15s; }
  .overlay:hover .bigplay { transform: scale(1.06); }

  .controls { display: flex; flex-direction: column; gap: 6px; padding: 8px 12px 10px;
    background: var(--bar); border-top: 1px solid var(--line); user-select: none; }
  .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .spacer { flex: 1; }

  input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 5px; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent) 0 var(--p, 0%), var(--bar-2) var(--p, 0%) 100%); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -4.5px;
    border-radius: 50%; background: #fff; border: 0; box-shadow: 0 0 0 3px rgba(167, 139, 250, .35); }
  input[type=range]::-moz-range-track { height: 5px; border-radius: 3px; background: var(--bar-2); }
  input[type=range]::-moz-range-progress { height: 5px; border-radius: 3px; background: var(--accent); }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 0; }
  #seek { width: 100%; height: 16px; }
  #vol { width: 80px; height: 16px; }

  .btn { width: 34px; height: 32px; border: 0; border-radius: 7px; background: transparent; color: var(--text);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .btn:hover { background: var(--bar-2); }
  .btn:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn svg { width: 18px; height: 18px; fill: currentColor; }
  .btn.on { color: var(--accent); background: #2e2452; }
  .readout { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); padding: 0 6px; white-space: nowrap; }
  .readout b { color: var(--text); font-weight: 600; }
  select { background: var(--bar-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    font: 12px "Segoe UI", system-ui, sans-serif; height: 28px; padding: 0 6px; cursor: pointer; }
  .keys { font-size: 11px; color: var(--muted); padding: 2px 4px 0; }
  .keys kbd { font: 10px "Segoe UI", system-ui, sans-serif; background: var(--bar-2); border: 1px solid var(--line); border-radius: 4px;
    padding: 0 4px; color: var(--text); }
  @media (max-width: 640px) {
    .keys { display: none; }
    #vol { width: 60px; }
    .readout.frames { display: none; }
  }
</style>
</head>
<body>
<div class="player" id="player">
  <div class="stage">
    <canvas id="cv" width="1920" height="1080" aria-label="LazyTyper demo animation: in After Effects a search-bar text layer gets a typing rig in one click and types on with a natural rhythm; the preset changes to Hunt &amp; Peck and then Very Fast, “after effects” is erased and “premiere pro” typed in its place, and baking fills the timeline with keyframes coloured by character type"></canvas>
    <div class="overlay" id="overlay" title="Play">
      <div class="bigplay"><svg viewBox="0 0 24 24" width="34" height="34" fill="#fff"><path d="M8 5v14l11-7z"/></svg></div>
    </div>
  </div>
  <div class="controls">
    <input type="range" id="seek" min="0" max="18000" step="1" value="0" aria-label="Seek">
    <div class="row">
      <button class="btn" id="bPlay" title="Play / pause (Space, K)" aria-label="Play"></button>
      <button class="btn" id="bRestart" title="Restart (Home)" aria-label="Restart"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
      <button class="btn" id="bPrev" title="Previous frame (← or ,)" aria-label="Previous frame"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
      <button class="btn" id="bNext" title="Next frame (→ or .)" aria-label="Next frame"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      <span class="readout" id="time"><b>0:00.00</b> / 0:18.00</span>
      <span class="readout frames" id="frames">Frame <b>1</b> / 540</span>
      <span class="spacer"></span>
      <select id="speed" title="Playback speed" aria-label="Playback speed">
        <option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="0.75">0.75×</option>
        <option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option>
      </select>
      <button class="btn on" id="bLoop" title="Loop (L)" aria-label="Loop"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
      <button class="btn" id="bMute" title="Mute (M)" aria-label="Mute"></button>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
      <button class="btn" id="bFull" title="Fullscreen (F)" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7zm-2-4h2V7h3V5H5zm12 7h-3v2h5v-5h-2zM14 5v2h3v3h2V5z"/></svg></button>
    </div>
    <div class="keys"><kbd>Space</kbd>/<kbd>K</kbd> play · <kbd>←</kbd><kbd>→</kbd> or <kbd>,</kbd><kbd>.</kbd> frame · <kbd>Shift</kbd>+<kbd>←</kbd><kbd>→</kbd> ±1 s · <kbd>Home</kbd>/<kbd>End</kbd> · <kbd>M</kbd> mute · <kbd>L</kbd> loop · <kbd>F</kbd> fullscreen</div>
  </div>
</div>

<!-- client/engine.js, copied in by tools/demo/build.mjs -->
<script>
/*
 * LazyTyper timing engine.
 *
 * One function, lazyTyperRun(io), decides how many characters of a text layer
 * are showing at a given time. The panel copies its source (through
 * Function.prototype.toString) into the rig's expressions, the Node tests call
 * it directly, and the bake step runs it once with io.record set to get every
 * keystroke. So it must stay plain ES3: it runs in After Effects' legacy
 * ExtendScript expression engine as well as the JavaScript one. No let/const,
 * arrow functions, Array.prototype.indexOf, forEach, JSON, getters or trailing
 * commas, and only full-line comments inside the function (the expression
 * builder strips them).
 *
 * io = {
 *   time:   the time to answer for (seconds),
 *   fd:     the comp's frame duration,
 *   start:  when the layer starts (typing never runs before it),
 *   num:    function (controlName, t) -> number (a control's value at t),
 *   text:   function (t) -> string (the full text at t, before any expression),
 *   pauses: [[from, to], ...] times when typing waits (pause markers),
 *   record: true to get [[frameTime, count], ...] for every change instead of the count
 * }
 * Every field must be set: the legacy expression engine throws on reading a missing one.
 *
 * Typing model. Every character waits a number of frames before it appears:
 * the base speed (Frames Per Character, or Total Duration shared out over the
 * text) times a weight that the slow down / speed up controls and Variance
 * set from the character and its neighbours. Typing only runs while the
 * Typing checkbox is on and no pause marker covers the frame; the first
 * character of each run appears at once. The characters shown are
 * Start at Character + characters typed so far, kept between 0 and the text
 * length, so lowering Start at Character while typing is off deletes text and
 * typing on later continues from wherever the text is.
 */
function lazyTyperRun(io) {
  var fd = io.fd > 0 ? io.fd : 1 / 30;
  var num = io.num;
  var pauses = io.pauses;
  var PUNCT = ".,;:!?'\"-()[]\u2026\u2014\u2013\u2018\u2019\u201C\u201D\u00BF\u00A1\u0964\u0965\u060C\u061F\u3001\u3002";
  var SYM = "@#$%^&*_+=<>{}|\\/~`";
  var AFTER = ",;:\u060C\u3001";
  var ENDS = ".!?\u0964\u0965\u061F\u3002";
  var PAIRS = ",th,he,in,er,an,re,on,at,en,nd,ti,es,or,te,of,ed,is,it,al,ar,st,to,nt,ng,se,ha,as,ou,io,le,ve,co,me,de,hi,ri,ro,ic,ne,ea,ra,ce,";
  var WORDS = ",the,and,to,of,a,in,is,it,you,that,for,on,with,as,was,i,be,at,this,have,are,he,she,we,they,but,not,or,my,your,so,if,do,can,will,just,all,an,by,from,";
  var LEFT = "qwertasdfgzxcvb";
  var RIGHT = "yuiophjklnm";

  function isNL(c) { return c === "\r" || c === "\n" || c === "\u0003" || c === "\u2028" || c === "\u2029"; }
  function isSpace(c) { return c === " " || c === "\t" || c === "\u00A0" || c === "\u3000" || c === "\u2009"; }
  function isDigit(c) { return c >= "0" && c <= "9"; }
  function isPunct(c) { return c !== "" && PUNCT.indexOf(c) >= 0; }
  function isSym(c) { return c !== "" && SYM.indexOf(c) >= 0; }
  function isLetter(c) {
    if (c === "") return false;
    if (c.toLowerCase() !== c.toUpperCase()) return true;
    return c > "\u007F" && !isSpace(c) && !isNL(c) && !isPunct(c) && !isSym(c);
  }
  function isWord(c) { return isLetter(c) || isDigit(c); }
  function hand(c) {
    if (c === "") return -1;
    if (LEFT.indexOf(c) >= 0) return 0;
    if (RIGHT.indexOf(c) >= 0) return 1;
    return -1;
  }
  function rnd(i, seed) {
    var x = Math.sin(i * 12.9898 + seed * 78.233 + 1.618) * 43758.5453;
    return x - Math.floor(x);
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function on(t) {
    if (num("Typing", t) < 0.5) return false;
    for (var p = 0; p < pauses.length; p++) {
      if (t >= pauses[p][0] - 1e-6 && t < pauses[p][1] - 1e-6) return false;
    }
    return true;
  }

  // How much longer (>1) or shorter (<1) than the base speed character i of s takes.
  function weight(s, i, t) {
    var c = s.charAt(i);
    var p = i > 0 ? s.charAt(i - 1) : "";
    var lc = c.toLowerCase();
    var w = 1;
    function slow(name, scale) { var v = num(name, t) / 100 * scale; if (v > 0) w *= 1 + v; }
    function fast(name, scale) { var v = num(name, t) / 100 * scale; if (v > 0) w /= 1 + v; }
    function either(name, scale) {
      var v = num(name, t) / 100 * scale;
      if (v > 0) w *= 1 + v;
      else if (v < 0) w /= 1 - v;
    }
    var ws = i, we = i;
    if (isWord(c)) {
      while (ws > 0 && isWord(s.charAt(ws - 1))) ws--;
      while (we < s.length && isWord(s.charAt(we))) we++;
    }
    var wordLen = we - ws;
    var inWord = i - ws;

    if (isLetter(c) && c !== lc) slow("Slow: Capitals", 1);
    if (isDigit(c)) slow("Slow: Numbers", 1);
    if (isSym(c)) slow("Slow: Symbols", 1);
    if (isPunct(c)) slow("Slow: Punctuation", 1);
    if (p !== "" && AFTER.indexOf(p) >= 0) slow("Slow: After Punctuation", 1);
    if (p !== "" && ENDS.indexOf(p) >= 0) slow("Slow: Sentence End", 1);
    if (p !== "" && isNL(p)) slow("Slow: New Line", 1);
    if (isWord(c) && inWord === 0) slow("Slow: Word Start", 1);
    if (isLetter(c) && wordLen > 6) slow("Slow: Long Words", Math.min(1, (wordLen - 6) / 6));
    if ("qzxjkv".indexOf(lc) >= 0 && lc !== "") slow("Slow: Rare Letters", 1);

    if (isLetter(c) && p !== "" && lc === p.toLowerCase()) fast("Fast: Repeated Letters", 1);
    if (isLetter(c) && isLetter(p) && PAIRS.indexOf("," + (p + c).toLowerCase() + ",") >= 0) fast("Fast: Common Pairs", 1);
    if (isWord(c) && WORDS.indexOf("," + s.substring(ws, we).toLowerCase() + ",") >= 0) fast("Fast: Common Words", 1);
    if (isLetter(c) && inWord >= 2) fast("Fast: Word Momentum", Math.min(1, (inWord - 1) / 4));

    if (isSpace(c)) either("Slow/Fast: Spaces", 1);
    if (isLetter(c) && isLetter(p) && hand(lc) >= 0 && hand(lc) === hand(p.toLowerCase())) either("Slow/Fast: Same Hand", 1);
    if (s.length > 1) either("Slow/Fast: Fatigue", i / (s.length - 1));

    var variance = num("Variance", t) / 100;
    if (variance > 0) {
      var seed = num("Random Seed", t);
      if (rnd(i, seed) < variance) w *= 1.25 + 1.25 * rnd(i + 0.37, seed);
    }
    return w;
  }

  var tdMode = false;
  var unit = 1;
  // Frames to wait before character i of s appears.
  function frames(s, i, t) {
    var base = tdMode ? unit : num("Frames Per Character", t);
    return Math.max(0.02, base * weight(s, i, t));
  }

  var typed = 0;
  var acc = 0;
  var need = -1;
  var needFor = -1;
  var needText = null;
  var running = false;
  var shown = -1;
  var log = [];
  var start = io.start;
  var n = Math.floor((io.time - start) / fd + 1e-4);
  if (n < 0) n = -1;

  for (var f = 0; f <= n; f++) {
    var t = start + f * fd;
    var s = io.text(t);
    var len = s.length;
    var startAt = Math.round(num("Start at Character", t));
    var pos = clamp(startAt + typed, 0, len);
    if (!on(t)) {
      running = false;
      acc = 0;
      need = -1;
    } else if (pos < len) {
      if (!running) {
        running = true;
        tdMode = Math.round(num("Speed Mode", t)) === 2;
        if (tdMode) {
          // The run's first character appears at once, so the duration covers the rest.
          var total = 0;
          for (var q = pos + 1; q < len; q++) total += weight(s, q, t);
          unit = Math.max(0, num("Total Duration", t)) / Math.max(1e-6, total);
        }
        need = -1;
        acc = 1e9;
      } else {
        acc += 1;
      }
      var guard = 0;
      while (pos < len && guard < 100000) {
        guard++;
        if (need < 0 || needFor !== pos || needText !== s) {
          need = frames(s, pos, t);
          needFor = pos;
          needText = s;
        }
        if (acc >= 1e8) {
          acc = 0;
        } else if (acc + 1e-9 < need) {
          break;
        } else {
          acc -= need;
        }
        typed++;
        pos++;
        need = -1;
      }
    } else {
      acc = 0;
      need = -1;
    }
    if (io.record) {
      var now = clamp(startAt + typed, 0, len);
      if (now !== shown) {
        log.push([t, now]);
        shown = now;
      }
    }
  }
  if (io.record) return log;
  var last = io.text(io.time);
  if (n < 0) return clamp(Math.round(num("Start at Character", io.time)), 0, last.length);
  return clamp(Math.round(num("Start at Character", io.time)) + typed, 0, last.length);
}

if (typeof window !== "undefined") window.lazyTyperRun = lazyTyperRun;
if (typeof module !== "undefined" && module.exports) module.exports = { lazyTyperRun: lazyTyperRun };
</script>
<!-- client/rig.js, copied in by tools/demo/build.mjs -->
<script>
/*
 * LazyTyper rig definitions: the controls a rig adds, the built-in presets and
 * the expressions the host writes into the layers.
 *
 * Plain ES5 (CEP 9's Chromium 61). Sets window.LazyTyperRig and, for the Node
 * tests, module.exports. The expressions themselves are ES3 so they run in
 * both of After Effects' expression engines; none of them uses the
 * sourceText.style API, which the legacy engine does not have.
 */
(function () {
  var engine = (typeof lazyTyperRun === "function") ? lazyTyperRun :
    (typeof require === "function" ? require("./engine.js").lazyTyperRun : null);

  var VERSION = "1.1.0";
  var TAG = "LazyTyper";

  /* Controls on the text layer, in the order they appear in Effect Controls. */
  var TEXT_CONTROLS = [
    { name: "Typing", type: "checkbox", value: 1, group: "typing" },
    { name: "Start at Character", type: "slider", value: 0, group: "typing" },
    { name: "Speed Mode", type: "dropdown", items: ["Frames Per Character", "Total Duration"], value: 1, group: "speed" },
    { name: "Frames Per Character", type: "slider", value: 3, group: "speed" },
    { name: "Total Duration", type: "slider", value: 90, group: "speed" },
    { name: "Variance", type: "slider", value: 35, group: "speed" },
    { name: "Random Seed", type: "slider", value: 1, group: "speed" },
    { name: "Slow: Capitals", type: "slider", value: 60, group: "slow" },
    { name: "Slow: Numbers", type: "slider", value: 60, group: "slow" },
    { name: "Slow: Symbols", type: "slider", value: 120, group: "slow" },
    { name: "Slow: Punctuation", type: "slider", value: 40, group: "slow" },
    { name: "Slow: After Punctuation", type: "slider", value: 250, group: "slow" },
    { name: "Slow: Sentence End", type: "slider", value: 500, group: "slow" },
    { name: "Slow: New Line", type: "slider", value: 400, group: "slow" },
    { name: "Slow: Word Start", type: "slider", value: 50, group: "slow" },
    { name: "Slow: Long Words", type: "slider", value: 30, group: "slow" },
    { name: "Slow: Rare Letters", type: "slider", value: 40, group: "slow" },
    { name: "Fast: Repeated Letters", type: "slider", value: 30, group: "fast" },
    { name: "Fast: Common Pairs", type: "slider", value: 30, group: "fast" },
    { name: "Fast: Common Words", type: "slider", value: 20, group: "fast" },
    { name: "Fast: Word Momentum", type: "slider", value: 20, group: "fast" },
    { name: "Slow/Fast: Spaces", type: "slider", value: 0, group: "either" },
    { name: "Slow/Fast: Same Hand", type: "slider", value: 20, group: "either" },
    { name: "Slow/Fast: Fatigue", type: "slider", value: 10, group: "either" },
    { name: "Characters Shown", type: "slider", value: 0, group: "output" }
  ];

  /* Controls on the cursor layer. Sizes are percentages of the font size. */
  var CURSOR_CONTROLS = [
    { name: "Text Layer", type: "layer" },
    { name: "Guide Layer", type: "layer", dynamicOnly: true },
    { name: "Cursor Color", type: "color", value: [1, 1, 1] },
    { name: "Cursor Opacity", type: "slider", value: 100 },
    { name: "Blink", type: "checkbox", value: 1 },
    { name: "Blinks per Second", type: "slider", value: 1 },
    { name: "Blink While Typing", type: "checkbox", value: 0 },
    { name: "Blink Softness", type: "slider", value: 0 },
    { name: "Width", type: "slider", value: 7 },
    { name: "Top", type: "slider", value: 80 },
    { name: "Bottom", type: "slider", value: 16 },
    { name: "Roundness", type: "slider", value: 0 },
    { name: "Individual Corners", type: "checkbox", value: 0 },
    { name: "Top Left", type: "slider", value: 0 },
    { name: "Top Right", type: "slider", value: 0 },
    { name: "Bottom Right", type: "slider", value: 0 },
    { name: "Bottom Left", type: "slider", value: 0 },
    { name: "X Offset", type: "slider", value: 0 },
    { name: "Y Offset", type: "slider", value: 0 }
  ];

  /* The typing controls a preset stores (everything but the start/stop and output controls). */
  var TYPING_PRESET_KEYS = [];
  for (var i = 0; i < TEXT_CONTROLS.length; i++) {
    var g = TEXT_CONTROLS[i].group;
    if (g !== "typing" && g !== "output") TYPING_PRESET_KEYS.push(TEXT_CONTROLS[i].name);
  }
  var CURSOR_PRESET_KEYS = ["Cursor Opacity", "Blink", "Blinks per Second", "Blink While Typing", "Blink Softness",
    "Width", "Top", "Bottom", "Roundness", "Individual Corners", "Top Left", "Top Right", "Bottom Right", "Bottom Left",
    "X Offset", "Y Offset"];

  function preset(fpc, variance, slow, fast, either) {
    return {
      "Speed Mode": 1, "Frames Per Character": fpc, "Total Duration": 90, "Variance": variance, "Random Seed": 1,
      "Slow: Capitals": slow[0], "Slow: Numbers": slow[1], "Slow: Symbols": slow[2], "Slow: Punctuation": slow[3],
      "Slow: After Punctuation": slow[4], "Slow: Sentence End": slow[5], "Slow: New Line": slow[6],
      "Slow: Word Start": slow[7], "Slow: Long Words": slow[8], "Slow: Rare Letters": slow[9],
      "Fast: Repeated Letters": fast[0], "Fast: Common Pairs": fast[1], "Fast: Common Words": fast[2],
      "Fast: Word Momentum": fast[3],
      "Slow/Fast: Spaces": either[0], "Slow/Fast: Same Hand": either[1], "Slow/Fast: Fatigue": either[2]
    };
  }

  var TYPING_PRESETS = [
    /* At 30 fps: about 14, 7 and 2.5 characters a second (a very fast typist, an everyday
       one sped up a little for the screen, and two fingers). */
    { name: "Very Fast", builtIn: true, values: preset(2.2, 15, [30, 30, 60, 20, 150, 300, 250, 20, 0, 10], [40, 40, 30, 30], [-20, 10, 0]) },
    { name: "Average", builtIn: true, values: preset(3, 35, [60, 60, 120, 40, 250, 500, 400, 50, 30, 40], [30, 30, 20, 20], [0, 20, 10]) },

const appliedAt = (f) => (f >= F.apply2 ? "Very Fast" : f >= F.apply1 ? "Hunt & Peck" : "Average");

function compFrameAt(f) {
  let c = 0;
  for (const p of PLAYS) { if (f < p.at) break; c = Math.min(p.to, p.from + (f - p.at)); }
  if ((f >= F.home1 && f < F.playH) || (f >= F.home2 && f < F.playV)) c = 0;

}

/* ================================================================

   ================================================================ */
const snap = (v) => Math.round(v * S) / S;
const font = (px, weight = 400, fam = UI) => `${weight} ${px}px ${fam}`;
let fmCache = {};
function metrics(f) {

    ctx.font = f;
    const t = ctx.measureText("Hg");

  }

}
function tw(s, px, weight = 400, fam = UI, ls = 0) {

}
/* Text placed like CSS places a line: centred in a box of height h (a line box is 1.4 x the size). */
function txt(s, x, top, h, px, weight, color, align = "left", fam = UI, ls = 0) {
  const f = font(px, weight, fam);
  const m = metrics(f);
  ctx.font = f;
  ctx.letterSpacing = ls + "px";
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = "alphabetic";
  ctx.fillText(s, x, snap(top + (h - (m.a + m.d)) / 2 + m.a));

function rr(x, y, w, h, r) {

  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);

}
/* A CSS box: background, optional 1px border, corner radius; edges snapped to device pixels. */

  if (border) {
    rr(x0, y0, x1 - x0, y1 - y0, r); ctx.fillStyle = border; ctx.fill();
    rr(x0 + 1, y0 + 1, x1 - x0 - 2, y1 - y0 - 2, r - 1); ctx.fillStyle = fill; ctx.fill();

function rect(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(snap(x), snap(y), snap(x + w) - snap(x), snap(y + h) - snap(y)); }
function wrap(s, maxW, px, weight = 400) {
  const words = s.split(" "), lines = [];
  let line = "";

    const tryLine = line ? line + " " + w : w;
    if (line && tw(tryLine, px, weight) > maxW) { lines.push(line); line = w; } else line = tryLine;

}
const ease = (u) => (u <= 0 ? 0 : u >= 1 ? 1 : u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
function track(keys, f) {
  if (f <= keys[0][0]) return keys[0].slice(1);
  for (let i = 1; i < keys.length; i++) {
    const [f0, ...a] = keys[i - 1], [f1, ...b] = keys[i];
    if (f <= f1) { const u = ease((f - f0) / (f1 - f0)); return a.map((v, k) => v + (b[k] - v) * u); }

}

// The rhythm strip of client/main.js drawRhythm(), for a preset and a text.
const rhythmCache = {};
const CLASS_COLORS = { letters: "#a78bfa", numbers: "#fbbf24", punct: "#f472b6", spaces: "#34d399" };
function classOf(c) {
  if (c === " " || c === "\r" || c === "\n" || c === "\t" || c === "\u0003") return "spaces";
  if (c >= "0" && c <= "9") return "numbers";
  if (c.toLowerCase() !== c.toUpperCase() || c.charCodeAt(0) > 127) return "letters";
  return "punct";
}
function rhythm(preset, text) {
  const id = preset + "/" + text;
  if (!rhythmCache[id]) {
    const values = presetValues(preset);
    rhythmCache[id] = run({ time: Math.max(10, text.length * 2), fd: 1 / FPS, start: 0, record: true, pauses: [],
      num: (n) => values[n], text: () => text });
  }
  return rhythmCache[id];
}
function drawRhythm(R, preset, text, sample) {
  box(R.x, R.y, R.w, R.h, 8, C.input, C.line);
  const ev = rhythm(preset, text), w = R.cw, h = R.ch, x = R.cx, y = R.cy;
  const end = ev[ev.length - 1][0] || 1;
  rect(x, y + h - 10, w, 1, C.line);
  const step = end > 20 ? 5 : end > 8 ? 2 : 1;
  for (let s = 0; s <= end; s += step) {
    const sx = Math.round(s / end * (w - 4)) + 2;
    rect(x + sx, y + h - 12, 1, 4, C.muted);
    if (s > 0 && sx < w - 14) {
      ctx.font = font(9); ctx.fillStyle = C.muted; ctx.textAlign = "left";
      ctx.fillText(s + "s", x + sx + 2, snap(y + h - 1));
    }
  }
  let prevT = 0;
  for (let i = 0; i < ev.length; i++) {
    const [t, k] = ev[i];
    const wait = i === 0 ? 0 : t - prevT;
    prevT = t;
    const bh = Math.max(4, Math.min(h - 14, 6 + wait * 60));
    const bx = Math.round(t / end * (w - 4)) + 2;
    rect(x + bx - 1, y + h - 11 - bh, 2, bh, CLASS_COLORS[classOf(text.charAt(k - 1))]);
  }
  // legend: four swatches, then the total on the next line at the right
  let lx = x;
  const ly = y + h + 4;
  for (const [name, col] of [["Letters", "#a78bfa"], ["Numbers", "#fbbf24"], ["Punctuation", "#f472b6"], ["Spaces", "#34d399"]]) {
    box(lx, ly + 4.5, 7, 7, 2, col);
    txt(name, lx + 10, ly, 14, 10, 400, C.muted);
    lx += 10 + tw(name, 10) + 8;
  }
  const total = (sample ? "sample · " : "") + end.toFixed(1) + " s · " + Math.round(text.length / Math.max(0.01, end)) + " char/s";
  txt(total, x + w, ly + 14, 14, 10, 600, C["text-2"], "right");
}

}

let PTR = null, SAMPLE = "Hello there! This is how the typing will feel, word by word.";

  const srcWatch = [41, TL.rows + 5 * TL.rowH + TL.rowH / 2 + 1];
  const sel = at(P.selPreset, B, 0.45);
  const apply = at(P.btnApplyTyping, B);
  return [
    [F.ptrIn, 330, 270],
    [F.selClick - 2, ...query], [F.selClick + 3, ...query],
    [F.createClick - 2, ...at(P.btnCreate, 0, 0.55)], [F.createClick + 4, ...at(P.btnCreate, 0, 0.55)],

    [F.apply1 - 2, ...apply], [F.apply1 + 6, ...apply],

}
const SCROLL = () => [[0, 0], [66, 0], [76, L.scrollB], [F.start + 10, L.scrollB], [F.start + 20, L.scrollC]];
const TOASTS = () => [
  [F.createClick + 1, "Rigged Query."],
  [F.apply1, "Applied “Hunt & Peck”."],
  [F.apply2, "Applied “Very Fast”."],
  [F.stop, "Typing stops here."],
  [F.erase, `Typing stops here and the last ${ERASE} characters backspace away over ${ERASE_FRAMES} frames. Start typing again later to type on.`],
  [F.start, "Typing starts here."],
  [F.bake, `Baked Query (${BAKED.length} keyframes). Shift+click Bake to unbake.`],
];

function stateAt(f) {
  const st = { f };
  st.selected = f >= F.selClick;
  st.rig = f > F.createClick;
  st.c = compFrameAt(f);
  st.stage = stageAt(f);
  st.applied = appliedAt(f);
  st.picked = pickedAt(f);
  const tp = typing(st.applied, st.stage);
  st.keys = tp.io.keys;
  st.text = st.rig ? tp.io.text(st.c / FPS) : TEXT0;
  st.count = st.rig ? countAt(tp, st.c) : TEXT0.length;
  // cursor layer: solid while keys come in (Blink While Typing off), else 1 blink a second
  if (st.rig) {
    const busy = countAt(tp, st.c) !== countAt(tp, st.c - 12);
    st.cursor = busy || ((st.c / FPS) % 1) < 0.5;
  }
  st.baked = f > F.bake;
  st.bakedUpTo = st.baked ? COMP_SECONDS * Math.min(1, (f - F.bake - 1) / 12) : undefined;
  if (st.baked && st.bakedUpTo <= 0) st.bakedUpTo = 0.001;
  // panel
  st.scroll = Math.round(track(SCROLL(), f)[0] * S) / S;
  st.statusTitle = st.selected ? "Query" : "Select a text layer";
  st.statusSub = !st.selected ? "In “Search Bar”." : !st.rig ? "Text layer, no rig yet." :
    "Dynamic rig" + (st.baked ? " · baked" : "") + " · cursor · " + st.count + " / " + st.text.length + " characters";
  st.meter = st.rig ? st.count / st.text.length : 0;
  st.popOpen = (f >= F.pop1 && f < F.pick1) || (f >= F.pop2 && f < F.pick2);
  st.presetFocus = (f >= F.pop1 && f < F.apply1) || (f >= F.pop2 && f < F.apply2);
  const toast = TOASTS().filter(([t0]) => f >= t0 && f < t0 + 3.8 * FPS).pop();
  st.toast = toast ? toast[1] : null;
  st.tip = f >= F.src && f < F.start - 2;
  // pointer and what it is over
  const [x, y] = track(PTR, f);
  st.ptr = { x, y };
  const click = CLICKS.filter((c) => f >= c && f < c + 7).pop();
  st.ring = click === undefined ? -1 : f - click;
  const pressedAt = { [F.createClick]: L.btnCreate, [F.apply1]: L.btnApplyTyping, [F.apply2]: L.btnApplyTyping,
    [F.stop]: L.btnStop, [F.erase]: L.btnErase, [F.start]: L.btnStart, [F.bake]: L.btnBake };
  st.pressed = click !== undefined && f < click + 4 ? pressedAt[click] : null;
  st.hover = null;
  if (st.popOpen) {
    const p = popupBox();
    const i = Math.floor((y - p.y - 2) / POP_ITEM) - 1;
    st.popHover = x >= p.x && x < p.x + p.w && i >= 0 && i < 3 ? ["Very Fast", "Average", "Hunt & Peck"][i] : st.picked;
  } else if (x >= PX && x < PX + PW && y >= PY && y < PY + PH) {
    const lx = x - PX, ly = y - PY + st.scroll;
    for (const id of ["btnCreate", "btnApplyTyping", "btnSaveTyping", "btnStart", "btnStop", "btnErase", "btnRefresh", "btnBake", "btnRemove"]) {
      const b = L[id];
      if (lx >= b.x && lx < b.x + b.w && ly >= b.y && ly < b.y + b.h) st.hover = b;
    }
  }

}

function render(t) { renderFrame(Math.min(N - 1, Math.floor(t * FPS + 1e-6))); }
function renderFrame(f) {
  if (!L) init();
  ctx.setTransform(S, 0, 0, S, 0, 0);
  // the end card covers the frame at the start (sliding off downwards) and comes down at the end
  let cover = null;
  if (f < F.wipeOut) cover = [0, H];
  else if (f < F.wipeOut + 8) cover = [H * ease((f - F.wipeOut + 1) / 8), H];
  else if (f >= F.wipeIn) cover = [0, H * ease((f - F.wipeIn + 1) / 6)];
  if (!cover || cover[1] - cover[0] < H) {
    const st = stateAt(f);
    drawChrome();
    drawComp(st);
    drawTimeline(st);
    ctx.save();
    ctx.beginPath(); ctx.rect(PX, PY, PW, PH); ctx.clip();
    ctx.translate(PX, PY - st.scroll);
    drawPanelPage(st);
    ctx.restore();
    ctx.save();
    ctx.beginPath(); ctx.rect(PX, PY, PW, PH); ctx.clip();
    drawToast(st);
    ctx.restore();
    if (st.popOpen) drawPopup(st);
    drawTooltip(st);
    drawPointer(st.ptr.x, st.ptr.y, st.ring);
  }

}

function init() {
  ctx.setTransform(S, 0, 0, S, 0, 0);
  L = layoutPanel();
  PTR = pointerKeys();
}
function setScale(s) {
  S = s;
  cv.width = W * s;
  cv.height = H * s;
  fmCache = {};
  L = null;
  S_dirty();
}

/* ================================================================

    n.connect(bp).connect(g).connect(master); n.start(t, r * 0.8); n.stop(t + 0.07);
    const o = oc.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(kind === "space" ? 150 : 230 + 40 * r, t); o.frequency.exponentialRampToValueAtTime(90, t + 0.04);
    const g2 = oc.createGain(); g2.gain.setValueAtTime(0.0001, t); g2.gain.exponentialRampToValueAtTime(0.16, t + 0.003); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    o.connect(g2).connect(master); o.start(t); o.stop(t + 0.06);
  }
  function tick(t, f0, amp) {
    const o = oc.createOscillator(); o.type = "triangle"; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * 0.6, t + 0.03);
    const g = oc.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(amp, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
    o.connect(g).connect(master); o.start(t); o.stop(t + 0.05);
  }
  function chime(t, hz, len, amp) {
    const o = oc.createOscillator(); o.type = "sine"; o.frequency.value = hz;
    const g = oc.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(amp, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g).connect(master); o.start(t); o.stop(t + len + 0.02);
  }
  // keystrokes, frame by frame through every play (and the end card's name, both sides of the loop)
  let prev = null;
  for (let f = 0; f < N; f++) {
    const st = { c: compFrameAt(f), applied: appliedAt(f), stage: stageAt(f) };
    const rig = f > F.createClick;
    const tp = typing(st.applied, st.stage);
    const cnt = rig ? countAt(tp, st.c) : -1;
    if (prev && playingAt(f - 1) && rig && prev.rig) {
      const d = cnt - prev.cnt, txt = tp.io.text(st.c / FPS);
      for (let i = 0; i < Math.abs(d); i++) {
        const ch = txt.charAt((d > 0 ? prev.cnt + i : 0));
        key(f / FPS + i * 0.014, d < 0 ? "back" : ch === " " ? "space" : "key");
      }
    }
    prev = { cnt, rig };
  }
  for (let k = 1; k < 40; k++) {
    const d = nameCount(k) - nameCount(k - 1);
    if (d > 0) for (let i = 0; i < d; i++) key((F.nameType + k) / FPS + i * 0.014, "key");
  }
  for (const c of CLICKS) tick(c / FPS, 1900, 0.12);
  // bake: four soft notes as the keyframes fill in
  [72, 76, 79, 84].forEach((m, i) => chime((F.bake + 2 + i * 3) / FPS, 440 * Math.pow(2, (m - 69) / 12), 0.5, 0.05));
  // end card
  [67, 74, 79].forEach((m, i) => chime((F.wipeIn + 2 + i * 2) / FPS, 440 * Math.pow(2, (m - 69) / 12), 1.4, 0.035));
  soundBuffer = await oc.startRendering();
}

/* ================================================================
   Player
   ================================================================ */
const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seekEl = $("seek"), volEl = $("vol"), speedEl = $("speed");
seekEl.max = String(Math.round(DUR * 1000));
const ICON = {
  play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',
  vol: '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>',
  mute: '<svg viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.4 2.4c.1-.2.1-.4.1-.6zM19 12c0 .9-.2 1.8-.5 2.6l1.5 1.5A9 9 0 0 0 14 3.2v2.1A7 7 0 0 1 19 12zM4.3 3 3 4.3 7.7 9H3v6h4l5 5v-6.7l4.3 4.3a7 7 0 0 1-2.3 1.1v2.1a9 9 0 0 0 3.7-1.8l2 2 1.3-1.3-9-9zM12 4 9.9 6.1 12 8.2z"/></svg>',
};
const ST = { t: 0, playing: false, speed: 1, loop: true, muted: false, vol: 0.8, wall0: 0, t0: 0, dirty: true };
function S_dirty() { ST.dirty = true; }
let actx = null, gainNode = null, src = null;

function ensureAudio() {
  if (actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  gainNode = actx.createGain();
  gainNode.connect(actx.destination);
  applyGain();
}
function applyGain() {
  if (!gainNode) return;
  gainNode.gain.cancelScheduledValues(0);
  gainNode.gain.value = ST.muted ? 0 : ST.vol;
}
function stopAudio() { if (src) { try { src.stop(); } catch (e) {} src.disconnect(); src = null; } }
function startAudio() {
  stopAudio();
  if (!ST.playing || !actx || !soundBuffer || ST.t >= DUR) return;
  src = actx.createBufferSource();
  src.buffer = soundBuffer;
  src.playbackRate.value = ST.speed;
  src.connect(gainNode);
  src.start(0, ST.t);
}
function anchor() { ST.t0 = ST.t; ST.wall0 = performance.now(); }
function play() {
  if (ST.t >= DUR - 1e-6) ST.t = 0;
  ensureAudio();
  if (actx && actx.state === "suspended") actx.resume();
  ST.playing = true; anchor(); startAudio(); ui();
}
function pause() { ST.playing = false; stopAudio(); ui(); }
function toggle() { ST.playing ? pause() : play(); }
function seek(nt) {
  ST.t = clamp(nt, 0, DUR);
  if (ST.playing) { anchor(); startAudio(); }
  ST.dirty = true; ui();
}
const frameOf = (t) => Math.min(N - 1, Math.floor(t * FPS + 1e-6));
function step(d) { pause(); seek(clamp(frameOf(ST.t) + d, 0, N - 1) / FPS); }
function setSpeed(v) { ST.speed = v; speedEl.value = String(v); if (ST.playing) { anchor(); startAudio(); } }
function setLoop(v) { ST.loop = v; $("bLoop").classList.toggle("on", v); }
function setMute(v) { ST.muted = v; applyGain(); ui(); }
function setVol(v) { ST.vol = clamp(v); volEl.value = ST.vol; if (ST.vol > 0 && ST.muted) ST.muted = false; applyGain(); ui(); }
function fullscreen() {
  const p = $("player");
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else if (document.webkitFullscreenElement) document.webkitExitFullscreen();
  else if (p.requestFullscreen) p.requestFullscreen().catch(() => {});
  else if (p.webkitRequestFullscreen) p.webkitRequestFullscreen();
}
const fmt = (t) => `${Math.floor(t / 60)}:${(t % 60).toFixed(2).padStart(5, "0")}`;
let dragging = false, wasPlaying = false;
function ui() {
  $("bPlay").innerHTML = ST.playing ? ICON.pause : ICON.play;
  $("bPlay").setAttribute("aria-label", ST.playing ? "Pause" : "Play");
  $("overlay").classList.toggle("hidden", ST.playing || ST.t > 0);
  $("bMute").innerHTML = ST.muted || ST.vol === 0 ? ICON.mute : ICON.vol;
  $("bMute").classList.toggle("on", ST.muted);
  $("time").innerHTML = `<b>${fmt(ST.t)}</b> / ${fmt(DUR)}`;
  $("frames").innerHTML = `Frame <b>${frameOf(ST.t) + 1}</b> / ${N}`;
  if (!dragging) seekEl.value = Math.round(ST.t * 1000);
  seekEl.style.setProperty("--p", (ST.t / DUR * 100) + "%");
  volEl.style.setProperty("--p", ((ST.muted ? 0 : ST.vol) * 100) + "%");
}

function loop(now) {
  if (ST.playing) {
    ST.t = ST.t0 + (now - ST.wall0) / 1000 * ST.speed;
    if (ST.t >= DUR) {
      if (ST.loop) { ST.t = ST.t % DUR; anchor(); startAudio(); }
      else { ST.t = DUR; pause(); }
    }
    ST.dirty = true;
  }
  if (ST.dirty) { render(Math.min(ST.t, DUR - 1e-4)); ST.dirty = false; ui(); }
  requestAnimationFrame(loop);
}

$("overlay").addEventListener("click", play);
cv.addEventListener("click", toggle);
$("bPlay").addEventListener("click", toggle);
$("bRestart").addEventListener("click", () => seek(0));
$("bPrev").addEventListener("click", () => step(-1));
$("bNext").addEventListener("click", () => step(1));
$("bLoop").addEventListener("click", () => setLoop(!ST.loop));
$("bMute").addEventListener("click", () => setMute(!ST.muted));
$("bFull").addEventListener("click", fullscreen);
speedEl.addEventListener("change", () => setSpeed(parseFloat(speedEl.value)));
volEl.addEventListener("input", () => setVol(parseFloat(volEl.value)));
seekEl.addEventListener("pointerdown", () => { dragging = true; wasPlaying = ST.playing; if (ST.playing) pause(); });
seekEl.addEventListener("input", () => seek(seekEl.value / 1000));
const endDrag = () => { if (!dragging) return; dragging = false; if (wasPlaying) play(); };
seekEl.addEventListener("pointerup", endDrag);
seekEl.addEventListener("change", endDrag);
document.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => b.blur()));

document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  let handled = true;
  if (k === " " || k === "k" || k === "K") { if (!e.repeat) toggle(); }
  else if (k === "ArrowLeft") e.shiftKey ? seek(ST.t - 1) : step(-1);
  else if (k === "ArrowRight") e.shiftKey ? seek(ST.t + 1) : step(1);
  else if (k === "," || k === "<") step(-1);
  else if (k === "." || k === ">") step(1);
  else if (k === "Home") seek(0);
  else if (k === "End") { pause(); seek(DUR); }
  else if (k === "m" || k === "M") setMute(!ST.muted);
  else if (k === "l" || k === "L") setLoop(!ST.loop);
  else if (k === "f" || k === "F") fullscreen();
  else handled = false;
  if (handled) { e.preventDefault(); e.stopPropagation(); }
}, true);
document.addEventListener("keyup", (e) => { if (e.key === " ") e.preventDefault(); }, true);

window.__demo = { render, frame: renderFrame, setScale, get state() { return ST; }, ready: true, DUR, FPS, N, BAKED };
buildSound().catch((err) => console.warn("sound", err));
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { fmCache = {}; L = null; ST.dirty = true; });
ui();
requestAnimationFrame(loop);
</script>
