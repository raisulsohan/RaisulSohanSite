<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LazyKick — Demo Animation (9:16)</title>
<style>
  html, body { margin: 0; height: 100%; background: #07070b; overflow: hidden; }
  body, svg text { font-family: Inter, "Segoe UI", "Hind Siliguri", "Nirmala UI", system-ui, -apple-system, sans-serif; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 52px; box-sizing: border-box; display: flex; gap: 14px; align-items: center;
         padding: 0 20px; background: #0d0e12; border-top: 1px solid #1e2028; color: #cfcfe0; font: 13px Inter, "Segoe UI", sans-serif; user-select: none; z-index: 99; }
  #bar button { font: inherit; font-weight: 600; color: #fff; background: linear-gradient(135deg, #0078d4, #3ca9ff); border: 0; border-radius: 6px; padding: 7px 16px; cursor: pointer; min-width: 80px; transition: opacity 0.15s; }
  #bar button:hover { opacity: 0.9; }
  #scrub { flex: 1; accent-color: #3ca9ff; cursor: pointer; }
  #time { font-variant-numeric: tabular-nums; min-width: 105px; text-align: right; color: #8e95ab; font-size: 13px; }
  #hint { color: #5a6075; font-size: 11px; margin-left: 8px; }
  body.export #bar { display: none; }
</style>
</head>
<body>
<div id="stage"><svg id="svg" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"></svg></div>
<div id="bar">
  <button id="play">Pause</button>
  <input id="scrub" type="range" min="0" max="34.0" step="0.001" value="0">
  <span id="time">0.00 / 34.00 s</span>
  <span id="hint">Space: play/pause · 9:16 vertical</span>
</div>
<script>
"use strict";

/* ==========================================================================
   CONSTANTS & MATH HELPERS
   ========================================================================== */
const V = "vertical" === "vertical";   // the tall 9:16 cut for phones
const DUR = 34.0;
const SW = V ? 1080 : 1920, SH = V ? 1920 : 1080;

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;

const E = {
  linear: (u) => u,
  out: (u) => 1 - Math.pow(1 - u, 3),
  in: (u) => u * u * u,
  inOut: (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2),
  back: (u) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); },
};

const P = (t, a, b, e = E.inOut) => e(clamp((t - a) / (b - a), 0, 1));

const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

/* ==========================================================================
   SVG ELEMENT BUILDERS
   ========================================================================== */
const T = (x, y, s, fill, size, weight = 400, anchor = "start", extra = "") =>
  `<text x="${x}" y="${y}" fill="${fill}" font-size="${size}" font-weight="${weight}" text-anchor="${anchor}" ${extra}>${esc(s)}</text>`;

function badge(kind, x, y, s) {
  const spec = kind === "Pr" ? { bg: "#2a0a3f", fg: "#e97fff" } : { bg: "#00005b", fg: "#9999ff" };
  return `<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="${s * 0.22}" fill="${spec.bg}"/>` +
    `<rect x="${x + s * 0.08}" y="${y + s * 0.08}" width="${s * 0.84}" height="${s * 0.84}" rx="${s * 0.15}" fill="none" stroke="${spec.fg}" stroke-width="${s * 0.05}"/>` +
    `<text x="${x + s / 2}" y="${y + s * 0.66}" text-anchor="middle" fill="${spec.fg}" font-size="${s * 0.44}" font-weight="700">${kind}</text>`;
}

const clipDef = (id, w, h, rx = 6) => `<clipPath id="${id}-clip"><rect width="${w}" height="${h}" rx="${rx}"/></clipPath>`;

/* Draws a native-size artwork scaled into a w×h box, clipped to rounded corners. */
function art(id, fn, p, w, h, nw, nh) {
  return `<g id="${id}" clip-path="url(#${id}-clip)"><g transform="scale(${(w / nw).toFixed(5)} ${(h / nh).toFixed(5)})">${fn(p)}</g></g>`;
}

const chip = (x, y, w, label, color = "#8fa2bb", fill = "#111a24", stroke = "#2a3546", h = 18, size = 9.5) =>
  `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h / 2}" fill="${fill}" stroke="${stroke}"/>` +
  T(x + w / 2, y + h * 0.7, label, color, size, 600, "middle");

function checkbox(id, x, y, s = 20) {
  return `<g id="${id}">
    <rect x="${x}" y="${y}" width="${s}" height="${s}" rx="5" fill="#0a0f14" stroke="#30363d"/>
    <rect id="${id}-on" x="${x}" y="${y}" width="${s}" height="${s}" rx="5" fill="url(#lk-grad)" opacity="0"/>
    <path id="${id}-tick" d="M${x + s * 0.24} ${y + s * 0.52} L${x + s * 0.43} ${y + s * 0.73} L${x + s * 0.78} ${y + s * 0.29}" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
  </g>`;
}

/* A soft bubble that points at the panel: from the left in the wide cut, from above in the tall one. */
function bubble(id, box) {
  const { x, y, w, h } = box;
  const tip = V
    ? `${x + w * 0.72 - 9},${y + h} ${x + w * 0.72},${y + h + 16} ${x + w * 0.72 + 9},${y + h}`
    : `${x + w},${y + h / 2 - 9} ${x + w + 16},${y + h / 2} ${x + w},${y + h / 2 + 9}`;
  return `<g id="${id}" opacity="0">
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="#151a24" stroke="#3ca9ff" stroke-opacity="0.55" stroke-width="1.5" filter="url(#shadow)"/>
    <polygon points="${tip}" fill="#151a24" stroke="none"/>
    <text id="${id}-text" fill="#d7e2f2" font-size="14.5" font-weight="500"></text>
  </g>`;
}

/* ==========================================================================
   LAYOUT (the wide 16:9 cut; the tall 9:16 cut when V is set)
   ========================================================================== */
const AE_W = V ? 1000 : 1800, AE_H = V ? 1800 : 980;
const AE_X = V ? 40 : 60, AE_Y = 30;

// Wide: viewer and timeline on the left, the panel docked on the right.
// Tall: viewer, timeline and panel stacked, the panel's content enlarged.
const COMP_X = V ? 20 : 24, COMP_Y = 56, COMP_W = V ? 960 : 1096, COMP_H = V ? 452 : 620;
const CAN_W = V ? 720 : 900, CAN_H = V ? 405 : 506;
const CAN_X = V ? 120 : 98, CAN_Y = V ? 40 : 60;
const CAN_S = CAN_W / 900;                        // the canvas is drawn at 900 x 506 and scaled
const TIME_X = COMP_X, TIME_Y = V ? 520 : 690, TIME_W = COMP_W, TIME_H = V ? 240 : 265;
const PANEL_X = V ? 20 : 1136, PANEL_Y = V ? 772 : 56, PANEL_W = V ? 960 : 640, PANEL_H = V ? 1012 : 900;

// Timeline columns
const NAME_W = V ? 240 : 300;                     // layer / track name column
const TICK0 = V ? 260 : 320, TICK_DX = V ? 58 : 62; // ruler: first tick and the 2 s spacing
const TR = TICK_DX / 62;                          // clip x and widths, relative to the wide cut
const tx = (x) => TICK0 + (x - 320) * TR;
const tw = (w) => w * TR;
const BAR_END = tx(1060);
const CTI = Math.round(tx(397));                  // playhead, timeline-local

// Panel: header buttons, tabs, the content box (scaled up in the tall cut) and the footer
const PB_X = V ? 718 : 398, RF_X = V ? 906 : 586;
const TAB_W = V ? 300 : 190, TAB_GAP = V ? 12 : 6, TAB_Y = 72, TAB_H = 38;
const CS = V ? 1.16 : 1;                          // content scale
const CX0 = V ? Math.round((PANEL_W - 604 * CS) / 2) : 18;
const FOOT_Y = PANEL_H - 62;

// Absolute origins
const PX = AE_X + PANEL_X, PY = AE_Y + PANEL_Y;   // panel
const OX = AE_X + COMP_X, OY = AE_Y + COMP_Y;     // comp viewer
const CX = OX + CAN_X, CY = OY + CAN_Y;           // comp canvas
const VC = { x: CX + CAN_W / 2, y: CY + CAN_H / 2 };
const RW_S = V ? 0.78 : 1;                        // the reference window's size over the viewer

const TL_X = AE_X + TIME_X, TL_Y = AE_Y + TIME_Y;

/* Panel-content coordinates (the wide cut's, 18..622 by 122..822) on the stage. */
const pc = (x, y) => [PX + CX0 + (x - 18) * CS, PY + 122 + (y - 122) * CS];
const tabC = (i) => [PX + 18 + i * (TAB_W + TAB_GAP) + TAB_W / 2, PY + TAB_Y + TAB_H / 2];
const PASTE_C = [PX + PB_X + 88, PY + 30];        // the Paste Image button

// Floating windows over the viewer, and the two tip bubbles
const FW = V ? { x: CX + 390, y: CY + 30 } : { x: CX + 470, y: CY + 60 };   // the watched folder
const PW = V ? { x: CX - 40, y: CY + 10 } : { x: CX + 30, y: CY + 60 };     // the project panel
const CALLOUT = V ? { x: PX + 540, y: PY - 108, w: 320, h: 74 } : { x: 856, y: 250, w: 320, h: 74 };
const TIP = V ? { x: PX + 465, y: PY - 126, w: 340, h: 92 } : { x: 836, y: 346, w: 340, h: 92 };
const TOAST_Y = V ? 1872 : 1012, TOAST_W = V ? 1000 : 1120;

const PROJ_AE = "FreshPicks_Promo.aep";
const PROJ_PR = "FreshPicks_Promo.prproj";
const PASTE1 = "pasted_20260923_142233.png";
const PASTE2 = "pasted_20260923_144501.png";
const PASTE_DIR = "D:\\Projects\\FreshPicks\\Pasted Images\\";

/* ==========================================================================
   PROCEDURAL ARTWORK
   ========================================================================== */
/* The client's feedback screenshot: a product photo with a scribbled note. */
function artShot(p) {
  return `
<defs>
  <linearGradient id="${p}-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6efe2"/><stop offset="1" stop-color="#e3d6c0"/></linearGradient>
  <linearGradient id="${p}-board" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8d6544"/><stop offset="1" stop-color="#5d3f28"/></linearGradient>
  <radialGradient id="${p}-apple" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#ff8574"/><stop offset="0.45" stop-color="#e3402f"/><stop offset="1" stop-color="#8d1414"/></radialGradient>
  <radialGradient id="${p}-lime" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#c6ef7a"/><stop offset="1" stop-color="#4e8f2a"/></radialGradient>
  <radialGradient id="${p}-orange" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#ffc46b"/><stop offset="1" stop-color="#d1742a"/></radialGradient>
</defs>
<rect width="400" height="250" fill="url(#${p}-bg)"/>
<ellipse cx="200" cy="232" rx="185" ry="26" fill="#000000" opacity="0.08"/>
<rect x="46" y="150" width="308" height="74" rx="12" fill="url(#${p}-board)"/>
<circle cx="132" cy="146" r="44" fill="url(#${p}-apple)"/>
<path d="M132 104 q10 -16 26 -14 q-8 16 -24 18 Z" fill="#4f9a38"/>
<circle cx="208" cy="158" r="31" fill="url(#${p}-lime)"/>
<circle cx="264" cy="150" r="37" fill="url(#${p}-orange)"/>
<rect x="30" y="24" width="150" height="16" rx="8" fill="#c9bba2"/>
<rect x="30" y="50" width="96" height="11" rx="5.5" fill="#d6cab5"/>
<g stroke="#e0342a" stroke-width="4.5" fill="none" stroke-linecap="round">
  <ellipse cx="132" cy="146" rx="62" ry="58" transform="rotate(-8 132 146)"/>
  <path d="M196 96 L262 62"/>
  <path d="M262 62 l-18 3 M262 62 l-4 17"/>
</g>
<text x="270" y="56" fill="#e0342a" font-size="21" font-weight="700" font-style="italic">bigger!</text>`;
}

/* The comp / program frame the editor is working on. */
function artFrame(p) {
  return `
<defs>
  <linearGradient id="${p}-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#123227"/><stop offset="1" stop-color="#07130f"/></linearGradient>
  <linearGradient id="${p}-strip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7bd67a"/><stop offset="1" stop-color="#2f8f5b"/></linearGradient>
</defs>
<rect width="900" height="506" fill="url(#${p}-sky)"/>
<circle cx="700" cy="150" r="190" fill="#1d5c40" opacity="0.5"/>
<circle cx="760" cy="330" r="120" fill="#1a6b46" opacity="0.35"/>
<circle cx="672" cy="232" r="86" fill="#e3402f"/>
<path d="M672 146 q18 -30 50 -26 q-14 30 -46 32 Z" fill="#4f9a38"/>
<circle cx="774" cy="296" r="54" fill="#f0a838"/>
<circle cx="596" cy="312" r="44" fill="#8cc63f"/>
<rect x="70" y="150" width="14" height="118" rx="7" fill="url(#${p}-strip)"/>
<text x="112" y="212" fill="#f4f7ef" font-size="62" font-weight="800" letter-spacing="-1">FRESH PICKS</text>
<text x="114" y="252" fill="#9fd9a8" font-size="21" font-weight="600" letter-spacing="5">SPRING CAMPAIGN 2026</text>
<rect x="112" y="300" width="196" height="46" rx="23" fill="#7bd67a"/>
<text x="210" y="330" fill="#08281c" font-size="18" font-weight="700" text-anchor="middle">Order today</text>
<rect x="0" y="466" width="900" height="40" fill="#08130e" opacity="0.8"/>
<text x="36" y="492" fill="#7f9c8c" font-size="15" font-weight="500">freshpicks.co</text>`;
}

/* ==========================================================================
   WINDOW CHROME (shared by After Effects and Premiere Pro)
   ========================================================================== */
function windowChrome(kind, title) {
  const menuItems = V
    ? (kind === "Pr"
      ? [["File", 0], ["Edit", 38], ["Clip", 78], ["Sequence", 118], ["Window", 190]]
      : [["File", 0], ["Edit", 38], ["Comp", 78], ["Layer", 128], ["Window", 178]])
    : (kind === "Pr"
      ? [["File", 0], ["Edit", 38], ["Clip", 78], ["Sequence", 118], ["Markers", 190], ["Graphics", 254], ["Window", 322], ["Help", 384]]
      : [["File", 0], ["Edit", 38], ["Composition", 78], ["Layer", 172], ["Animation", 220], ["View", 296], ["Window", 342], ["Help", 404]]);
  if (V) title = title.split(" — ")[0];
  return `
    <rect width="${AE_W}" height="${AE_H}" rx="14" fill="#131418" filter="url(#ae-shadow)"/>
    <rect width="${AE_W}" height="${AE_H}" rx="14" fill="none" stroke="#252732" stroke-width="1.5"/>
    <rect width="${AE_W}" height="42" rx="14" fill="#1b1c23"/>
    <rect y="28" width="${AE_W}" height="14" fill="#1b1c23"/>
    ${badge(kind, 14, 9, 24)}
    <g transform="translate(48 15)">${menuItems.map(([s, x]) => T(x, 11, s, "#8c92a4", 12, 500)).join("")}</g>
    ${T(AE_W / 2, 26, title, "#b0b6c8", 12, 500, "middle")}
    <circle cx="${AE_W - 54}" cy="21" r="5" fill="#f5a623" opacity="0.8"/>
    <circle cx="${AE_W - 36}" cy="21" r="5" fill="#27c93f" opacity="0.8"/>
    <circle cx="${AE_W - 18}" cy="21" r="5" fill="#ff5f56" opacity="0.8"/>
    <rect x="${PANEL_X}" y="${PANEL_Y}" width="${PANEL_W}" height="${PANEL_H}" rx="10" fill="#131418"/>
  `;
}

/* ==========================================================================
   AFTER EFFECTS WORKSPACE
   ========================================================================== */
function tlRow(id, name, color, barFrom, guide) {
  return `
    <g id="tl-row-${id}" transform="translate(0 0)" opacity="1">
      <rect y="0" width="${NAME_W}" height="34" fill="#1a1b24"/>
      <line x1="0" y1="34" x2="${TIME_W}" y2="34" stroke="#22232e"/>
      <text id="tl-num-${id}" x="16" y="22" fill="#6f7587" font-size="10">1</text>
      <rect x="34" y="8" width="18" height="18" rx="3" fill="${color}"/>
      ${T(60, 22, name, "#e0e3ed", 11.5, 500)}
      ${guide ? chip(NAME_W - 62, 9, 52, "GUIDE", "#8ec7ff", "#12243a", "#2c517c", 16, 8.5) : ""}
      <rect x="${barFrom}" y="8" width="${BAR_END - barFrom}" height="18" rx="3" fill="${color}" opacity="${guide ? 0.55 : 0.8}"
            ${guide ? 'stroke="#8ec7ff" stroke-width="1" stroke-dasharray="4 3"' : ""}/>
    </g>`;
}

function aeWindow() {
  return `
  <g id="ae-host" transform="translate(${AE_X} ${AE_Y})">
    ${windowChrome("Ae", PROJ_AE + " — Adobe After Effects 2026")}

    <!-- ================= COMPOSITION VIEWER ================= -->
    <g transform="translate(${COMP_X} ${COMP_Y})">
      <rect width="${COMP_W}" height="${COMP_H}" rx="8" fill="#181920"/>
      <rect width="${COMP_W}" height="${COMP_H}" rx="8" fill="none" stroke="#262834" stroke-width="1"/>
      <rect width="${COMP_W}" height="32" rx="8" fill="#1f2029"/>
      <rect y="20" width="${COMP_W}" height="12" fill="#1f2029"/>
      ${T(16, 21, "Main Comp", "#e0e3ed", 12, 600)}
      ${T(96, 21, "1920 × 1080 (1.00) · 30.00 fps · Full", "#6f7587", 11, 400)}
      ${T(COMP_W - 16, 21, "100%", "#8f95a8", 11, 500, "end")}

      <g transform="translate(${CAN_X} ${CAN_Y})">
        <g clip-path="url(#canvas-clip)">
          <g transform="scale(${CAN_S.toFixed(5)})">
            <rect width="900" height="506" fill="#0d0e13"/>
            ${art("cv-frame", artFrame, "cvf", 900, 506, 900, 506)}
          </g>
        </g>
        <rect width="${CAN_W}" height="${CAN_H}" rx="4" fill="none" stroke="#2b2d3d" stroke-width="1.5"/>
        <!-- the pasted screenshot, dropped in as a guide layer -->
        <g transform="scale(${CAN_S.toFixed(5)})">
          <g id="cv-guide" opacity="0" transform="translate(238 133)">
            ${art("cv-shot", artShot, "cvs", 424, 265, 400, 250)}
            <rect width="424" height="265" fill="none" stroke="#8ec7ff" stroke-width="2" stroke-dasharray="7 5"/>
            ${chip(0, -26, 128, "GUIDE LAYER", "#8ec7ff", "#0f2233", "#2c517c", 20, 9.5)}
          </g>
        </g>
      </g>
    </g>

    <!-- ================= TIMELINE PANEL ================= -->
    <g transform="translate(${TIME_X} ${TIME_Y})">
      <rect width="${TIME_W}" height="${TIME_H}" rx="8" fill="#16171f"/>
      <rect width="${TIME_W}" height="${TIME_H}" rx="8" fill="none" stroke="#262834" stroke-width="1"/>
      <rect width="${TIME_W}" height="32" rx="8" fill="#1c1d27"/>
      <rect y="20" width="${TIME_W}" height="12" fill="#1c1d27"/>
      ${T(16, 21, "0:00:02:14", "#3ca9ff", 13, 700)}
      ${T(120, 21, "Main Comp", "#8e95a8", 12, 600)}
      <line x1="${NAME_W}" y1="0" x2="${NAME_W}" y2="${TIME_H}" stroke="#252735"/>
      ${Array.from({ length: 12 }, (_, i) => `
        <line x1="${TICK0 + i * TICK_DX}" y1="20" x2="${TICK0 + i * TICK_DX}" y2="30" stroke="#4a4f66" stroke-width="1"/>
        ${T(TICK0 + i * TICK_DX, 16, `${i * 2}s`, "#6f7587", 9, 500, "middle")}
      `).join("")}

      <g transform="translate(0 36)">
        ${tlRow("bg", "Background", "#9a93b5", TICK0, false)}
        ${tlRow("title", "Title Text", "#4fb3ff", TICK0, false)}
        ${tlRow("logo", "Logo.ai", "#e8b04c", TICK0, false)}
        ${tlRow("p1", PASTE1, "#3ca9ff", CTI, true)}
        ${tlRow("p2", PASTE1, "#3ca9ff", CTI, true)}
      </g>

      <g transform="translate(${CTI} 0)">
        <line x1="0" y1="0" x2="0" y2="${TIME_H}" stroke="#3ca9ff" stroke-width="1.8"/>
        <polygon points="-7,0 7,0 7,12 0,19 -7,12" fill="#3ca9ff"/>
      </g>
    </g>
  </g>`;
}

/* ==========================================================================
   PREMIERE PRO WORKSPACE
   ========================================================================== */
function prClip(x, w, label, color, y = 0) {
  return `
    <g transform="translate(${x} ${y})">
      <rect width="${w}" height="34" rx="3" fill="${color}" opacity="0.85"/>
      <rect y="0" width="${w}" height="9" rx="3" fill="${color}"/>
      ${T(8, 23, label, "#0d1b12", 10.5, 600)}
    </g>`;
}

function prWindow() {
  const trackNames = [["V2", 44], ["V1", 82], ["A1", 120]];
  return `
  <g id="pr-host" transform="translate(${AE_X} ${AE_Y})" opacity="0">
    ${windowChrome("Pr", PROJ_PR + " — Adobe Premiere Pro 2026")}

    <!-- ================= PROGRAM MONITOR ================= -->
    <g transform="translate(${COMP_X} ${COMP_Y})">
      <rect width="${COMP_W}" height="${COMP_H}" rx="8" fill="#181920"/>
      <rect width="${COMP_W}" height="${COMP_H}" rx="8" fill="none" stroke="#262834" stroke-width="1"/>
      <rect width="${COMP_W}" height="32" rx="8" fill="#1f2029"/>
      <rect y="20" width="${COMP_W}" height="12" fill="#1f2029"/>
      ${T(16, 21, "Program: FreshPicks_Cut_v4", "#e0e3ed", 12, 600)}
      ${T(COMP_W - 16, 21, "Fit · Full", "#8f95a8", 11, 500, "end")}

      <g transform="translate(${CAN_X} ${CAN_Y})">
        <g clip-path="url(#monitor-clip)">
          <g transform="scale(${CAN_S.toFixed(5)})">
            <rect width="900" height="506" fill="#0d0e13"/>
            ${art("pm-frame", artFrame, "pmf", 900, 506, 900, 506)}
            <g id="pm-shot" opacity="0" transform="translate(238 133)">
              ${art("pm-still", artShot, "pms", 424, 265, 400, 250)}
            </g>
          </g>
        </g>
        <rect width="${CAN_W}" height="${CAN_H}" rx="4" fill="none" stroke="#2b2d3d" stroke-width="1.5"/>
      </g>
    </g>

    <!-- ================= SEQUENCE ================= -->
    <g transform="translate(${TIME_X} ${TIME_Y})">
      <rect width="${TIME_W}" height="${TIME_H}" rx="8" fill="#16171f"/>
      <rect width="${TIME_W}" height="${TIME_H}" rx="8" fill="none" stroke="#262834" stroke-width="1"/>
      <rect width="${TIME_W}" height="32" rx="8" fill="#1c1d27"/>
      <rect y="20" width="${TIME_W}" height="12" fill="#1c1d27"/>
      ${T(16, 21, "0:00:02:14", "#e97fff", 13, 700)}
      ${T(120, 21, "FreshPicks_Cut_v4", "#8e95a8", 12, 600)}

   ========================================================================== */
const $ = (id) => document.getElementById(id);
const set = (el, attr, val) => { const v = String(val); if (el.getAttribute(attr) !== v) el.setAttribute(attr, v); };
// Fully transparent groups still rasterise in Chrome, so hide them outright.
const op = (id, v) => {
  const el = $(id), c = clamp(+v, 0, 1);
  set(el, "opacity", c.toFixed(4));
  set(el, "display", c <= 0 ? "none" : "inline");
};
const txt = (id, s) => { const el = $(id); if (el.textContent !== s) el.textContent = s; };

const measureEl = $("measure");
const mcache = new Map();
function measure(str, size, weight) {
  const k = size + "|" + weight + "|" + str;
  if (mcache.has(k)) return mcache.get(k);
  set(measureEl, "font-size", size);
  set(measureEl, "font-weight", weight);
  measureEl.textContent = str;
  let w = 0;
  try { w = measureEl.getComputedTextLength(); } catch (e) { w = str.length * size * 0.55; }
  mcache.set(k, w);
  return w;
}
function wrap(str, size, weight, maxW) {
  const words = str.split(" ");
  const lines = [];
  let cur = "";
  for (const w of words) {
    const test = cur ? cur + " " + w : w;
    if (!cur || measure(test, size, weight) <= maxW) cur = test;
    else { lines.push(cur); cur = w; }
  }
  lines.push(cur);
  return lines;
}
function setLines(id, lines, x, y0, lh) {
  const el = $(id);
  const key = x + "|" + y0 + "|" + lines.join("\n");
  if (el.dataset.key === key) return;
  el.dataset.key = key;
  el.innerHTML = lines.map((l, i) => `<tspan x="${x}" y="${y0 + i * lh}">${esc(l)}</tspan>`).join("");
}
const seg = (typeof Intl !== "undefined" && Intl.Segmenter) ? new Intl.Segmenter(undefined, { granularity: "grapheme" }) : null;
const gcache = new Map();
function graphemes(s) {
  if (!gcache.has(s)) gcache.set(s, seg ? Array.from(seg.segment(s), (x) => x.segment) : Array.from(s));
  return gcache.get(s);
}
function typed(full, u) {
  const g = graphemes(full);
  return g.slice(0, Math.floor(clamp(u, 0, 1) * g.length)).join("");
}

function render(t) {
  /* ---------- app windows: intro pop, AE → Premiere crossfade, outro ---------- */
  const introIn = P(t, 0.0, 0.45, E.out);
  const s = lerp(0.95, 1.0, introIn);

  set($("ae-host"), "transform", hostTf);
  set($("pr-host"), "transform", hostTf);

  const prX = P(t, 26.3, 26.9);
  const outroVis = P(t, 31.2, 31.9, E.out);
  const isPr = t >= 26.6;
  op("ae-host", (1 - prX) * (1 - outroVis));
  op("pr-host", prX * (1 - outroVis));
  op("panel", (1 - outroVis) * P(t, 0.15, 0.7, E.out));
  op("overlay", 1 - outroVis);
  txt("p-hosttag", isPr ? "PREMIERE PRO" : "AFTER EFFECTS");
  txt("p-project", isPr ? PROJ_PR : PROJ_AE);
  const slide = lerp(80, 0, P(t, 0.15, 0.75, E.out));
  set($("panel"), "transform", V ? `translate(${PX} ${(PY + slide).toFixed(1)})` : `translate(${(PX + slide).toFixed(1)} ${PY})`);

  /* ---------- panel tabs ---------- */
  const [tabSince, tabIdx] = tabAt(t);
  const tabIn = P(t, tabSince, tabSince + 0.22, E.out);
  for (let i = 0; i < 3; i++) {
    const on = i === tabIdx;
    set($(`p-tab-${i}-rect`), "fill", on ? "#131b25" : "#0d1117");
    set($(`p-tab-${i}-text`), "fill", on ? "#e6edf3" : "#8b949e");
    op(`p-tab-${i}-line`, on ? tabIn : 0);
  }
  op("tab-notes", tabIdx === 0 ? tabIn : 0);
  op("tab-bins", tabIdx === 1 ? tabIn : 0);
  op("tab-tools", tabIdx === 2 ? tabIn : 0);

  /* ---------- the reference screenshot and the snip ---------- */
  const refIn = P(t, 1.2, 1.7, E.back);
  const refOut = P(t, 3.2, 3.6, E.in);
  const refVis = refIn * (1 - refOut);
  op("refwin", refVis);
  set($("refwin"), "transform", `translate(${VC.x} ${VC.y}) scale(${(RW_S * lerp(0.9, 1, refIn) * lerp(1, 0.86, refOut)).toFixed(3)})`);

  set($("ref-marquee-rect"), "y", 70);
  set($("ref-marquee-rect"), "width", mqW.toFixed(1));
  set($("ref-marquee-rect"), "height", mqH.toFixed(1));
  op("ref-flash", t >= 2.62 && t < 2.85 ? 1 - P(t, 2.62, 2.85, E.out) : 0);

  /* the snipped picture flies to the Paste button */

  const flyVis = P(t, 2.75, 2.9) * (1 - P(t, 3.45, 3.6));
  op("fly", flyVis);
  set($("fly"), "transform",

  txt("tl-num-logo", String(appeared.length + 1));
  txt("tl-num-title", String(appeared.length + 2));
  txt("tl-num-bg", String(appeared.length + 3));

  /* ---------- Premiere: the still overwrites the first free track ---------- */
  const stillPop = P(t, 28.2, 28.7, E.back);
  op("pr-still", t >= 28.2 ? clamp(stillPop, 0, 1) : 0);
  set($("pr-still"), "transform", `translate(0 ${lerp(20, 44, clamp(stillPop, 0, 1)).toFixed(1)})`);
  op("pm-shot", P(t, 28.2, 28.8));
  op("pr-hold", P(t, 28.9, 29.3) * (1 - P(t, 30.6, 30.9)));

  /* ---------- footer status ---------- */
  let statusMsg = "Ready", statusKind = "idle";
  for (const [a, b, msg, kind] of STATUS) {
    if (t >= a && t < b) { statusMsg = msg; statusKind = kind; break; }
  }
  txt("p-status", statusMsg);
  set($("p-status"), "fill", statusKind === "idle" ? "#8b949e" : statusKind === "ok" ? "#9fd5ab" : "#cfd8e3");
  set($("p-statusdot"), "fill", statusKind === "idle" ? "#3b4353" : statusKind === "ok" ? "#43c46f" : "#3ca9ff");

  /* ---------- toasts ---------- */
  let toastOp = 0, toastMsg = "";
  for (const [a, b, msg] of TOASTS) {
    if (t >= a && t < b) { toastOp = P(t, a, a + 0.3) * (1 - P(t, b - 0.3, b)); toastMsg = msg; break; }
  }
  op("toast", toastOp);
  if (toastOp > 0) txt("toast-text", toastMsg);

  /* ---------- cursor ---------- */
  let cx = CUR_KEYS[0][1], cy = CUR_KEYS[0][2];
  for (let i = 0; i < CUR_KEYS.length - 1; i++) {
    const a = CUR_KEYS[i], b = CUR_KEYS[i + 1];
    if (t >= a[0] && t < b[0]) { const u = P(t, a[0], b[0], E.inOut); cx = lerp(a[1], b[1], u); cy = lerp(a[2], b[2], u); break; }
    if (t >= b[0]) { cx = b[1]; cy = b[2]; }
  }
  const pressing = CLICKS.some((c) => t >= c && t < c + 0.22);
  set($("cursor"), "transform", `translate(${cx.toFixed(1)} ${cy.toFixed(1)}) scale(${pressing ? 0.86 : 1})`);
  op("cursor", P(t, 0.8, 1.1) * (1 - P(t, 30.4, 30.8)));

  /* ---------- outro ---------- */
  op("outro-view", outroVis);
  if (t >= 31.2) {
    set($("outro-badge"), "transform", `scale(${lerp(0.88, 1.0, outroVis).toFixed(3)})`);
    const shineProg = P(t, 32.1, 33.4, E.inOut);
    set($("outro-shine"), "transform", `translate(${lerp(-400, 400, shineProg).toFixed(1)} 0)`);
    op("outro-shine", Math.sin(Math.PI * shineProg));
  } else op("outro-shine", 0);
}

/* ==========================================================================
   INTERACTIVE PLAYER & RESIZE HANDLERS
   ========================================================================== */
const stage = $("stage"), scrub = $("scrub"), playBtn = $("play"), timeLabel = $("time");
const query = new URLSearchParams(location.search);
if (query.has("export")) document.body.classList.add("export");

function fit() {
  const barHeight = document.body.classList.contains("export") ? 0 : 52;
  const sc = Math.min(innerWidth / SW, (innerHeight - barHeight) / SH);
  stage.style.transform = `translate(${(innerWidth - SW * sc) / 2}px, ${(innerHeight - barHeight - SH * sc) / 2}px) scale(${sc})`;
}
window.addEventListener("resize", fit);
fit();

let playing = !query.has("t");
let tNow = query.has("t") ? +query.get("t") : 0;
let origin = performance.now() - tNow * 1000;

function show(t) {
  tNow = t;
  render(t);
  scrub.value = t;
  timeLabel.textContent = `${t.toFixed(2)} / ${DUR.toFixed(2)} s`;
}

function setPlaying(on) {
  playing = on;
  playBtn.textContent = on ? "Pause" : "Play";
  if (on) origin = performance.now() - tNow * 1000;
}

playBtn.onclick = () => setPlaying(!playing);
scrub.oninput = () => { setPlaying(false); show(+scrub.value); };

window.addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); setPlaying(!playing); }
  if (e.code === "ArrowRight" || e.code === "ArrowLeft") {
    e.preventDefault();
    setPlaying(false);
    show(clamp(tNow + (e.code === "ArrowRight" ? 1 : -1) / 60, 0, DUR));
  }
});

function tick(now) {
  if (playing) show(((now - origin) / 1000) % DUR);
  requestAnimationFrame(tick);
}

show(tNow);
setPlaying(playing);
requestAnimationFrame(tick);

// Headless export hook: page.evaluate(t => window.renderAt(t))
window.renderAt = (t) => { setPlaying(false); show(t); };
</script>
</body>
</html>
