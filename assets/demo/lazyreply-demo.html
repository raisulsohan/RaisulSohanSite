<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LazyReply Demo</title>
<style>
  :root{--bg:#0d0c26;--bar:#15143a;--fg:#f2f2ff;--dim:#a9acd8;--accent:#8c96ff;--line:#2e2d66}
  html,body{margin:0;background:var(--bg);color:var(--fg);min-height:100vh;font:500 14px "Segoe UI",system-ui,sans-serif}
  body{display:grid;align-items:center}
  .player{position:relative;width:100%;display:flex;flex-direction:column;background:var(--bg);user-select:none}
  .player:fullscreen{width:100vw;height:100vh;justify-content:center}
  .stage{position:relative;width:100%;margin:0 auto;aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden;cursor:pointer;
    background:radial-gradient(70% 90% at 50% 45%,#232270 0%,#141340 55%,#0d0c26 100%)}
  .player:fullscreen .stage{flex:1;width:100%;aspect-ratio:auto;min-height:0}
  .stage svg{display:block;height:91.6%;width:auto;max-width:96%}
  .snd{position:absolute;right:14px;top:14px;all:unset;position:absolute;right:14px;top:14px;display:flex;align-items:center;gap:8px;
    padding:8px 14px 8px 12px;border-radius:999px;background:rgba(255,255,255,.94);color:#2f33a8;font:700 14px "Segoe UI",system-ui,sans-serif;
    box-shadow:0 6px 22px rgba(0,0,0,.35);cursor:pointer}
  .snd[hidden]{display:none}
  .snd svg{width:18px;height:18px;fill:currentColor}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:8px 12px;background:var(--bar);min-height:40px;box-sizing:border-box}
  .bar button{all:unset;display:grid;place-items:center;width:32px;height:32px;border-radius:6px;cursor:pointer;color:var(--fg);flex:none}
  .bar button:hover{background:rgba(255,255,255,.1)}
  .bar button:focus-visible{outline:2px solid var(--accent)}
  .bar button.on{color:var(--accent)}
  .bar svg{width:18px;height:18px;fill:currentColor}
  .bar input[type=range]{accent-color:var(--accent);cursor:pointer;margin:0}
  #seek{flex:1 1 120px;min-width:80px}
  #vol{width:70px;flex:none}
  #time{font-variant-numeric:tabular-nums;color:var(--dim);white-space:nowrap;min-width:92px;text-align:center}
  #fnum{font-variant-numeric:tabular-nums;color:var(--dim);white-space:nowrap;min-width:96px;text-align:center;padding:3px 6px;border:1px solid var(--line);border-radius:6px;box-sizing:border-box}
  .bar select{background:#201f52;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px;cursor:pointer;flex:none}
  /* Narrower: the seek bar takes its own row and the controls wrap under it. Nothing is ever hidden. */
  @media (max-width:760px){#seek{order:-1;flex:1 1 100%}.bar{justify-content:center}}
  @media (max-width:400px){.bar{padding:6px 6px}#time,#fnum{min-width:0}}
</style>
</head>

</g></svg>
    <button class="snd" id="snd" hidden title="Turn the sound on"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zM16.5 12A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>Sound on</button>
  </div>
  <div class="bar" id="bar">
    <button id="play" title="Play / Pause (Space, K)"><svg viewBox="0 0 24 24"><path id="playIcon" d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>
    <button id="restart" title="Restart (Home)"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button id="bstep" title="Previous frame (← or ,)"><svg viewBox="0 0 24 24"><path d="M15 5v14L6 12zM17 5h2v14h-2z"/></svg></button>
    <button id="fstep" title="Next frame (→ or .)"><svg viewBox="0 0 24 24"><path d="M9 5v14l9-7zM5 5h2v14H5z"/></svg></button>
    <input id="seek" type="range" min="0" max="479" step="1" value="0" title="Seek (Shift+← / Shift+→ = 1 s)">
    <span id="time">0:00.0 / 0:16.0</span>
    <span id="fnum" title="Frame (current / total)">F 1 / 480</span>
    <select id="speed" title="Playback speed"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
    <button id="loop" class="on" title="Loop (L)"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zM17 17H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
    <button id="mute" title="Mute (M)"><svg viewBox="0 0 24 24"><path id="muteIcon" d="M3 9v6h4l5 5V4L7 9zM16.5 12A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button>
    <input id="vol" type="range" min="0" max="1" step=".01" value=".8" title="Volume">
    <button id="fs" title="Fullscreen (F)"><svg viewBox="0 0 24 24"><path d="M5 5h5v2H7v3H5zM14 5h5v5h-2V7h-3zM5 14h2v3h3v2H5zM17 14h2v5h-5v-2h3z"/></svg></button>
  </div>
</div>
<script>
// LazyReply, 16-second demo. The picture is the README animation (docs/demo.svg in the LazyReply
// repository), a SMIL timeline this player holds paused and moves by hand, so seek, step and speed
// are exact. The sound is made here in code, once, from the same timeline.
const FPS = 30, DUR = 16, FRAMES = DUR * FPS;

const $ = id => document.getElementById(id);
const svg = $('stage').querySelector('svg'), seek = $('seek'), vol = $('vol');
const PLAY = 'M7 4l13 8-13 8z', PAUSE = 'M6 4h4v16H6zM14 4h4v16h-4z';
const SOUND = 'M3 9v6h4l5 5V4L7 9zM16.5 12A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z';
const MUTED = 'M3 9v6h4l5 5V4L7 9zM16 9.4l1.4-1.4 2.6 2.6 2.6-2.6L24 9.4 21.4 12l2.6 2.6-1.4 1.4-2.6-2.6-2.6 2.6-1.4-1.4 2.6-2.6z';
const LAST = (FRAMES - 1) / FPS;

const ST = { t: 0, playing: true, speed: 1, loop: true, vol: +vol.value, muted: false };
let wall0 = 0, t0 = 0;              // the clock: the time ST.t had at performance.now() == wall0
let scrubbing = false, resumeAfterScrub = false;

svg.pauseAnimations();

const frameAt = t => Math.max(0, Math.min(FRAMES - 1, Math.floor(t * FPS + 1e-4)));
const clock = t => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, '0')}`;
const now = () => performance.now() / 1000;

// ---------- sound ----------
// Physical sounds only: key switches for the typing and the shortcuts, air for the box moving,
// soft low thumps where the three versions and the sent message land.
const EV = {
  typing: [0.09938, 0.10313, 0.10813, 0.11563, 0.12, 0.125, 0.13188, 0.13688, 0.14188, 0.145, 0.15188, 0.1575, 0.16125,
    0.16813, 0.1725, 0.17813, 0.18625, 0.19125, 0.19563, 0.20063, 0.22, 0.225, 0.23, 0.23563, 0.24375, 0.24813, 0.25438, 0.26, 0.265],
  chords: [[0.03125, 0], [0.43978, 0], [0.53978, 0], [0.65228, 1]],    // Ctrl+Space, Ctrl+Down twice, Ctrl+Enter (heavier)
  whooshes: [[0.04, 0.38, 1, 0.9], [0.4423, 0.2, 1, 0.45], [0.5423, 0.2, 1, 0.45], [0.6548, 0.3, -1, 0.75],
    [0.6685, 0.34, 1, 0.9], [0.8215, 0.42, -1, 0.4]],                    // [start, length s, up/down, level]
  thumps: [[0.0625, 0.5, 70], [0.3585, 0.55, 82], [0.3673, 0.5, 76], [0.376, 0.6, 68], [0.6929, 1, 58]],
  riser: [0.2804, 0.355]
};

function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }

async function makeTrack() {
  const SR = 44100, oc = new OfflineAudioContext(2, SR * DUR, SR), rnd = rng(7);
  const noise = oc.createBuffer(1, SR, SR), nd = noise.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = rnd() * 2 - 1;
  const out = oc.createDynamicsCompressor();
  out.threshold.value = -14; out.ratio.value = 3; out.attack.value = 0.003; out.release.value = 0.12;
  out.connect(oc.destination);

  function pan(v) { const p = oc.createStereoPanner(); p.pan.value = v; p.connect(out); return p; }
  function burst(t, dur, f, q, level, dest, type = 'bandpass') {
    const s = oc.createBufferSource(); s.buffer = noise; s.playbackRate.value = 0.8 + rnd() * 0.4;
    const bp = oc.createBiquadFilter(); bp.type = type; bp.frequency.value = f; bp.Q.value = q;
    const g = oc.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(level, t + 0.0015); g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
    s.connect(bp).connect(g).connect(dest); s.start(t, rnd() * 0.5); s.stop(t + dur + 0.02);
  }
  function tone(t, f0, f1, dur, level, dest) {
    const o = oc.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = oc.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(level, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
    o.connect(g).connect(dest); o.start(t); o.stop(t + dur + 0.02);
  }
  // A key switch: the click of the stem, the body of the keycap, the bottom-out.
  function key(t, heavy) {
    const p = pan((rnd() - 0.5) * 0.3), k = heavy ? 1.25 : 1;
    burst(t, 0.018, 3200 + rnd() * 900, 1.4, 0.32 * k, p);
    burst(t + 0.004, 0.05, 900 + rnd() * 250, 1.1, 0.22 * k, p);
    tone(t + 0.002, 210 * (heavy ? 0.8 : 1) + rnd() * 30, 120, 0.06, 0.2 * k, p);
  }
  function whoosh(t, len, dir, level) {
    const s = oc.createBufferSource(); s.buffer = noise; s.loop = true;
    const bp = oc.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.9;
    const [a, b] = dir > 0 ? [380, 2600] : [2200, 420];
    bp.frequency.setValueAtTime(a, t); bp.frequency.exponentialRampToValueAtTime(b, t + len);
    const g = oc.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.16 * level, t + len * 0.45); g.gain.exponentialRampToValueAtTime(0.0005, t + len);
    const p = oc.createStereoPanner();
    p.pan.setValueAtTime(-0.25 * dir, t); p.pan.linearRampToValueAtTime(0.25 * dir, t + len);
    s.connect(bp).connect(g).connect(p).connect(out); s.start(t); s.stop(t + len + 0.05);
  }
  function thump(t, level, f) {
    const p = pan(0);
    tone(t, f * 1.6, f, 0.22, 0.42 * level, p);
    burst(t, 0.09, 260, 0.7, 0.16 * level, p, 'lowpass');
  }

  for (const k of EV.typing) key(k * DUR, false);
  for (const [k, heavy] of EV.chords) { key(k * DUR - 0.06, false); key(k * DUR, heavy); }
  for (const [k, len, dir, lv] of EV.whooshes) whoosh(k * DUR, len, dir, lv);
  for (const [k, lv, f] of EV.thumps) thump(k * DUR, lv, f);
  { // the box thinks: a low air that rises into the three versions
    const t = EV.riser[0] * DUR, len = (EV.riser[1] - EV.riser[0]) * DUR;
    const s = oc.createBufferSource(); s.buffer = noise; s.loop = true;
    const lp = oc.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 2.5;
    lp.frequency.setValueAtTime(260, t); lp.frequency.exponentialRampToValueAtTime(1700, t + len);
    const g = oc.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.09, t + len * 0.85); g.gain.linearRampToValueAtTime(0, t + len);
    s.connect(lp).connect(g).connect(out); s.start(t); s.stop(t + len + 0.05);
  }

  const buf = await oc.startRendering();
  let peak = 0;
  for (let c = 0; c < buf.numberOfChannels; c++) for (const v of buf.getChannelData(c)) peak = Math.max(peak, Math.abs(v));
  if (peak > 0) for (let c = 0; c < buf.numberOfChannels; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= 0.8 / peak; }
  return buf;
}

const AC = window.AudioContext || window.webkitAudioContext;
const ac = AC ? new AC() : null;
const master = ac ? ac.createGain() : null;
if (master) master.connect(ac.destination);
let track = null, src = null;

function applyGain() { if (master) master.gain.setTargetAtTime(ST.muted ? 0 : ST.vol * ST.vol, ac.currentTime, 0.015); }
function stopAudio() { if (src) { try { src.stop(); } catch (e) {} src.disconnect(); src = null; } }
function startAudio() {
  stopAudio();
  if (!ac || !track || !ST.playing || ac.state !== 'running' || ST.t >= LAST) return;
  src = ac.createBufferSource();
  src.buffer = track; src.playbackRate.value = ST.speed;
  src.connect(master); src.start(0, ST.t);
}
function wantSound() { $('snd').hidden = !ac || ac.state === 'running'; }
function unlock() {
  if (!ac || ac.state === 'running') return;
  ac.resume().then(() => { wantSound(); startAudio(); }).catch(() => {});
}
if (ac) {
  ac.onstatechange = wantSound;
  makeTrack().then(b => { track = b; startAudio(); }).catch(() => {});
  setTimeout(wantSound, 300);
}

// ---------- the player ----------
function anchor() { wall0 = now(); t0 = ST.t; }
function setT(t) { ST.t = Math.max(0, Math.min(LAST, t)); svg.setCurrentTime(ST.t); }
function showFrame(n) { setT(Math.max(0, Math.min(FRAMES - 1, n)) / FPS + 0.5 / FPS * 0); anchor(); if (ST.playing) startAudio(); render(); }
function play() { if (ST.t >= LAST && !ST.loop) setT(0); ST.playing = true; anchor(); startAudio(); render(); }
function pause() { ST.playing = false; stopAudio(); render(); }
function toggle() { ST.playing ? pause() : play(); }
function step(d) { pause(); showFrame(frameAt(ST.t) + d); }
function jump(s) { showFrame(frameAt(ST.t) + Math.round(s * FPS)); }
function setSpeed(v) { ST.speed = v; $('speed').value = String(v); anchor(); if (ST.playing) startAudio(); }
function setLoop(on) { ST.loop = on; $('loop').classList.toggle('on', on); }

// Volume and mute follow you across reloads, sessions and projects: one vp_prefs cookie serves
// every localhost port (localStorage is per port, so it is only the file:// fallback).
const vpPrefs = {
  get() {
    let p = null;
    try { const m = document.cookie.match(/(?:^|;\s*)vp_prefs=([^;]*)/); if (m) p = JSON.parse(decodeURIComponent(m[1])); } catch (e) {}
    if (!p) try { p = JSON.parse(localStorage.getItem('vp_prefs')); } catch (e) {}
    if (!p || typeof p !== 'object') return null;
    const v = +p.volume;
    return { volume: isFinite(v) ? Math.min(1, Math.max(0, v)) : 1, muted: p.muted === true };
  },
  set(p) {
    const s = JSON.stringify({ volume: 1, muted: false, ...vpPrefs.get(), ...p });
    try { document.cookie = 'vp_prefs=' + encodeURIComponent(s) + '; path=/; max-age=34560000; SameSite=Lax'; } catch (e) {}
    try { localStorage.setItem('vp_prefs', s); } catch (e) {}
  }
};
function setMuted(m) { ST.muted = m; vpPrefs.set({ volume: ST.vol, muted: m }); applyGain(); render(); }
function setVol(v) { ST.vol = Math.min(1, Math.max(0, v)); vol.value = ST.vol; if (ST.vol > 0 && ST.muted) ST.muted = false; vpPrefs.set({ volume: ST.vol, muted: ST.muted }); applyGain(); render(); }
function fullscreen() { document.fullscreenElement ? document.exitFullscreen().catch(() => {}) : $('player').requestFullscreen().catch(() => {}); }

function render() {
  const f = frameAt(ST.t);
  if (!scrubbing) seek.value = f;
  $('time').textContent = `${clock(f / FPS)} / ${clock(DUR)}`;
  $('fnum').textContent = `F ${f + 1} / ${FRAMES}`;
  $('playIcon').setAttribute('d', ST.playing ? PAUSE : PLAY);
  $('muteIcon').setAttribute('d', ST.muted || ST.vol === 0 ? MUTED : SOUND);
  $('mute').classList.toggle('on', ST.muted);
}

(function tick() {
  if (ST.playing && !scrubbing) {
    let t = t0 + (now() - wall0) * ST.speed;
    if (t >= DUR) {
      if (ST.loop) { setT(t % DUR); anchor(); startAudio(); }
      else { setT(LAST); pause(); }
    } else setT(t);
    render();
  }
  requestAnimationFrame(tick);
})();

// The bar always spans the window, so no control is ever cut off; the stage takes the height the bar leaves.
function fit() {
  const st = $('stage');
  if (document.fullscreenElement) { st.style.width = ''; return; }
  st.style.width = Math.floor(Math.min(innerWidth, Math.max(160, innerHeight - $('bar').offsetHeight) * 16 / 9)) + 'px';
}
addEventListener('resize', fit);
document.addEventListener('fullscreenchange', fit);

$('play').onclick = toggle;
$('stage').addEventListener('click', e => { if (!e.target.closest('#snd')) toggle(); });
$('snd').onclick = unlock;
$('restart').onclick = () => showFrame(0);
$('bstep').onclick = () => step(-1);
$('fstep').onclick = () => step(1);
$('loop').onclick = () => setLoop(!ST.loop);
$('mute').onclick = () => setMuted(!ST.muted);
$('fs').onclick = fullscreen;
$('speed').onchange = e => setSpeed(+e.target.value);
vol.addEventListener('input', () => setVol(+vol.value));
{ const s = vpPrefs.get(); if (s) { ST.vol = s.volume; ST.muted = s.muted; vol.value = s.volume; vpPrefs.set(s); } }
applyGain();
// another video may have changed them while this tab was hidden
document.addEventListener('visibilitychange', () => { const s = !document.hidden && vpPrefs.get(); if (s) { ST.vol = s.volume; ST.muted = s.muted; vol.value = s.volume; applyGain(); render(); } });
seek.addEventListener('pointerdown', () => { scrubbing = true; resumeAfterScrub = ST.playing; pause(); });
seek.addEventListener('input', () => showFrame(+seek.value));
const endScrub = () => { if (!scrubbing) return; scrubbing = false; if (resumeAfterScrub) play(); };
seek.addEventListener('pointerup', endScrub);
seek.addEventListener('change', endScrub);
for (const b of document.querySelectorAll('.bar button')) b.addEventListener('click', () => b.blur());
// The browser lets sound start only after a click or a key in this page.
addEventListener('pointerdown', unlock, true);
addEventListener('keydown', unlock, true);

addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.closest && e.target.closest('select')) return;
  const k = e.key;
  let handled = true;
  if (k === ' ' || k === 'k' || k === 'K') { if (!e.repeat) toggle(); }
  else if (k === 'ArrowLeft') e.shiftKey ? jump(-1) : step(-1);
  else if (k === 'ArrowRight') e.shiftKey ? jump(1) : step(1);
  else if (k === ',' || k === '<') step(-1);
  else if (k === '.' || k === '>') step(1);
  else if (k === 'Home') showFrame(0);
  else if (k === 'End') { pause(); showFrame(FRAMES - 1); }
  else if (k === 'm' || k === 'M') setMuted(!ST.muted);
  else if (k === 'l' || k === 'L') setLoop(!ST.loop);
  else if (k === 'f' || k === 'F') fullscreen();
  else handled = false;
  if (handled) e.preventDefault();
});

setT(0); anchor(); fit(); render();
</script>
