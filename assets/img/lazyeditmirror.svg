<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<title>LazyEditMirror: cut the front camera once, the side camera follows</title>
<defs>
	<linearGradient id="bg" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#17142a"/><stop offset="1" stop-color="#0c0a14"/></linearGradient>
	<radialGradient id="glow" cx="960" cy="200" r="700" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7c3aed" stop-opacity=".3"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
	<radialGradient id="glow2" cx="1500" cy="980" r="600" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ec4899" stop-opacity=".14"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
	<linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
	<linearGradient id="v1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
	<linearGradient id="v2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22c3dd"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
