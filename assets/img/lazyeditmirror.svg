	<clipPath id="lanes"><rect x="420" y="370" width="1180" height="460"/></clipPath>
</defs>
<style>
*{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.3,.7,.2,1)}
.junk{transform-box:fill-box;transform-origin:center;animation-name:junk}
