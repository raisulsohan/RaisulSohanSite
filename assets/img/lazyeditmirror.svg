.s1{animation-name:s1}.s2{animation-name:s2}.s3{animation-name:s3}
@keyframes s1{0%,26.25%{opacity:1}28.75%,97.50%{opacity:0}100%{opacity:1}}
@keyframes s2{0%,26.25%{opacity:0}28.75%,48.75%{opacity:1}51.25%,100%{opacity:0}}
@keyframes s3{0%,48.75%{opacity:0}51.25%,95.00%{opacity:1}97.50%,100%{opacity:0}}
